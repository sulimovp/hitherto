name: Publish to PyPI

# Trusted publishing — no API token on the laptop.
# One-time setup on https://pypi.org/manage/account/publishing/:
#   Owner: sulimovp   Repo: casefile   Workflow: publish.yml   Environment: pypi
# Then: git tag v0.1.0 && git push origin v0.1.0

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
