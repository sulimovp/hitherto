  title: My approach to calling tools over a web socket connection
  body: "To begin, if you haven't had a chance to read my blog post where I introduced Jessie, I had included\
    \ a demo video. Its relevance centers on how Jessie uses an audio channel for interaction. My setup\
    \ incorporates a remote node that performs voice transcription, then that is fed to my Apertus server\
    \ (in a separate room) over a web socket connection.\r\n\r\nFor interactive requests, Jessie streams\
    \ her response back to the remote node, which is then sent to the synthesis service as a socket stream.\
    \ The synthesis service assembles sentence-based chunks so that I can convert the entire output faster\
    \ than waiting for a full response.\r\n\r\nBut what about that command to turn on the lights at the\
    \ beginning of the video? That is where I employ a small little trick I have labeled a \"peek.\" In\
    \ my experiments, the tokenization and inference time of my prompt is blazing fast. If I recall, it's\
    \ around 300ms. The full response time is consumed through token generation, which is why a streaming\
    \ connection is so crucial: it creates an impression for us humans that it is fast because we can\
    \ see characters rendering on the screen (assuming that the web UI has this implemented, of course).\r\
    \n\r\nWhen an endpoint is connected via a web socket connection, the API handler first calls vLLM's\
    \ standard HTTP endpoint. I include the tools available to Apertus and make the call with a very small\
    \ max token limit -- about 50 max tokens. Even though the response is severely truncated, it is enough\
    \ to check whether Apertus would have responded with a tool call or a regular text response. That\
    \ allows me to fork the function.\r\n\r\nIf the response is not a tool, I allow the endpoint to continue\
    \ as a normal streaming call.\r\n\r\nHowever, if the response is a tool then I make a full call to\
    \ the HTTP endpoint to get the tool action. The system performs the action (like turning the lights\
    \ on) and the results are fed back to Apertus to generate a user-friendly response. That is what returns\
    \ to the originating client.\r\n\r\nThe obvious downside is that this creates multiple calls to the\
    \ model. To be fair, though, I did stress testing and saw barely a budge in increased thermal activity.\
    \ This was with 2 concurrent requests every second, a 5 min interval loop simulating an agentic job,\
    \ and then a tool call thread executing every 30-90 seconds, all over a two-hour time span.\r\n\r\n\
    Hopefully this inspires you with your Apertus implementation.\r\n\r\n_***This article was written\
    \ by me, but Jessie did the editing!***_\r\n\r\n**Here is the video I mention**\r\n[![Meet Jessie!](https://cdn-uploads.huggingface.co/production/uploads/686dcb8ece8f66dc0a587ecf/am2-X4jWUNgbnsrnclb1C.png)](https://youtu.be/geX3Q9Wi81Y)"
  bucket: assigner_false
