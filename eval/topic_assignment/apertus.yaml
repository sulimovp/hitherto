  number: 14
  source: hub
  url: https://huggingface.co/swiss-ai/Apertus-8B-Instruct-2509/discussions/14
  topic: null
  title: 'Suggestion: Sentence Transformer based on Apertus-8B-Instruct for Swiss GLAM, Memobase & Research'
  body: "Dear swiss-ai team,\r\n\r\nThank you very much for your impressive work and for making Apertus-8B-Instruct\
    \ available to the community. This model is a valuable contribution to the Swiss AI ecosystem.\r\n\
    \r\nFor many use cases in the swiss GLAM sector, in research, and specifically for Memobase, a dedicated\
    \ Sentence Transformer based on your LLM would be extremely beneficial. Our goal is to enable robust\
    \ semantic search in multilingual cultural heritage databases, which would directly support institutions\
    \ like Memobase and similar projects.\r\n\r\nMemobase is the Swiss aggregation platform for searching\
    \ and accessing digitized cultural AV heritage operated by Memoriav, the association for the preservation\
    \ of AV heritage in Switzerland.\r\n\r\nWould you consider training and releasing a (compact) Sentence\
    \ Transformer derived from Apertus-8B-Instruct as a community resource? This would greatly support\
    \ Swiss GLAM organizations, Memobase, and the research community.\r\n\r\nThank you for your consideration\
    \ and for your outstanding work!\r\n\r\nBest regards,\r\nDaniel\n\nyes it would be great if the community\
    \ would help creating embedding models from apertus. this can be done for example by distillation\
    \ and finetuning on an adjusted embedding objective. \n\nhere is some example by another contributor:\
    \ https://huggingface.co/speakdatawith/Apertus-8B-2509-Encoder\n"
  bucket: assigner_false
