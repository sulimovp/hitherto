- repo: swiss-ai/Apertus-8B-Instruct-2509
  number: 29
  source: hub
  url: https://huggingface.co/swiss-ai/Apertus-8B-Instruct-2509/discussions/29
  topic: null
  title: 'Apertus + vLLM: My Configuration Guide'
  body: "**Hardware**: ASUS TUF Gaming RTX 3090 (24 GB VRAM)\r\n**vLLM**: v0.19.1 (v0.19.0 was the first\
    \ release with native Apertus model support; v0.19.1 adds LoRA)\r\n**Deployment**: vLLM served via\
    \ the official `vllm/vllm-openai` container image, fronted by a FastAPI application server. Coqui\
    \ TTS also runs on the same GPU for voice synthesis.\r\n\r\n---\r\n\r\n### Quantization\r\n\r\n```\r\
    \n--quantization bitsandbytes\r\n--dtype auto\r\n```\r\n\r\n4-bit bitsandbytes (QLoRA-compatible)\
    \ quantization brings the model from ~16 GB down to approximately 6 GB of VRAM, essential on a 24\
    \ GB card that has to share with other processes. `--dtype auto` lets vLLM pick the right compute\
    \ dtype to complement the quantization without manual tuning.\r\n\r\n**Gotcha**: `--quantization bitsandbytes`\
    \ requires using `--load-format safetensors` together with `--safetensors-load-strategy eager`. Without\
    \ the eager load strategy, bitsandbytes can fail to quantize correctly on load.\r\n\r\n---\r\n\r\n\
    ### KV Cache\r\n\r\n```\r\n--kv-cache-dtype fp8\r\n```\r\n\r\nfp8 KV cache halves the memory footprint\
    \ of the attention cache compared to fp16/bf16. This matters more than it might seem: KV cache scales\
    \ non-linearly with context length and sequence count. With a 20K context window and another process\
    \ (TTS) competing for VRAM, fp16 KV cache consistently caused OOM. fp8 resolved it.\r\n\r\n---\r\n\
    \r\n### GPU Memory Utilization\r\n\r\n```\r\n--gpu-memory-utilization 0.73\r\n```\r\n\r\nThis is the\
    \ fraction of GPU VRAM that vLLM is allowed to claim for its memory pool (model weights + KV cache).\
    \ The default is 0.90, which would starve Coqui TTS. I landed on 0.73 empirically: low enough that\
    \ TTS synthesis doesn't OOM, high enough to keep a useful KV cache. If you're running vLLM alone on\
    \ this card, you can push this to 0.90.\r\n\r\n---\r\n\r\n### Context Window\r\n\r\n```\r\n--max-model-len\
    \ 20480\r\n```\r\n\r\nThe model supports up to 65K tokens, but allocating the full KV cache for 65K\
    \ on a shared 24 GB card isn't feasible. 20,480 covers real-world use (conversation history, tool\
    \ definitions, system prompt, response) without exhausting VRAM.\r\n\r\n---\r\n\r\n### Concurrency\r\
    \n\r\n```\r\n--max-num-seqs 4\r\n```\r\n\r\nMaximum parallel in-flight requests. 4 is a practical\
    \ ceiling given the VRAM budget — a higher value increases KV cache demand and risks OOM under load.\
    \ For a home/personal server with occasional concurrent users, 4 is comfortable.\r\n\r\nHere is a\
    \ theoretical breakdown of GPU VRAM needed to support the full 65k token limit of Apertus at FP8 and\
    \ 0.90 GPU memory utilization.\r\n\r\n| Concurrency | KV cache | Weights + overhead Total | VRAM needed\
    \ |\r\n| --- | --- | --- | --- |\r\n| 1 sequence | 4.0 GB | ~6.0 GB | ~10 GB |\r\n| 2 sequences |\
    \ 8.0 GB | ~6.0 GB | ~14 GB |\r\n| 4 sequences | 16.0 GB | ~6.0 GB | ~22 GB |\r\n| 8 sequences | 32.0\
    \ GB | ~6.0 GB | ~38 GB |\r\n\r\n---\r\n\r\n### Prefix Caching\r\n\r\n```\r\n--enable-prefix-caching\r\
    \n--no-enable-chunked-prefill\r\n```\r\n\r\nPrefix caching reuses KV cache entries for common prompt\
    \ prefixes (system prompt, tool definitions, repeated context). In practice I am seeing ~35% cache\
    \ hit rate on conversational workloads, which meaningfully reduces prompt processing time on repeat\
    \ calls.\r\n\r\nChunked prefill is disabled because it conflicts with prefix caching in vLLM v0.19.x\
    \ when bitsandbytes quantization is active.\r\n\r\n---\r\n\r\n### CUDAGraphs\r\n\r\nBy default, vLLM\
    \ uses CUDA graph capture to optimize GPU kernel execution. An older workaround flag — `--enforce-eager`\
    \ — disables this and falls back to eager execution.\r\n\r\n**Gotcha (and important lesson)**: I had\
    \ originally added `--enforce-eager` to work around segfaults during container startup. It turned\
    \ out this was a **red herring** as the real cause was using a generic base container image rather\
    \ than the official `vllm/vllm-openai` image. The official image includes the correct CUDA/PyTorch\
    \ runtime that vLLM expects. Switching to it resolved all segfault issues, including a separate LoRA-related\
    \ segfault. Removing `--enforce-eager` then came for free, and the result was significant: **tool\
    \ call response tim"
  bucket: assigner_false
- repo: swiss-ai/Apertus-8B-Instruct-2509
  number: 28
  source: hub
  url: https://huggingface.co/swiss-ai/Apertus-8B-Instruct-2509/discussions/28
  topic: null
  title: 'RCA: vLLM SEGFAULT when loading Apertus model (RESOLVED)'
  body: "Below is a Root Cause Analysis on the SEGFAULT failure I was having with Apertus. In the end,\
    \ I think I may have just been using the wrong CUDA base image, even before the upgrade. Either way,\
    \ I am happy to state that with @loleg ‘s recommendation I was able to get tuned module loaded and\
    \ working. Great news!\r\n—\r\n# vLLM 0.19.1 Segfault Investigation — Apertus-8B-Instruct-2509\r\n\
    \r\n**Environment:** RTX 3090 (SM86, 24GB) · Ubuntu 25.04 · NVIDIA driver 580.95.05  \r\n**vLLM:**\
    \ 0.19.1 · **PyTorch:** 2.10.0+cu128  \r\n**Model:** `swiss-ai/Apertus-8B-Instruct-2509`\r\n\r\n>\
    \ **RESOLVED** — Use the official `docker.io/vllm/vllm-openai:latest` pre-built image.\r\n> Custom-built\
    \ containers segfault regardless of flags or driver version.\r\n> See [Resolution](#resolution) section\
    \ below.\r\n\r\n---\r\n\r\n## Symptom\r\n\r\nvLLM 0.19.1 starts, loads model weights cleanly (15.02\
    \ GiB, ~3.5s), then crashes\r\nevery time during the profiling/warmup forward pass:\r\n\r\n```\r\n\
    (EngineCore pid=168) INFO [gpu_model_runner.py:4820] Model loading took 15.02 GiB memory and 3.452513\
    \ seconds\r\n!!!!!!! Segfault encountered !!!!!!!\r\n  ...\r\n  File \"<unknown>\", line 0, in 0xffffffffffffffff\r\
    \n\r\nRuntimeError: Engine core initialization failed.\r\n```\r\n\r\nThe `0xffffffffffffffff` at the\
    \ bottom of the Python stack trace indicates C-level stack\r\ncorruption, not a Python exception.\r\
    \n\r\n---\r\n\r\n## Variables Eliminated (All Failed — Crash Identical)\r\n\r\n| What we tried | Rationale\
    \ | Result |\r\n|---|---|---|\r\n| Remove bitsandbytes quantization | Avoid quantization-related kernel\
    \ bugs | Still crashes |\r\n| Remove LoRA | Avoid adapter loading issues | Still crashes |\r\n| Remove\
    \ fp8 KV cache | Avoid non-standard cache dtype | Still crashes |\r\n| `--attention-backend TRITON_ATTN`\
    \ | Swap out FlashAttention 2 entirely | Still crashes |\r\n| `--compilation-config '{\"pass_config\"\
    :{\"fuse_norm_quant\":false,\"fuse_act_quant\":false}}'` | Disable custom Apertus CUDA fusion ops\
    \ | Still crashes |\r\n| `--enforce-eager` (disable torch.compile) | Remove Inductor/Dynamo from the\
    \ picture | Still crashes (even earlier — no Dynamo) |\r\n| Strip all flags (bare minimum run) | Rule\
    \ out interaction between our custom flags | Still crashes |\r\n| Ran `Qwen/Qwen2.5-7B-Instruct` through\
    \ same container | Rule out Apertus-specific model bug | **Still crashes — engine-level bug** |\r\n\
    | Verified basic CUDA matmul works in container | Rule out broken GPU passthrough | Passes — CUDA\
    \ is functional |\r\n\r\n### Key observations\r\n\r\n- With `--enforce-eager`: crash happens immediately\
    \ after weight loading (no compilation)\r\n- Without `--enforce-eager`: crash happens after `Dynamo\
    \ bytecode transform time: ~3s` (during first compiled kernel launch)\r\n- Both paths crash — the\
    \ bug is not in compilation, it's in **kernel execution**\r\n- Qwen2.5-7B crashes identically — **not\
    \ model-specific**, it's the engine on this machine\r\n\r\n---\r\n\r\n## Initial Hypothesis (Incorrect)\r\
    \n\r\n**Initial theory: NVIDIA driver 570 was incompatible with torch 2.10.0 + vLLM 0.19.1.**\r\n\r\
    \nThe `0xffffffffffffffff` stack corruption looked consistent with a driver/runtime ABI\r\nmismatch\
    \ — a bad function pointer or null kernel handle. Driver was upgraded from\r\n570 → 580 during the\
    \ investigation.\r\n\r\n**This was wrong.** The crash persisted on driver 580 when using a custom-built\r\
    \ncontainer. The driver upgrade was a red herring (or at best a necessary-but-not-sufficient\r\ncondition\
    \ that couldn't be isolated). See [Actual Root Cause](#actual-root-cause) below.\r\n\r\n### Note on\
    \ PyTorch pinning\r\n\r\n`uv pip install vllm==0.19.1 --torch-backend=cu128` pulls `torch==2.10.0`\
    \ (vLLM's hard\r\ndependency). Downgrading PyTorch is not an option:\r\n\r\n```\r\nBecause vllm==0.19.1\
    \ depends on torch==2.10.0 and you require vllm==0.19.1,\r\nwe can conclude that you require torch==2.10.0.\r\
    \nAnd because you require torch==2.7.0, we can conclude that your requirements\r\nare unsatisfiable.\r\
    \n```\r\n\r\n---\r\n\r\n## Actual Root Cause\r\n\r\n**Custom `FROM nvidia/cuda:*` container builds\
    \ produce CUDA kernel/library mismatches.**\r\n\r\nWhen vLLM is built in"
