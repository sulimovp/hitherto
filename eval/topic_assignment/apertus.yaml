  title: How do you use t5gemma decoder with a different encoder?
  body: "I am trying to combine the t5gemma decoder with a pretrained deberta encoder that I have trained\
    \ from scratch using `EncoderDecoderModel`. \n\nHere is the code:\n\n```\nmodel_1 = \"WikiQuality/pre_filtered.am\"\
    \nmodel_2 = \"google/t5gemma-2b-2b-ul2\"\n\nencoder = AutoModel.from_pretrained(model_1)\ndecoder\
    \ = AutoModel.from_pretrained(model_2, dtype=torch.bfloat16)\n\nmodel = EncoderDecoderModel(encoder=encoder,\
    \ decoder=decoder)\n```\n\nThe above code raises the error:\n```\nAttributeError: 'T5GemmaConfig'\
    \ object has no attribute 'hidden_size'\n```\n\nFrom this I understand that `hidden_size` is accesible\
    \ from `decoder.config.decoder.hidden_size` and not `decoder.config.hidden_size`, which is where EncoderDecoderModel\
    \ is looking. So I change my code to load the encoder-decoder model to this:\n\n```\nmodel = EncoderDecoderModel(encoder=encoder,\
    \ decoder=decoder.decoder)\n```\nThis gives me the following error:\n\n```\nValueError: Unrecognized\
    \ model identifier: t5_gemma_module. Should contain one of aimv2, aimv2_vision_model, albert, align,\
    \ altclip, apertus, arcee, aria, aria_text, audio-spectrogram-transformer, autoformer, aya_vision,\
