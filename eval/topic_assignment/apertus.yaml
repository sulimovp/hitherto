  body: "<!-- markdownlint-disable -->\r\n\r\nHello the Team !\r\n\r\nI re-open an [old PR for apertus,](https://github.com/vllm-project/vllm/pull/26307)\
    \ but I upgrade the tool parser based on the new vLLM versions\r\n\r\n## Purpose\r\n\r\nAdd Apertus\
    \ tool parser class\r\n\r\nFix Apertus jinja template to accept both tool call format (chat/completion\
    \ and responses), and multi turn tool call\r\n\r\n```json\r\n# Chat Completions API\r\n{\r\n  \"type\"\
    : \"function\",\r\n  \"function\": {\r\n    \"name\": \"get_weather\",\r\n    \"description\": \"\
    Determine weather in my location\",\r\n    \"strict\": true,\r\n    \"parameters\": {\r\n      \"\
    type\": \"object\",\r\n      \"properties\": {\r\n        \"location\": {\r\n          \"type\": \"\
    string\",\r\n        },\r\n      },\r\n      \"additionalProperties\": false,\r\n      \"required\"\
    : [\r\n        \"location\",\r\n        \"unit\"\r\n      ]\r\n    }\r\n  }\r\n}\r\n\r\n# Responses\
    \ API\r\n{\r\n  \"type\": \"function\",\r\n  \"name\": \"get_weather\",\r\n  \"description\": \"Determine\
    \ weather in my location\",\r\n  \"parameters\": {\r\n    \"type\": \"object\",\r\n    \"properties\"\
    : {\r\n      \"location\": {\r\n        \"type\": \"string\",\r\n      },\r\n    },\r\n    \"additionalProperties\"\
    : false,\r\n    \"required\": [\r\n      \"location\",\r\n      \"unit\"\r\n    ]\r\n  }\r\n}\r\n\r\
    \n```\r\n\r\n## Test Plan\r\n\r\nTest on `swiss-ai/Apertus-70B-Instruct-2509` with 4xL40s with the\
    \ base image `docker.io/vllm/vllm-openai:v0.10.2`\r\nWith and without streaming\r\n\r\nTesting code:\r\
    \n```python\r\n@pytest.fixture()\r\ndef sample_tool_schema():\r\n    return {\r\n        \"type\"\
    : \"function\",\r\n        \"function\": {\r\n            \"name\": \"calculate_sum\",\r\n       \
    \     \"description\": \"Calculate the sum of two numbers\",\r\n            \"parameters\": {\r\n\
    \                \"type\": \"object\",\r\n                \"properties\": {\r\n                  \
    \  \"a\": {\"type\": \"number\", \"description\": \"First number\"},\r\n                    \"b\"\
    : {\"type\": \"number\", \"description\": \"Second number\"},\r\n                },\r\n          \
    \      \"required\": [\"a\", \"b\"],\r\n            },\r\n        },\r\n    }\r\n    \r\n@pytest.mark.order(3)\r\
    \ndef test_tool_calling(get_client, sample_tool_schema):\r\n    \"\"\"Test tool calling functionality\"\
    \"\"\r\n    client, model, config = get_client\r\n    if config[\"tool_calling\"]:\r\n        response\
    \ = client.chat.completions.create(\r\n            model=model,\r\n            messages=[{\"role\"\
    : \"user\", \"content\": \"Calculate the sum of 15 and 27\"}],\r\n            tools=[sample_tool_schema],\r\
    \n            max_tokens=300,\r\n        )\r\n\r\n        assert response is not None\r\n        assert\
    \ hasattr(response, \"choices\")\r\n        assert len(response.choices) > 0\r\n        choice = response.choices[0]\r\
    \n\r\n        # Check if tool was called\r\n        assert choice.message.tool_calls\r\n        tool_call\
    \ = choice.message.tool_calls[0]\r\n        assert tool_call.function.name == \"calculate_sum\"\r\n\
    \        assert tool_call.function.arguments is not None\r\n        args = json.loads(tool_call.function.arguments)\r\
    \n        assert \"a\" in args\r\n        assert \"b\" in args\r\n    else:\r\n        pytest.skip(f\"\
    Model {model} does not support tool_calling functionality\")\r\n```\r\n\r\nOr testing curl multi turn\
    \ tool call\r\n\r\n```\r\ncurl -X POST 'http://localhost:8000/v1/chat/completions' \\\r\n  --header\
    \ 'User-Agent: yaak' \\\r\n  --header 'Accept: */*' \\\r\n  --header 'Content-Type: application/json'\
    \ \\\r\n  --data '{\r\n  \"stream\": true,\r\n  \"temperature\": 0.13,\r\n  \"tools\": [\r\n    {\r\
    \n      \"type\": \"function\",\r\n      \"function\": {\r\n        \"name\": \"get_weather\",\r\n\
    \        \"description\": \"Get current weather information for a specific city location\",\r\n  \
    \      \"parameters\": {\r\n          \"type\": \"object\",\r\n          \"properties\": {\r\n   \
    \         \"location\": {\r\n              \"type\": \"string\",\r\n              \"description\"\
    : \"The city and country, e.g. \\'London, UK\\' to get the weather\"\r\n            }\r\n        \
    \  },\r\n          \"required\": [\r\n            \"location\"\r\n          ],\r\n          \"additionalProperties\"\
    : false\r\n        },\r\n        \"strict\": true\r\n      }\r\n    }\r\n  ],\r\n  \"messages\": [\r\
    \n    {\r\n      \"role\": \"user\",\r\n      \"content\": \"What is the weather like in Paris today\
    \ and London ?\"\r\n"
