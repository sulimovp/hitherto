    \ \\\r\n    --enable-prefix-caching \\\r\n    --max-num-seqs 128 \\\r\n    --max-num-batched-tokens\
    \ 65536 \\\r\n    --block-size 16 \\\r\n    --enable-auto-tool-choice \\\r\n    --tool-call-parser\
    \ apertus \\\r\n    --reasoning-parser apertus \\\r\n    --chat-template-content-format string\r\n\
