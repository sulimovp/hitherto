- repo: ggml-org/llama.cpp
  number: 26226
  source: github
  url: https://github.com/ggml-org/llama.cpp/pull/26226
  topic: null
  title: 'core : support output vocab size distinct from embedding vocab size'
  body: "## Overview\r\n\r\n`llama_vocab::n_tokens()` controls both the embedding table and the logits/sampling\
    \ buffers. They have identical size for all current arches, and were thus never separated, but the\
    \ relationship is also baked in the public API (`include/llama.h` logits stride `output_ids[i]*n_vocab`).\r\
    \n\r\n[Apertus v1.5 (`swiss-ai/Apertus-v1.5-8B`)](https://huggingface.co/swiss-ai/Apertus-v1.5-8B)\
    \ consumes text/image/audio tokens but outputs only text, meaning its `lm_head` is indeed smaller\
    \ than the embedding table (confirmed from `config.json` of the checkpoint plus `.safetensors` header):\r\
    \n\r\n```\r\nvocab_size = 266752   # embed_tokens -> [266752, 4096]\r\noutput_vocab_size = 131072\
    \   # lm_head      -> [131072, 4096]   (untied)\r\n```\r\n\r\nThe 135,680 excess rows are control\
    \ and discrete image/audio tokens which occur only in input ID space, never as output. Unadulterated\
    \ llama.cpp will either reject the `lm_head` (mismatched shape), or (in case of forcing) allocate\
    \ the logits buffer for the bigger embedding vocabulary, thus corrupting data on every subsequent\
    \ `ggml_backend_tensor_get_async` fill operation.\r\n\r\n**Fix:** Use the same `n_embd_out_impl` /\
    \ `LLM_KV_EMBEDDING_LENGTH_OUT` strategy for vocab size. Adds an optional GGUF key `%s.vocab_size_out`\
    \ and `llama_model::n_vocab_out()` (= `n_vocab_out_impl > 0 ? n_vocab_out_impl : vocab.n_tokens()`).\
    \ Now the few logits/sampling buffer allocation points in `llama-context.cpp` use `n_vocab_out()`\
    \ while `vocab.n_tokens()` keeps controlling the embedding\r\n\r\n## Additional information\r\n\r\n\
    Apertus v1.5 is the only consumer today. I can't name a second in-tree model that needs it. Implemented\
    \ as a minimal generic mechanism rather than an Apertus-specific hack because that was cheaper and\
    \ safer in `llama-context.cpp`, not because it's built ahead of demand. Cost is effectively zero at\
    \ runtime. the one real tradeoff is a layer of indirection (`n_vocab_out()` vs `vocab.n_tokens()`)\
    \ in a hot shared file. happy to reshape or narrow if preferred.\r\n\r\n## Requirements\r\n\r\n- [x]\
    \ I have read and agree with the [contributing guidelines](https://github.com/ggml-org/llama.cpp/blob/master/CONTRIBUTING.md)\r\
    \n- [x] AI usage disclosure: Yes, it was predominately AI written by Sonnet 5 with steering.\r\n"
  bucket: assigner_false
- repo: ggml-org/llama.cpp
  number: 26224
  source: github
  url: https://github.com/ggml-org/llama.cpp/issues/26224
  topic: null
  title: 'core: support output vocab size distinct from embedding vocab size'
  body: "## Problem\n\n`llama_vocab::n_tokens()` is currently the single source of truth for both:\n-\
    \ the embedding table row count (`tok_embd`)\n- the logits/sampling buffer width, via the public API\
    \ contract documented at\n  `llama_get_logits(ctx) + output_ids[i]*n_vocab` (include/llama.h)\n\n\
    This assumes embedding rows == output rows, which holds for every architecture\ncurrently in the tree.\
    \ It does not hold for swiss-ai/Apertus-v1.5-8B: its\n`embed_tokens.weight` is `[266752, 4096]` while\
    \ `lm_head.weight` is a separate,\nuntied `[131072, 4096]` tensor. The extra 135680 ids in the embedding\
    \ table are\nreserved for multimodal (image/audio) input-only tokens that are never valid\nmodel outputs\
    \ - confirmed against the model's own tokenizer_config.json\n(`base_vocab_size: 131072`, matching\
    \ lm_head exactly; the rest are \"added\ntokens\").\n\nLoading such a model today either fails outright\
    \ (output tensor shape\nmismatch) or requires fabricating ~135680 output rows that don't exist in\
    \ the\ncheckpoint, just to keep n_vocab symmetric.\n\n## Proposed fix\n\nMirror the existing `n_embd_out_impl`\
    \ / `LLM_KV_EMBEDDING_LENGTH_OUT` pattern\n(already used for output embedding dimension overrides):\n\
    \n- new optional GGUF key `%s.vocab_size_out`\n- `hparams.n_vocab_out_impl` (default 0 = no override)\n\
    - `llama_model::n_vocab_out()` returns `n_vocab_out_impl > 0 ? n_vocab_out_impl\n  : vocab.n_tokens()`\n\
    - the ~5 buffer-sizing call sites in `llama-context.cpp` (`decode()`,\n  `encode()`, `output_reserve()`,\
    \ `output_reorder()`, backend-sampler init)\n  switch from `vocab.n_tokens()` to `model.n_vocab_out()`\n\
    \nFor every existing model this is a no-op (n_vocab_out_impl stays 0), so\nbehavior is unchanged unless\
    \ a converter explicitly opts in.\n\n## Status\n\nImplemented and tested locally: full CPU `ci/run.sh`\
    \ (debug+release ctest,\nmodel-based smoke tests) passes 100%, plus manual regression testing against\n\
    a real model (Qwen2.5-0.5B-Instruct) confirming no behavior change. PR to\nfollow.\n\nThis is a prerequisite\
    \ for Apertus v1.5 support, split out as its own PR per\nthe \"separate PRs per feature\" guideline\
    \ in CONTRIBUTING.md."
  bucket: assigner_false
