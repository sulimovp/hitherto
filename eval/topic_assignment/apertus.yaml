  number: 10
  source: hub
  url: https://huggingface.co/swiss-ai/Apertus-8B-Instruct-2509/discussions/10
  topic: apertus format
  title: Potentially wrong tokenization of conversations
  body: "Hello. This is your example from the readme:\r\n\r\n```\r\nprompt = \"Give me a brief explanation\
    \ of gravity in simple terms.\"\r\nmessages_think = [\r\n    {\"role\": \"user\", \"content\": prompt}\r\
    \n]\r\n\r\ntext = tokenizer.apply_chat_template(\r\n    messages_think,\r\n    tokenize=False,\r\n\
    \    add_generation_prompt=True,\r\n)\r\nmodel_inputs = tokenizer([text], return_tensors=\"pt\").to(model.device)\r\
    \n```\r\n\r\n`tokenizer.apply_chat_template` adds a BOS token at the beginning of the string. Further\
    \ tokenization with `tokenizer([text], return_tensors=\"pt\")` adds a second BOS token. I suppose\
    \ it is not desired behaviour.\n\nHi, thanks for your comment. You are right, it's not the desired\
    \ behavior. We will update the README accordingly. You should disable the special tokens when tokenizing\
    \ the text: `model_inputs = tokenizer([text], return_tensors=\"pt\", add_special_tokens=False)`.\n\
    \nHello, I updated the README. I will close this issue."
  bucket: assigner_false
