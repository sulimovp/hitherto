    \nThere is a mirror with open issues on Codeberg: \nhttps://codeberg.org/loleg/fastapi-apertus/ \n\
    \nFor hosting on Hugging Face, a minimum of 1xL4 (30GB RAM, 24GB VRAM) is suggested, even though I've\
    \ put in some memory-saving measures and 16GB VRAM should be enough. The same applies to running the\
