  title: What I am building with Apertus
  body: "Here is a blog entry about what I have been doing with Apertus.\r\n\r\nMeet Jessie: my home’s\
    \ ambient intelligence, a 100% private, locally run AI agent that works with no internet connection.\
    \ Jessie handles smart-home control (lights, garage) and general Q&A and storytelling for my kids,\
    \ entirely offline.\r\n\r\nWhy: a decade ago, our Alexa blurted out at dinner, “I’ve put frozen pakakastuffnickles\
    \ on your shopping list.” Nobody spoke to it, it could not explain itself, and it was the moment I\
    \ knew the home is too intimate to be a SaaS endpoint.\r\n\r\nWrite-up + demo video: https://danielkonopacki.com/2026/05/12/meet-jessie/\r\
    \n\r\nI'll keep sharing deployment notes as I continue my effort!"
