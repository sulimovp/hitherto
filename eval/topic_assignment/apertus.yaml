- repo: ochafik/minja
  number: 18
  source: github
  url: https://github.com/ochafik/minja/issues/18
  topic: apertus format
  title: 'Feature: Auto-convert reasoning_content to content.blocks format for Apertus template'
  body: "## Feature Request\n\nThe Apertus template uses a unique format for reasoning content:\n\n- Standard\
    \ format: message.reasoning_content = \"text\"\n- Apertus format: message.content = {\"blocks\": [{\"\
    type\": \"thoughts\", \"text\": \"...\"}]}\n\n## Models Using Blocks Format\n\nBased on research of\
    \ templates in llama.cpp, there are multiple variants:\n\n1. Apertus - Uses content.blocks format\
    \ with types: thoughts, tool_calls, tool_outputs, response\n2. Ministral 14B Reasoning - Uses message\
    \ content as array of blocks (text, thinking, image, image_url)\n3. Mistral-Small 3.2-24B - Similar\
    \ array-based blocks\n4. unsloth-mistral-Devstral-Small - Similar array-based blocks\n\n## OpenAI\
    \ Standard\n\nOpenAI uses a different approach - they keep content as string and add reasoning_content\
    \ field:\n{\n  \"role\": \"assistant\",\n  \"content\": \"This is the actual response text\",\n  \"\
    reasoning_content\": \"This is the reasoning/thinking process\"\n}\n\nThis is different from blocks\
    \ format. Also see o1 reasoning format, DeepSeek V3, Qwen thinking, GLM-4.6"
  bucket: assigner_positive
