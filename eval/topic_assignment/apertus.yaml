  title: Experimental Ollama MLX source preview for Apertus 1.5 on Apple Silicon
  body: "# Experimental Ollama MLX source preview for Apertus 1.5 on Apple Silicon\n\nI’ve been experimenting\
    \ with Ollama improvements for Apple Silicon / MLX and prepared an experimental source preview that\
    \ includes Apertus 1.5 support, including text, image, and audio inputs.\n\nThe main reason I’m sharing\
    \ this here is that the branch makes it possible to experiment with Apertus 1.5 multimodal capabilities\
    \ through Ollama on Apple Silicon. In my local testing, Apertus 1.5 can process image inputs and long\
    \ audio inputs, including audio clips up to around 600 seconds. The same branch also includes Gemma\
    \ 4 image support, which has been useful for image-reading experiments.\n\nSome local measurements\
    \ from my M5 Max test machine:\n\n| Model | Disk size | Resident model size | Cold load | Prompt eval\
    \ | Hot decode |\n| --- | ---: | ---: | ---: | ---: | ---: |\n| Apertus 1.5 8B BF16 media | 18.18\
    \ GB | 18.19 GB | 1.054 s | 502.7 tok/s | 30.94 tok/s |\n| Apertus 1.5 8B NVFP4 media | 7.37 GB |\
    \ 7.40 GB | 0.753 s | 524.1 tok/s | 104.35 tok/s |\n\nFor a screenshot-scale image test, the current\
    \ adaptive image sizing path measured about 19.67 GiB MLX peak / 28.4 GiB physical high-water for\
    \ NVFP4. BF16 measured about 29.74 GiB MLX peak / 38.5 GiB physical high-water on the same kind of\
    \ test. Treat these as local experimental numbers, not as a general performance guarantee.\n\nImportant\
    \ caveats:\n\nThis is not an official Ollama release, and I’m not an Ollama contributor. I’m a hobbyist\
    \ experimenting with AI and Apple Silicon support. None of my related commits have been integrated\
    \ into upstream Ollama so far.\n\nThe current preview is source-only. I do not have a signed macOS\
    \ DMG for this one yet because notarization upload is blocked while I’m on holiday with a slow network\
    \ upload :-)\n\nI also cannot publish ready-made Ollama model artifacts for Apertus 1.5, as I understand\
    \ the Apertus 1.5 license does not allow redistribution in that form. Users need to obtain the model\
    \ from the official Apertus 1.5 Hugging Face repository and create their local Ollama model themselves.\n\
    \nPreview page:\n\nhttps://www.doapp.ch/Ollama/index.html\n\nSource branch:\n\nhttps://github.com/pd95/ollama/tree/integration/mlx-preview-v0.31.2-gemma4-apertus15\n\
    \nStable source tag:\n\nhttps://github.com/pd95/ollama/tree/integration/mlx-preview-v0.31.2-gemma4-apertus15\n\
    \nSource archive:\n\nhttps://github.com/pd95/ollama/archive/refs/tags/preview/mlx-0.31.2-apertus15-20260801.tar.gz\n\
    \nBuild dependencies on macOS / Apple Silicon:\n\n- Xcode\n- Metal toolchain:\n\n```bash\nxcodebuild\
    \ -downloadComponent MetalToolchain\n```\n\n- Go\n- CMake 3.24 or newer\n- Ninja is recommended\n\n\
    Build locally:\n\n```bash\ngit clone --branch preview/mlx-0.31.2-apertus15-20260801 https://github.com/pd95/ollama.git\n\
    cd ollama\ncmake -B build .\ncmake --build build --parallel 8\n./ollama serve\n```\n\nI wrote separate\
    \ notes for creating local Ollama models from the official Apertus 1.5 Hugging Face snapshot, including\
    \ the `ollama create --experimental` and quantization commands:\n\nhttps://www.doapp.ch/Ollama/models.html\n\
    \nThis is meant for people who want to experiment with Apertus 1.5 locally through Ollama on Apple\
    \ Silicon before any such support exists in a regular Ollama release.\n----\nEDIT 03.08.2026: Removed\
    \ full-app build instructions  as it does not reliably work without code signing.\n\nthanks a lot!\
    \ is this based on the MLX-PR https://github.com/ml-explore/mlx-lm/pull/1615 or another codebase?\
    \ would you mind making a PR for the code also?\n\nNo, the implementation is “Go native” based on\
    \ the Swiss-AI transformers library enhancement. \nIt was completely written by Codex 5.6. I was just\
    \ prompting and verifying, testing it myself.\nThe various features I developed are available for\
    \ inspection as individual PR to forked main branch here: https://github.com/pd95/ollama/pulls\n\n\
    It is quite difficult to get anything merged upstream into Ollama if you are not an existing contributor…\
    \ which I somehow understand in times where everyone (including myself) uses AI for ev"
  bucket: assigner_false
