  body: "Hello there, I am a non-programmer but am interested in using Apertus since I really appreciate\
    \ the quality and ethics of the model.\r\nI would like to ask what would it take to get Apertus running\
    \ on an iPhone so that I can use it on the go?\r\nThank you from a big fan.\n\nApertus is an R&D project,\
    \ currently there are no plans to develop an app - but I know that such projects exist in our community.\
    \ And even non-programmers can sketch / vibe code an app these days, so give it a go, and let us know\
    \ if you do!\n\nAs a quick lifehack, I have a \"home screen icon\" bookmark to https://chat.publicai.co\
    \ -- a quick and easy to way to interact with Apertus. If you want to use the model offline, stay\
    \ tuned: smaller quantizations should become available soon. \n\nThank you so much for this update,\
    \ I had no idea about PublicAI.co- and I might give a go at a vibe app.\n\nEdit: I decided not to\
    \ use vibe app because of the ethical concerns with vibe coding."
