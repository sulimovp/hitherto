    \r\n XDG_CACHE_HOME=/tmp/vllm-test-cache /opt/venv/bin/python -m pytest \\\r\n    tests/models/multimodal/generation/test_common.py\
    \ \\\r\n    -k apertus_1p5 -v\r\n```\r\n"
