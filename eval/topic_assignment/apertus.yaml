  title: Environmental Impact / Similar Ethical-concerned models
  body: '1. My own concerns and other''s thoughts on data centers leads me to ask what are your thoughts
    on Apertus or Swiss AI''s thoughts on environmental impact regarding data center usage?


    2. This leads me to also ask, are there other models that also care about ethical data sourcing or
    is Swiss AI''s Apertus the only one out there?


    The big reason to ask both of these questions is that using the tool can be genuinely beneficial and
    these questions tend to come up if using the tool becomes a daily occurrence.


    Edit: will Apertus or Swiss AI have a presence on Mastodon?



    Thanks for sharing your questions here. We are working on these topics, and will share findings with
    the community soon.


    There are other models out there, such as [Olmo](https://allenai.org/olmo), [EuroLLM](https://eurollm.io/),
    [SEA-LION](https://sea-lion.ai/), all run by non-profit organizations.


    Please use the #Apertus hashtag on the social media of your choice: we hope you will soon connect
    with our active community!'
