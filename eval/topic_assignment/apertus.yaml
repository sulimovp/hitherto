  number: 21
  source: hub
  url: https://huggingface.co/swiss-ai/Apertus-8B-Instruct-2509/discussions/21
  topic: null
  title: Turing (7.5) support
  body: "Grüezi!\r\n\r\nLove the models, the datasets and the tools. Very helpful. Unfortunately I'm currently\
    \ unable to infer the models on my RTX Titans using vLLM.\r\n\r\nThe Turing parallel computing architecture\
    \ is old but reliable and more than capable providing you optimize for it (sometimes you have to do\
    \ 2 ops instead of 1 but any computation can be done even if it comes at a slight cost in performance).\
    \ Given how common the hardware is and its affordability, I feel it would be beneficial for the accessibility\
    \ of this to model to support this platform. \r\n\r\nI've tried different ways to serve `Apertus-8B-Instruct-2509`\
    \ with vLLM (tried both `v0.11.0`and `v0.10.2`) but they all failed to produce a coherent output.\r\
    \n\r\n```shell\r\ndocker run --runtime nvidia --gpus=all -v ~/.cache/huggingface:/root/.cache/huggingface\
    \ -p 8000:8000 vllm/vllm-openai:v0.11.0 --model swiss-ai/Apertus-8B-Instruct-2509\r\n...\r\n(APIServer\
    \ pid=1) WARNING 10-14 03:27:58 [model.py:1682] Your device 'NVIDIA TITAN RTX' (with compute capability\
    \ 7.5) doesn't support torch.bfloat16. Falling back to torch.float16 for compatibility.\r\n...\r\n\
    (EngineCore_DP0 pid=110) INFO 10-14 03:28:10 [cuda.py:372] Using FlexAttention backend on V1 engine.\r\
    \n...\r\n(EngineCore_DP0 pid=110) ERROR 10-14 03:28:33 [core.py:708] ValueError: not enough values\
    \ to unpack (expected 9, got 3)\r\n...\r\n(APIServer pid=1) RuntimeError: Engine core initialization\
    \ failed. See root cause above. Failed core proc(s): {}\r\n```\r\n[Detailed logs for this error](https://gist.github.com/wasertech/fd579f5b09b2e9e0206dc5dac092791b#file-vllm-err-graph-txt)\r\
    \n\r\nTo solve this error during the graph init., I tried to use the `--enforce-eager` flag but got\
    \ a dtype mismatch that I cannot solve by passing any sort of `--dtype` flag (tried `float16` and\
    \ `half`; results in the same issue).\r\n```shell\r\n❯ docker run --runtime nvidia --gpus=all -v ~/.cache/huggingface:/root/.cache/huggingface\
    \ -p 8000:8000 vllm/vllm-openai:v0.11.0 --model swiss-ai/Apertus-8B-Instruct-2509 --enforce-eager\r\
    \n...\r\n(EngineCore_DP0 pid=110) ERROR 10-14 03:35:08 [core.py:708] RuntimeError: expected mat1 and\
    \ mat2 to have the same dtype, but got: float != c10::Half\r\n...\r\n```\r\n[Detailed logs for this\
    \ error](https://gist.github.com/wasertech/fd579f5b09b2e9e0206dc5dac092791b#file-vllm-err-dtype-txt)\r\
    \n\r\nAny piece of info that drives those models closer to the edge is appreciated.\n\nLooks like\
    \ a [Transformers](https://github.com/huggingface/transformers/issues/30914) error, but the root cause\
    \ is probably in the PyTorch version. There was an accepted PR at vLLM Project to address Turing issues\
    \ last month, [vllm#24022](https://github.com/vllm-project/vllm/pull/24022) - however, this patch\
    \ did not make it into the v0.11.0 release. Try the nightly builds to see you have more luck with\
    \ that issue. In [my blog post](https://log.alets.ch/110/#using-vllm) there's a [Docker Compose script](https://gist.github.com/loleg/33ab522bdf46fee4e58338628ffacc15?ref=log.alets.ch)\
    \ to do just that.\n\nHey @loleg thanks for your reply, sorry it took me so long to come back to this.\
    \ I've tried vllm v0.11.2 and the latest nightly image build but I still have an issue about the new\
    \ pytorch API for FP32. I created a ticket under both [`vllm#29349`](https://github.com/vllm-project/vllm/issues/29349)\
    \ and [`transformers#42371`](https://github.com/huggingface/transformers/issues/42371).\nHope it gets\
    \ addressed soon."
  bucket: assigner_false
