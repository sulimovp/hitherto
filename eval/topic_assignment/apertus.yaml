    \ Also, special thanks to @tomas-polach for the bug-fix contribution, @AryanAhadinia for the reasoning\
    \ parser, and @robmsmt for the double BOS-token fix.\r\n\r\nThis PR depends on transformers [PR](https://github.com/huggingface/transformers/pull/47662).\r\
    \n\r\n  ## Test Plan\r\n\r\n```\r\n  vllm serve apertus-ai/Apertus-v1.5-70B \\\r\n    --max-model-len\
