- repo: vllm-project/vllm
  number: 46813
  source: github
  url: https://github.com/vllm-project/vllm/pull/46813
  topic: apertus format
  title: '[Rust Frontend] Add Rust Apertus tool parser'
  body: "## Purpose\r\n  Add Rust Apertus tool parser (`ApertusToolParser`) for the vLLM Rust frontend.\
    \                                                                                                \
    \                                                                                \r\n  Extracts tool\
    \ calls from the Apertus model format:                                                           \
    \                                                                                                \
    \                                                 \r\n                                           \
    \                                                                                                \
    \                                                                                                \
    \                     \r\n  `<|tools_prefix|>[{\"function_name\": {\"arg\": \"val\"}}, ...]<|tools_suffix|>`\
    \                                                                                                \
    \                                                                                    \r\n        \
    \                                                                                                \
    \                                                                                                \
    \                                                        \r\n  Architecture follows the qwen_coder\
    \ pattern: `take_until_marker` waits for the                                                     \
    \                                                                                                \
    \                           \r\n  suffix marker across chunks, then the complete JSON-array body is\
    \ parsed in one\r\n  shot via `serde_json`. The parser is registered in `ToolParserFactory` with the\
    \                                                                                                \
    \                                                                               \r\n  name `\"apertus\"\
    ` and auto-matched for model IDs containing `\"apertus\"`                                        \
    \                                                                                                \
    \                                                \r\n  (e.g. `swiss-ai/Apertus-8B-Instruct-2509`).\
    \ \r\ncontributing to \"apertus tool parser\" in the Rust frontend roadmap\r\n(https://github.com/vllm-project/vllm/issues/44280).\r\
    \n\r\n## Test Plan\r\n  ```bash                                                                  \
    \                                                                                                \
    \                                                                                     \r\n  # Rust\
    \ unit tests (19 tests)\r\n  cargo test -p vllm-parser apertus                                   \
    \                                                                                                \
    \                                                                                          \r\n  \
    \                                                                                                \
    \                                                                                                \
    \                                                              \r\n  # Full parser regression    \
    \                                                                                                \
    \                                                                                                \
    \                                  \r\n  cargo test -p vllm-parser                               \
    \                                                                                                \
    \                                                                                                \
    \      \r\n                                                                                      \
    \                                                                                                \
    \                                                                          \r\n  # Chat tool parser\
    \ registration tests                                    "
  bucket: assigner_false
