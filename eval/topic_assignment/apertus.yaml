  url: https://github.com/huggingface/transformers/pull/42864
  topic: null
  title: 'fix: Initialize ApertusMLP''s xielu activation using `torch_dtype`'
  body: "# What does this PR do?\r\n\r\nI cannot infer this model architecture on Turing. This fixes the\
    \ issue at the root.\r\n\r\nSee #42371, https://github.com/vllm-project/vllm/issues/29349, https://github.com/vllm-project/vllm/pull/30635\
    \ and https://huggingface.co/swiss-ai/Apertus-8B-Instruct-2509/discussions/21 for context.\r\n\r\n\
    Fixes `RuntimeError: expected m1 and m2 to have the same dtype, but got: float != c10::Half`\r\n\r\
    \nIssue reproduction:\r\n\r\n```py\r\n\r\nimport torch\r\nfrom torch import nn\r\nfrom transformers.models.apertus.configuration_apertus\
    \ import ApertusConfig\r\nfrom transformers.models.apertus.modeling_apertus import ApertusMLP\r\n\
    import sys\r\n\r\ndef test_apertus_mlp_crash():\r\n    print(f\"Python executable: {sys.executable}\"\
    )\r\n    print(\"Testing ApertusMLP crash on float16...\")\r\n    \r\n    # 1. Setup Config with float16\
    \ and xielu\r\n    config = ApertusConfig(\r\n        hidden_size=64,\r\n        intermediate_size=128,\r\
    \n        hidden_act=\"xielu\",\r\n        torch_dtype=\"float16\" # Simulating the runner or user\
    \ choice\r\n    )\r\n    \r\n    # 2. Instantiate MLP\r\n    # We might need to manually set default\
    \ dtype if the model doesn't pick it up from config immediately\r\n    # usage in vllm often sets\
    \ the torch default dtype or casts the model\r\n    torch.set_default_dtype(torch.float16) # Simulating\
    \ \"float16 hardware\" env\r\n    \r\n    try:\r\n        mlp = ApertusMLP(config)\r\n        \r\n\
    \        # Check act_fn dtype\r\n        if hasattr(mlp.act_fn, 'beta'):\r\n             print(f\"\
    XIELU beta dtype: {mlp.act_fn.beta.dtype}\")\r\n        \r\n        # 3. Create Input\r\n        x\
    \ = torch.randn(1, 64, dtype=torch.float16)\r\n        \r\n        # 4. Forward Pass\r\n        output\
    \ = mlp(x)\r\n        print(\"Forward pass successful!\")\r\n        print(f\"Output dtype: {output.dtype}\"\
    )\r\n        \r\n    except RuntimeError as e:\r\n        print(\"\\nCaught expected RuntimeError:\"\
    )\r\n        print(e)\r\n    except Exception as e:\r\n        print(f\"\\nCaught unexpected exception:\
    \ {type(e)}\")\r\n        print(e)\r\n    finally:\r\n         torch.set_default_dtype(torch.float32)\
    \ # Cleanup\r\n\r\nif __name__ == \"__main__\":\r\n    test_apertus_mlp_crash()\r\n\r\n```\r\n\r\n\
    Output Without this patch:\r\n```\r\nPython executable: /home/waser/Projets/Transformers/transformers/venv/bin/python\r\
    \nTesting ApertusMLP crash on float16...\r\nCUDA-fused xIELU not available (No module named 'xielu')\
    \ – falling back to a Python version.\r\nFor CUDA xIELU (experimental), `pip install git+https://github.com/nickjbrowning/XIELU`\r\
    \nXIELU beta dtype: torch.bfloat16\r\n\r\nCaught expected RuntimeError:\r\nexpected m1 and m2 to have\
    \ the same dtype, but got: float != c10::Half\r\n```\r\n\r\nOutput with this patch:\r\n```\r\nPython\
    \ executable: /home/waser/Projets/Transformers/transformers/venv/bin/python\r\nTesting ApertusMLP\
    \ crash on float16...\r\nCUDA-fused xIELU not available (No module named 'xielu') – falling back to\
    \ a Python version.\r\nFor CUDA xIELU (experimental), `pip install git+https://github.com/nickjbrowning/XIELU`\r\
    \n`torch_dtype` is deprecated! Use `dtype` instead!\r\nXIELU beta dtype: torch.float16\r\nForward\
    \ pass successful!\r\nOutput dtype: torch.float16\r\n```\r\n\r\nBig thanks to everyone who helped\
    \ to shape this patch into light."
