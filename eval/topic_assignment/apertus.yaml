- repo: swiss-ai/Apertus-8B-Instruct-2509
  number: 24
  source: hub
  url: https://huggingface.co/swiss-ai/Apertus-8B-Instruct-2509/discussions/24
  topic: null
  title: My private, local home assistant tells my son a story
  body: "Ten years ago I had this vision of making Jarvis real, but I really didn't want to give Jeff\
    \ Bezos the keys to my life. And so it was put on hold... until last year. I'd like to share what\
    \ I've been doing.\r\n\r\nHello, my name is Daniel. I used to be a user experience engineer for Walt\
    \ Disney. I then led a small engineering team who created the web video player for NBC News. Today\
    \ I am part of the group that is involved in Oracle's data center expansion.\r\n\r\nBut in my spare\
    \ time, I have been designing and building my own private AI service to give my home sovereign intelligence.\
    \ \r\n\r\nIt started about two years ago when I discovered Home Assistant, then later as I began playing\
    \ with commercial AI agents, poking at what they could and couldn't do. Somewhere along the way I\
    \ came to realize that Home Assistant could be attached to ChatGPT, and that got me to think... what\
    \ if! And there began the experiments.\r\n\r\nNot knowing about deployment of AI models, I started\
    \ with a small, open sourced version on an 8GB Jetson Nano. It took a little time before I realized\
    \ that the hardware and the model just were not going to help me reach my goals. Simultaneously, I\
    \ was feeling unsettled about both the way that commercial models were created and how the data they\
    \ consumed from everyday users were sucked up.\r\n\r\nI set off to build my own AI server mid-summer\
    \ last year, but I wasn't happy with my model choices. As my parts were en route to me, though, Swiss\
    \ AI announced Apertus, and I knew it was the model I wanted to use: it aligned with my own values,\
    \ and I felt that even the small one would be powerful enough to do what I'd long dreamed about.\r\
    \n\r\nI'd love to tell you that getting everything up and running was cupcakes and puppy dogs, but\
    \ if that were true, where would the adventure stories be! \r\n\r\nOh no, I have had my share of challenges.\
    \ First was getting it loaded into my GPU: a NVIDIA RTX 3090. After getting that successfully accomplished,\
    \ my first interaction with the model will go down in my personal lore:\r\n\r\nMe: \"Who are you?\"\
    \ (I expected to get some form of Apertus returned)\r\nApertus: \"I am the goddess of Earth. I am\
    \ also the god of the sky.\"\r\n\r\nAt least it's humble.\r\n\r\nFast forward to December & January\
    \ and there were several documents I found from Swiss AI that were critical in getting to the milestone\
    \ demonstrated in the video.\r\n1. Discovering SwissAI's GitHub repo, particularly the Apertus formatter\r\
    \n2. Finding (at least to me) vLLM and deploying Apertus on it\r\n3. Some other performance tweaks/tunes\
    \ that some of the researchers from SwissAi commented on in various bug reports\r\n\r\nSo here are\
    \ the achievements I am really excited to share:\r\n* Completely private neuro-symbolic AI intelligence\
    \ service designed for my home\r\n* Runs in 16GB of VRAM on RTX 3090\r\n* Max tokens set to 16,384\
    \ (because above 17,000 and I don't have enough free RAM for KV Cache!)\r\n  * I should note that\
    \ setting the token limit higher gave me no model performance degradation: it was as fast with a high\
    \ max as with a low one!\r\n* Web UI chat client that tailors itself to my family members - text is\
    \ stream and I am getting an average of 32 tokens/sec response with an initial latency between prompt\
    \ request and response of around 400ms.\r\n* STT-TTS voice interface with streaming responses + streaming\
    \ TTS\r\n\r\nAbout the neuro-symbolic service: I built a symbolism server that is designed to generate\
    \ and cache common actions rather than going back to the AI server regularly. It's created so that\
    \ the first time a potential rule comes through--please turn on the lights--it will ask the model\
    \ if that's really what the user wanted. After a certain level of affirmation, the symbolic server\
    \ learns the action and simply runs it without needing agent confirmation.\r\n\r\nWhat's next: Only\
    \ yesterday I think I finally figured out how to use the Apertus ToolCalls/ToolOutputs format. I'll\
    \ start experimenting with that so I can have Apertus begin controlling devices in my home.\r\n\r\n\
    *But there is O"
  bucket: assigner_false
