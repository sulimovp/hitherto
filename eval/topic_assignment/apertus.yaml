  title: Experimental Apertus v1.5 support for llama.cpp
  body: "Hi,\r\n\r\nI’ve been working on an experimental Apertus v1.5 integration for llama.cpp, currently\
    \ available on my fork: https://github.com/MichelRosselli/llama.cpp/tree/model/apertus-v1.5\r\n\r\n\
    The branch covers text inference and chat support, together with vision and audio input through llama.cpp’s\
    \ multimodal infrastructure. I have tested the 8B model locally with GGUF weights; 70B support is\
    \ implemented structurally but has not been validated by running the full 70B weights.\r\n\r\nI’m\
    \ currently coordinating the overlapping output-vocabulary work with the existing upstream llama.cpp\
    \ effort before opening a draft PR: https://github.com/ggml-org/llama.cpp/pull/26226\r\n\r\nIf anyone\
    \ with more experience in llama.cpp would like to take a look, suggest improvements, or help with\
    \ any part of the integration, feedback and contributions would be very welcome."
