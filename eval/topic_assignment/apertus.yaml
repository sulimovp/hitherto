- repo: huggingface/transformers
  number: 47662
  source: github
  url: https://github.com/huggingface/transformers/pull/47662
  topic: null
  title: 'Apertus 1.5: add model'
  body: "<!-- ci-dashboard-badge:start -->\n[![CPU CI](https://transformers-ci.lor-e.huggingface.cool/badge/pr?pr=47662&event=pr-ci)](https://transformers-ci.lor-e.huggingface.cool/d/pytest-observability-by-pr/pytest-observability-branch?var-pr=47662)\
    \ [![GPU run-slow](https://transformers-ci.lor-e.huggingface.cool/badge/pr?pr=47662&event=run-slow)](https://transformers-ci.lor-e.huggingface.cool/d/pytest-observability-by-pr/pytest-observability-branch?var-pr=47662)\n\
    <!-- ci-dashboard-badge:end -->\n\n# What does this PR do?\r\n\r\nAdds **Apertus 1.5**, released 24.07.2026\
    \ by the Apertus team. Its a multimodal model (image + audio + text to text) extending the [Apertus](https://huggingface.co/docs/transformers/model_doc/apertus)\
    \ language model by continued pretraining with model vocabulary extended by two discrete tokenizers:\
    \ Emu3.5 for images and WavTokenizer for audio. (More details in Architecture section).\r\nWe released\
    \ the two final checkpoints: [swiss-ai/Apertus-v1.5-8B](https://huggingface.co/swiss-ai/Apertus-v1.5-8B)\
    \ and [swiss-ai/Apertus-v1.5-70B](https://huggingface.co/swiss-ai/Apertus-v1.5-70B) with the intermediate\
    \ checkpoints released together with the technical report in the coming weeks.\r\n\r\nThe closest\
    \ contribution precedent to this architecture and style of model is probably [Emu3](https://github.com/huggingface/transformers/pull/33770).\r\
    \n\r\n## Usage\r\n\r\n```python\r\nimport torch\r\nfrom transformers import AutoModelForImageTextToText,\
    \ AutoProcessor\r\n\r\nmodel_id = \"swiss-ai/Apertus-v1.5-8B\"\r\nprocessor = AutoProcessor.from_pretrained(model_id)\r\
    \nmodel = AutoModelForImageTextToText.from_pretrained(model_id, dtype=torch.bfloat16, device_map=\"\
    auto\")\r\n\r\n# a batch of two independent prompts, one per modality\r\nconversations = [\r\n   \
    \ [{\"role\": \"user\", \"content\": [\r\n        {\"type\": \"image\", \"url\": \"https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/bee.jpg\"\
    },\r\n          {\"type\": \"text\", \"text\": \"Describe this image in one sentence.\"},\r\n    \
    \  ]}],\r\n    [{\"role\": \"user\", \"content\": [\r\n          {\"type\": \"audio\", \"url\": \"\
    https://huggingface.co/datasets/hf-internal-testing/dummy-audio-samples/resolve/main/mary_had_lamb.mp3\"\
    },\r\n          {\"type\": \"text\", \"text\": \"Does this clip contain speech, music, or ambient\
    \ noise? Answer briefly.\"},\r\n      ]}],\r\n  ]\r\n\r\n# the processor fetches and resamples the\
    \ media; batched generation uses the tokenizer's default left padding\r\ninputs = processor.apply_chat_template(\r\
    \n    conversations, add_generation_prompt=True, tokenize=True,\r\n    return_dict=True, return_tensors=\"\
    pt\", padding=True,\r\n).to(model.device)\r\n\r\ngenerated = model.generate(**inputs, max_new_tokens=64)\r\
    \nfor reply in processor.batch_decode(generated[:, inputs[\"input_ids\"].shape[1]:], skip_special_tokens=True):\r\
    \n  print(reply)\r\n```\r\n\r\n## Architecture\r\n\r\nApertus 1.5 uses **discrete-token early fusion**:\
    \ frozen, encode-only tokenizers(these are not classic BPE style text tokenizers but Neural Networks)\
    \ turn images and audio into\r\ndiscrete codes, and fixed integer offsets map those codes into an\
    \ enlarged shared vocabulary, so the backbone\r\nmodels all modalities as one token stream. The 266,752-id\
    \ vocabulary holds 131,072 text tokens plus 200\r\nspecials, then 131,072 visual codes at offset 131,272\
    \ and 4,096 audio codes at offset 262,344.\r\n\r\nThe backbone is an Apertus-style transformer with\
    \ the embedding table enlarged to that vocabulary. Its **LM\r\nhead is physically pruned** to the\
    \ text-token rows (`output_vocab_size` in the config): for legal reasons the\r\nreleased model must\
    \ not generate images or audio, so the multimodal rows are removed from the output\r\nprojection entirely.\r\
    \n\r\nNeither the EMU3.5 vision tokenizer nor WavTokenizer existed in transformers; both are added\
    \ in this PR as well:\r\n\r\n1. **EMU3.5 vision tokenizer, encode-only** (`Apertus1p5VisionTokenizerModel`,\
    \ bundled inside `apertus1p5`):\r\n   the encoder, quantizer, and codebook-scoring path of BAAI's\
    \ EMU3.5 Vision Tokenizer, an IBQ image tokenizer\r\n   with a 131k codeboo"
  bucket: assigner_false
- repo: huggingface/transformers
  number: 44567
  source: github
  url: https://github.com/huggingface/transformers/pull/44567
  topic: null
  title: '[`fix`] Prevent crash with Apertus without xielu installed'
  body: "# What does this PR do?\r\n\r\nCurrently, when using Apertus (or rather, it's `XIELUActivation`),\
    \ and you don't have `xielu` installed, then you'll fall to this `except:`\r\nhttps://github.com/huggingface/transformers/blob/5a098a1e01034095f037c8a37f7fe87c31118e26/src/transformers/activations.py#L268-L273\r\
    \n\r\nHowever, `logger.warning_once` doesn't accept multiple parameters like this, and so it'll crash:\r\
    \n```\r\n            except Exception as err:\r\n                msg += f\" Could not enable torch._dynamo\
    \ for xIELU ({err}) - this may result in slower performance.\"\r\n                self._xielu_cuda_fn\
    \ = self._xielu_cuda\r\n            logger.warning_once(msg)\r\n        except Exception as err:\r\
    \n>           logger.warning_once(\r\n                \"CUDA-fused xIELU not available (%s) – falling\
    \ back to a Python version.\\n\"\r\n                \"For CUDA xIELU (experimental), `pip install\
    \ git+https://github.com/nickjbrowning/XIELU`\",\r\n                str(err),\r\n            )\r\n\
    E           TypeError: NNCFLogger.warning_once() takes 2 positional arguments but 3 were given\r\n\
    ```\r\n\r\nInstead, this PR uses f-string formatting to place the stringified error into the first\
    \ line, resulting in this logger warning instead:\r\n```\r\nCUDA-fused xIELU not available (No module\
    \ named 'xielu') – falling back to a Python version.\r\nFor CUDA xIELU (experimental), `pip install\
    \ git+https://github.com/nickjbrowning/XIELU`\r\n```\r\n\r\n## Before submitting\r\n- [ ] This PR\
    \ fixes a typo or improves the docs (you can dismiss the other checks if that's the case).\r\n- [x]\
    \ Did you read the [contributor guideline](https://github.com/huggingface/transformers/blob/main/CONTRIBUTING.md#create-a-pull-request),\r\
    \n      Pull Request section?\r\n- [ ] Was this discussed/approved via a Github issue or the [forum](https://discuss.huggingface.co/)?\
    \ Please add a link\r\n      to it if that's the case.\r\n- [ ] Did you make sure to update the documentation\
    \ with your changes? Here are the\r\n      [documentation guidelines](https://github.com/huggingface/transformers/tree/main/docs),\
    \ and\r\n      [here are tips on formatting docstrings](https://github.com/huggingface/transformers/tree/main/docs#writing-source-documentation).\r\
    \n- [ ] Did you write any new necessary tests?\r\n\r\n\r\n## Who can review?\r\n\r\n@Cyrilvallez @vasqu\r\
    \n\r\n- Tom Aarsen"
  bucket: assigner_false
