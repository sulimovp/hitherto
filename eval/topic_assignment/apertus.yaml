  title: 'fix: XIELU act parameters not being casted to correct dtype'
  body: "# What does this PR do?\r\n\r\n<!--\r\nCongratulations! You've made it this far! You're not quite\
    \ done yet though.\r\n\r\nOnce merged, your PR is going to appear in the release notes with the title\
    \ you set, so make sure it's a great title that fully reflects the extent of your awesome contribution.\r\
    \n\r\nThen, please replace this with a description of the change and which issue is fixed (if applicable).\
    \ Please also include relevant motivation and context. List any dependencies (if any) that are required\
    \ for this change.\r\n\r\nOnce you're done, someone will review your PR shortly (see the section \"\
    Who can review?\" below to tag some potential reviewers). They may suggest changes to make the code\
    \ even better. If no one reviewed your PR after a week has passed, don't hesitate to post a new comment\
    \ @-mentioning the same persons---sometimes notifications get lost.\r\n-->\r\n\r\n<!-- Remove if not\
    \ applicable -->\r\n\r\nWas in the process of integrating the new Swiss-ai's Apertus model into axolotl\
    \ and found an error with the xielu_cuda method. Ran with a 4bit QLoRA config.\r\n\r\n```bash\r\n\
    \  File \"/root/miniconda3/envs/py3.11/lib/python3.11/site-packages/transformers/activations.py\"\
    , line 282, in forward\r\n    return self._xielu_cuda_fn(input)\r\n           ^^^^^^^^^^^^^^^^^^^^^^^^^^\r\
    \n  File \"/root/miniconda3/envs/py3.11/lib/python3.11/site-packages/transformers/activations.py\"\
    , line 268, in _xielu_cuda\r\n    result = self._xielu_cuda_obj.forward(\r\n             ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\r\
    \nRuntimeError: Data type of x (c10::BFloat16) must match data type of alpha_p (float).\r\n```\r\n\
    \r\nThis error is raised from: \r\n\r\n```cuda\r\n  TORCH_CHECK(x.dtype() == alpha_p.dtype(), \"Data\
    \ type of x (\", x.dtype(),\r\n              \") must match data type of alpha_p (\", alpha_p.dtype(),\
    \ \").\");\r\n  TORCH_CHECK(x.dtype() == alpha_n.dtype(), \"Data type of x (\", x.dtype(),\r\n   \
    \           \") must match data type of alpha_n (\", alpha_n.dtype(), \").\");\r\n```\r\nhttps://github.com/rubber-duck-debug/xielu/blob/59d60314edf567ad6b9895a1ff5d7533a14ddc96/xielu/cuda/src/xielu_impl.cu#L395-L398\r\
    \n\r\nI see that it does start with `dtype=bf16` https://github.com/huggingface/transformers/blob/de01a22aff21d16532d8dd68806589ca6c73dd5c/src/transformers/activations.py#L203-L210\r\
    \n\r\nHowever, it could be due to some casting (maybe peft and FA) that caused it to end up being\
    \ fp32.\r\n\r\nThis PR solves it by casting it to the hidden states. Since they are both 1D Tensor\
    \ of 1element, there should be very minor cost to this cast.\r\n\r\nTested working downstream via\
    \ monkey patching https://github.com/axolotl-ai-cloud/axolotl/pull/3144\r\n\r\n\r\n## Before submitting\r\
    \n- [ ] This PR fixes a typo or improves the docs (you can dismiss the other checks if that's the\
    \ case).\r\n- [x] Did you read the [contributor guideline](https://github.com/huggingface/transformers/blob/main/CONTRIBUTING.md#create-a-pull-request),\r\
    \n      Pull Request section?\r\n- [ ] Was this discussed/approved via a Github issue or the [forum](https://discuss.huggingface.co/)?\
    \ Please add a link\r\n      to it if that's the case.\r\n- [ ] Did you make sure to update the documentation\
    \ with your changes? Here are the\r\n      [documentation guidelines](https://github.com/huggingface/transformers/tree/main/docs),\
    \ and\r\n      [here are tips on formatting docstrings](https://github.com/huggingface/transformers/tree/main/docs#writing-source-documentation).\r\
    \n- [ ] Did you write any new necessary tests?\r\n\r\n\r\n## Who can review?\r\n\r\nAnyone in the\
    \ community is free to review the PR once the tests have passed. Feel free to tag\r\nmembers/contributors\
    \ who may be interested in your PR.\r\n\r\n@ArthurZucker\r\n\r\n<!-- Your PR will be replied to more\
    \ quickly if you can figure out the right person to tag with @\r\n\r\n If you know how to use git\
    \ blame, that is the easiest way, otherwise, here is a rough guide of **who to tag**.\r\n Please tag\
    \ fewer than 3 people.\r\n\r\nModels:\r\n\r\n- text models: @ArthurZucker\r\n- vision models: @amyeroberts,\
    \ @qubvel\r\n- speech models: @eustlb\r\n- graph models: @clefourrier\r\n\r\nLibrary:\r\n\r\n-"
