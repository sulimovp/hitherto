  topic: apertus format
  title: Apertus tool parser
  body: "In the description you said Apertus supports tools and that supports vLLM.\r\n\r\nIf you would\
    \ like to enable tools in vLLM you need to provide the following 3 parameters:\r\n\r\n--enable-auto-tool-choice\r\
    \n--tool-call-parser\r\n--chat-template \r\n\r\nHere it is the example for Llama from vLLM\r\n\r\n\
    https://docs.vllm.ai/en/latest/features/tool_calling.html\r\n\r\nchat-template seems to be here: https://github.com/swiss-ai/apertus-format/blob/main/src/templates/chat_template.jinja\
    \ (please correct me if wrong)\r\n\r\nBut what about the tool-call-parser?\r\n\r\nAny help here?\r\
