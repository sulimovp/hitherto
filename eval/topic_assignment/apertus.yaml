- repo: swiss-ai/Apertus-8B-Instruct-2509
  number: 26
  source: hub
  url: https://huggingface.co/swiss-ai/Apertus-8B-Instruct-2509/discussions/26
  topic: apertus format
  title: 'Apertus Tool Calling: Practical Notes'
  body: "It has been two months since I last posted about my Apertus-based project. I have made a lot\
    \ of advancements since then, most importantly with regards to tools. I wanted to give the community\
    \ some insights into my learnings; hopefully it can help someone else.\r\n\r\n## Background\r\nI came\
    \ across the `swiss-ai/apertus-format` GitHub repo and this helped with improving model output quality\
    \ and consistency. To get more information about the `ApertusFormatter`, head over to the [GitHub\
    \ format specification page](https://github.com/swiss-ai/apertus-format/blob/main/docs/format.md).\
    \ Though this post is not a tutorial, I will attempt to explain practical behavior I observed that\
    \ isn't obvious from the documentation.\r\n\r\n---\r\n\r\n## The `add_generation_prompt` Parameter\r\
    \nThis parameter on `format_conversation()` had the most impact on whether tool calls were generated\
    \ correctly, and its behavior wasn't immediately obvious to me.\r\n\r\n**In tool-calling mode** (`intent\
    \ == tool call`), you need:\r\n\r\n```python\r\nformatter = ApertusFormatter(enable_thinking=True,\
    \ tools=tool_functions)\r\nformatted = formatter.format_conversation(conversation, add_generation_prompt=False)\r\
    \n```\r\n\r\nSetting `add_generation_prompt=True` with a tool-capable prompt caused the model to consistently\
    \ ignore the tools and generate a plain text response instead. My interpretation is that the generation\
    \ prompt suffix signals \"start producing a human-readable assistant turn,\" which is in tension with\
    \ the structured `<|tools_prefix|>...<|tools_suffix|>` output the tool path requires. Omitting it\
    \ leaves the model in a state where it correctly emits the tool call JSON.\r\n\r\n**In streaming/text\
    \ mode**, `add_generation_prompt=True` is required — without it, the streamed response produces no\
    \ tokens.\r\n\r\nSo the rule I landed on:\r\n- Tool call path: `add_generation_prompt=False`\r\n-\
    \ Text response path: `add_generation_prompt=True`\r\n\r\n---\r\n\r\n## Streaming and Tool Calls Are\
    \ Mutually Exclusive\r\nThe format supports tool calls via `<|tools_prefix|>[...]<|tools_suffix|>`\
    \ in the assistant turn. This works correctly in a single HTTP completion call. It does not work in\
    \ a streaming context.\r\n\r\nWhen the model is streaming, it emits tokens one at a time and the client\
    \ is consuming them as they arrive. There's no point at which you can intercept a partial JSON array,\
    \ parse a tool call, execute it, and inject the result back into the conversation before the generation\
    \ is already half-finished. The model doesn't wait.\r\n\r\nBesides, the `add_generation_prompt=True`\
    \ ignores the tools anyway.\r\n\r\nWhat I ended up implementing is a **two-call pattern**:\r\n\r\n\
    1. A short classification call (`max_tokens=5`, `add_generation_prompt=False`) that determines whether\
    \ the model intends to call a tool or produce a text response. I use a dedicated `tag_extraction`\
    \ tool for this with a constrained output schema.\r\n2. Based on the result: either a full tool-calling\
    \ HTTP call (synchronous), or a full streaming text generation.\r\n\r\nThe classification call adds\
    \ approximately 200ms. The benefit is that the two paths — tool execution and streaming text — stay\
    \ cleanly separated, and neither interferes with the other.\r\n\r\n---\r\n\r\n## Few-Shot Examples\
    \ with `AssistantBlock`\r\nThe format supports structured assistant messages via `Message.assistant_with_blocks()`\
    \ with `AssistantBlock` objects. I used this to provide a few-shot example in the prompt demonstrating\
    \ the expected tool call output format.\r\n\r\nA couple of observations:\r\n\r\n**One or two examples\
    \ is sufficient.** I experimented with adding more, expecting improved reliability. The opposite happened\
    \ — beyond two examples, output quality dropped. The model appeared to over-fit to the example pattern\
    \ and produced less flexible responses. Two examples, regardless of how many tools are in the schema,\
    \ was the consistent sweet spot.\r\n\r\n**The `tool_calls` block structure matters.** Tool call arguments\
    \ must be valid JSON strings. Malformed arguments in a few-shot example reliably produced malformed "
  bucket: assigner_positive
