  number: 93
  source: github
  url: https://github.com/SKaiNET-developers/SKaiNET-transformers/pull/93
  topic: apertus format
  title: 'docs(apertus): document chat-template format'
  body: '## Summary


    PR 2 of the Apertus rollout (see [APERTUS_ROLLOUT.md](APERTUS_ROLLOUT.md)). Researches the actual
    chat-template format Apertus models expect, before PR 3 implements `ApertusChatTemplate` against it.
    Sources fetched from HuggingFace `swiss-ai/Apertus-8B-Instruct-2509` 2026-05-01.


    ## Headline finding


    **Apertus is NOT chatml-compatible.** The previous `ModelRegistry.kt:66` setting `chatTemplateFamily="chatml"`
    was a fallback guess; this PR corrects it to `"apertus"`.


    Apertus has its own role tokens (`<|system_start|>`, `<|developer_start|>`, `<|user_start|>`, `<|assistant_start|>`,
    `<|inner_prefix|>`, `<|tools_prefix|>` — no overlap with chatml / llama3 / gemma), renders tools as
    **TypeScript-style type declarations** (not JSON Schema), emits a default system message + a developer
    block unconditionally, and uses a JSON-array tool-call format wrapped in `<|tools_prefix|>...<|tools_suffix|>`.


    Full spec at `docs/specs/apertus-chat-template.md` (mirrors the existing markdown convention from
    `docs/specs/spring-ai-adapter.md`):

    - Per-role token table

    - Turn structure with examples

    - Tool-capability rendering (TypeScript types macro behavior)

    - Tool-call output format from the model

    - Parser strategy outline for `ApertusToolCallParserStrategy` (PR 3)

    - Comparison table vs chatml / llama3 / gemma2

    - Four canonical parity test cases for `ApertusChatTemplateHfParityTest` (PR 3)

    - Implementation notes (the Jinja macro complexity → "use Jinja runtime, don''t port to hand-coded
    Kotlin" recommendation for PR 3)


    ## Changes


    - **`docs/specs/apertus-chat-template.md`** (new) — the spec.

    - **`llm-core/.../ModelRegistry.kt:66`** — `chatTemplateFamily` `"chatml"` → `"apertus"`. `supportsToolCalling=false`
    stays; PR 3 flips it once the chat template + parser ship.

    - **`APERTUS_ROLLOUT.md`** — PR 2 checkbox ticked, status header advanced.


    ## Test plan


    - [x] `:llm-core:jvmTest` green (chatTemplateFamily change has no behavior impact today — `ToolCallingSupportResolver`
    has no `"apertus"` branch yet, so the fallback path is unchanged).

    - [ ] CI green

    - [ ] Reviewer reads the spec, the four canonical parity cases, and the "use Jinja runtime not hand-coded
    Kotlin" recommendation make sense before PR 3 starts.


    ## Out of scope


    - `ApertusChatTemplate.kt`, `ApertusToolCallingSupport.kt`, registration in `ToolCallingSupportResolver.kt`,
    flipping `supportsToolCalling=true` — all PR 3.

    - Verifying against a real Apertus GGUF — done via HuggingFace `swiss-ai/Apertus-8B-Instruct-2509`
    source files (`chat_template.jinja`, `tokenizer_config.json`, `special_tokens_map.json`), the canonical
    authority for the format.


    🤖 Generated with [Claude Code](https://claude.com/claude-code)'
  bucket: assigner_positive
