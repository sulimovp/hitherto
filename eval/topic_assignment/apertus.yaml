- repo: vllm-project/vllm
  number: 49409
  source: github
  url: https://github.com/vllm-project/vllm/pull/49409
  topic: null
  title: '[Bugfix] Do not discard model output when tool_choice defaults to "none" with no tools declared'
  body: 'FIX #49254


    ## Purpose


    When a chat request declares **no tools**, the protocol defaults `tool_choice` to `"none"`. Since
    #45413, engine-based parsers handle that branch by running the full tool-parsing pipeline and then
    stripping the parsed tool calls (`delta_message.tool_calls = []` in `DelegatingParser._extract_tool_calls_streaming`).
    If the model emits tool-call syntax anyway — common for agentic-tuned models given tool-heavy context
    — its entire output is parsed into tool calls and then discarded: the client receives an empty response
    (`finish_reason: "stop"`, every chunk `"delta": {}`), with the generated tokens visible only in `logprobs`.
    That is exactly the symptom reported in #49254.


    This is not model-specific: replaying the same shape through all ten engine-based parsers (gemma4,
    qwen3, seed_oss, glm4.7, kimi_k2, deepseek v3.2/v4, minimax_m2, nemotron_v3, inkling) loses the response
    identically. Gemma-4 became exposed when it was converted to the engine implementation in #45588.


    ## Fix


    Gate the strip on the request actually declaring tools:


    - **Tools declared + `tool_choice="none"`** (explicit opt-out): unchanged — run the pipeline, strip
    tool calls silently. This keeps the existing tested contract (`test_delegating_parse_tool_choice_none`,
    `assert_no_terminal_leakage`).

    - **No tools declared** (defaulted `"none"`): run the same pipeline under the engine''s existing `skip_tool_parsing`
    mode — reasoning is still extracted into the `reasoning` field, and tool syntax streams through incrementally
    as `content`. This matches what legacy (non-engine) parsers already do on this exact branch (`DeltaMessage(content=delta_text)`
    passthrough), so engine and non-engine parsers now behave consistently.


    `skip_tool_parsing` is used rather than raw passthrough because parsers like gemma4 extract reasoning
    inside the same unified engine; raw passthrough would leak `<|channel>thought` markers into content.


    Also fixes the test trace builder deriving request tools via truthiness (`if scenario.tool_calls`),
    which silently gave the `empty-tool-block` samples (`tool_calls=[]`) no-tools requests — those samples
    now declare a tool, matching their intent of exercising a tool-calling context.


    ## Why this is not duplicating an existing PR


    No open PR references #49254. The two adjacent open PRs repair *different* branches of the same `tool_choice`
    plumbing and do not touch the `"none"` strip:


    - #49228 fixes the `required`/named tool-choice streaming crash (#49216).

    - #49346 fixes request *validation* (`protocol.py`) to accept `tools: []`. Verified compatible: this
    PR''s gate uses truthiness, so the newly-legal `tools: []` correctly behaves like tools-absent (passthrough).


    ## Root cause commits


    - `c4a3f9d13` (#45413) introduced the engine-based strip branch; before it, `tool_choice="none"` always
    returned `delta_text` as content.

    - `76a373eff` (#45588) converted Gemma-4 to the engine implementation, exposing it to the branch (this
    is why the reporter observed it "worked before").


    ## Test Plan


    ```bash

    pytest tests/parser/engine/test_delegating_replay.py   # includes new regression test

    pytest tests/parser/ tests/tool_parsers/ tests/reasoning/

    ```


    New regression test `test_delegating_replay_no_tools_recovers_suppressed_output`: replays tool-only
    outputs through every engine parser (auto-discovered) at all chunk sizes with a no-tools request,
    asserting no tool calls are emitted and the tool name/argument payloads survive in content.


    ## Test Result


    - New regression test: **189/189 parametrizations fail without the fix, pass with it.**

    - `tests/parser/` + `tests/tool_parsers/` + `tests/reasoning/`: **4974 passed** with the fix vs 4785
    on clean main (+189 = the new parametrizations); the 35 failures in both runs are **byte-identical
    pre-existing failures** (apertus/granite/jamba/kimi_k2; unrelated files, present on clean `main`).

    - Non-streaming, explicit-none, and `tools: []` variants covered by existing + new unit tests.


    ## Model evalu'
  bucket: assigner_false
- repo: vllm-project/vllm
  number: 48410
  source: github
  url: https://github.com/vllm-project/vllm/pull/48410
  topic: null
  title: '[Model] Apertus 1.5 multimodality'
  body: "## General Info\r\n\r\nThis PR is the Apertus 1.5 implementation with image and audio multimodality.\
    \ The model weights will be available very soon.\r\n\r\nSpecial thanks to @tomas-polach for the bug\
    \ fix contribution!\r\nAnd @Anunay-Yadav for his startpoint code at https://github.com/swiss-ai/vllm/tree/apertus_integration\r\
    \n\r\n## Purpose\r\n\r\nThis PR introduces native vLLM asynchronous execution support for the multimodal\
    \ **Apertus 1.5** model, integrating **Emu3.5** for vision tokenization and **WavTokenizer40** for\
    \ audio tokenization.\r\n\r\nThe implementation strictly adheres to a high-performance CPU/GPU separation\
    \ architecture contract to optimize execution and avoid pipeline stalls:\r\n- **Processor (CPU-bound,\
    \ zero NN inference):** Implements deterministic tensor creation, dynamic batch padding, and dummy\
    \ token injection. Variable-resolution images and variable-length audio sequences are mathematically\
    \ padded to the maximum dimensions in the batch (`apertus_utils.py`, `ApertusMultiModalProcessor`\
    \ in `apertus_mm.py`).\r\n- **Worker (GPU-bound, native execution):** Heavy neural network inference\
    \ executes natively on the GPU (`ApertusForConditionalGeneration` in `apertus_mm.py`). It embeds pixel\
    \ values using the Emu3.5 vision tower, embeds audio using WavTokenizer, and performs O(1) boolean\
    \ mask ID substitution to inject visual/audio embeddings directly into the language model.\r\n- **Self-contained\
    \ Tokenizers:** Introduces clean, self-contained, and statically-instantiated versions of `Emu3.5`\
    \ (`apertus_emu35.py`) and `WavTokenizer40` (`apertus_wavetokenizer.py`). This eliminates dynamic\
    \ imports and external path injections, ensuring stability and simplified deployment.\r\n\r\n## Test\
    \ Plan\r\n\r\n```bash\r\nvllm serve apertus-ai/Apertus-v1.5-70B-Prerelease-2607 \\\r\n  --enable-chunked-prefill\
    \ \\\r\n  --async-scheduling \\\r\n  --enable-prefix-caching \\\r\n  --served-model-name \\\r\n  \
    \  apertus-ai/Apertus-v1.5-70B-Prerelease-2607 \\\r\n  --tensor-parallel-size 2 \\\r\n  --quantization\
