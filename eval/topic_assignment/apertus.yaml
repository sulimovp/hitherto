  title: 'Eval bug: ApertusForCausalLM is not supported - gguf conversion for model swiss-ai/Apertus-8B-Instruct-2509
    & swiss-ai/Apertus-70B-Instruct-2509'
  body: "### Name and Version\n\nversion: 6357 (0a2a3841)\nbuilt with cc (Ubuntu 14.2.0-19ubuntu2) 14.2.0\
    \ for x86_64-linux-gnu\n\nWhen i try to convert files to .gguf format using convert_hf_to_gguf.py\n\
    i get this error : \nINFO:hf-to-gguf:Model architecture: ApertusForCausalLM\nERROR:hf-to-gguf:Model\
    \ **ApertusForCausalLM is not supported**\n\nI am expecting to convert latest apertus LLM files to\
    \ .gguf format i used to do that with several LLM published on huggingface\n\nI did a conversion try\
    \ with this brand new LLM\nhttps://huggingface.co/swiss-ai/Apertus-8B-Instruct-2509\n\nI have updated\
    \ transformers to 4.56.0 as requested by ApertusForCausalLM\n\nTu reproduce : Download LLM files and\
    \ try to convert to .gguf format using convert_hf_to_gguf.py\n\nMany thanks in advance for effort\
    \ and clues\n\n\n\n### Operating systems\n\nLinux\n\n### GGML backends\n\nCUDA\n\n### Hardware\n\n\
    13th Gen Intel(R) Core(TM) i9-13900K To Be Filled By O.E.M. CPU @ 3.0GHz\n2x NVIDIA GeForce RTX 4090\n\
    \n### Models\n\nswiss-ai/Apertus-8B-Instruct-2509 & swiss-ai/Apertus-70B-Instruct-2509\n\n### Problem\
    \ description & steps to reproduce\n\nTo reproduce : Download LLM files swiss-ai/Apertus-8B-Instruct-2509\
    \  and try to convert to .gguf format using convert_hf_to_gguf.py\n\n### First Bad Commit\n\n_No response_\n\
    \n### Relevant log output\n\n```shell\n(gguf_env) llama@aiborg:/data/LLAMA/llama.cpp$ /data/LLAMA/llama.cpp/convert_hf_to_gguf.py\
    \ --outtype f16 --outfile /data/LLAMA/models/Swiss-AI/apertus-70B/swissai-70B.gguf /data/LLAMA/models/Swiss-AI/apertus-70B/\n\
    INFO:hf-to-gguf:Loading model: apertus-70B\nINFO:hf-to-gguf:Model architecture: ApertusForCausalLM\n\
    ERROR:hf-to-gguf:Model ApertusForCausalLM is not supported\n```"
  bucket: assigner_false
