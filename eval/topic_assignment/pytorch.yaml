  title: '[torch.compile] torch.masked.median fails on integer inputs under fullgraph=True'
  body: "### \U0001F41B Describe the bug\n\n`torch.masked.median` cannot be captured with `torch.compile(fullgraph=True)`\
    \ for a valid integer input and boolean mask. The implementation tries to guard on `torch.isnan(output).any()`\
    \ even though the selected output is valid.\n\nThis is a fullgraph compile-support issue, not a numerical\
    \ mismatch. The default `fullgraph=False` mode returns the eager result. The failure occurs with both\
    \ `aot_eager` and Inductor. It reproduced in 3/3 isolated processes. The same behavior was also reproduced\
    \ 3/3 on the tested nightly `2.15.0.dev20260821+cu130` (git `cef373b344057d8ed91bcf05d7921b2ca1d0d13c`).\n\
    \n## Reproduction\n\n```python\nimport torch\nimport torch.masked as masked\n\ndef fn(input, mask):\n\
    \    return masked.median(input, dim=0, mask=mask)\n\ninput = torch.tensor([1, 9, 3])\nmask = torch.tensor([True,\
    \ False, True])\n\nprint(\"eager:\", fn(input, mask))\ncompiled = torch.compile(fn, backend=\"inductor\"\
    , fullgraph=True)\nprint(\"compiled:\", compiled(input, mask))\n```\n\n## Actual behavior\n\nRunning\
    \ the script produces:\n\n```text\neager: tensor(1)\nTraceback (most recent call last):\n  File \"\
    /home/tommy_ge/miniconda3/lib/python3.13/site-packages/torch/_dynamo/utils.py\", line 4019, in run_node\n\
    \    return node.target(*args, **kwargs)  # type: ignore[operator]\n           ~~~~~~~~~~~^^^^^^^^^^^^^^^^^\n\
    \  File \"/home/tommy_ge/miniconda3/lib/python3.13/site-packages/torch/masked/_ops.py\", line 1483,\
    \ in median\n    elif not is_float and not torch.isnan(output).any():\n                          \
    \    ~~~~~~~~~~~~~~~~~~~~~~~^^\n  File \"/home/tommy_ge/miniconda3/lib/python3.13/site-packages/torch/fx/experimental/sym_node.py\"\
    , line 576, in guard_bool\n    r = self.evaluate()\n  File \"/home/tommy_ge/miniconda3/lib/python3.13/site-packages/torch/fx/experimental/sym_node.py\"\
    , line 550, in evaluate\n    return self.shape_env.evaluate_sym_node(self, size_oblivious)\n     \
    \      ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~^^^^^^^^^^^^^^^^^^^^^^\n  File \"/home/tommy_ge/miniconda3/lib/python3.13/site-packages/torch/fx/experimental/symbolic_shapes.py\"\
    , line 7860, in evaluate_sym_node\n    return self.evaluate_expr(\n           ~~~~~~~~~~~~~~~~~~^\n\
    \        sym_node.expr,\n        ^^^^^^^^^^^^^^\n    ...<3 lines>...\n        fallback_value=fallback_value,\n\
    \        ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n    )\n    ^\n  File \"/home/tommy_ge/miniconda3/lib/python3.13/site-packages/torch/fx/experimental/symbolic_shapes.py\"\
    , line 7956, in evaluate_expr\n    return self._inner_evaluate_expr(\n           ~~~~~~~~~~~~~~~~~~~~~~~~~^\n\
    \        orig_expr,\n        ^^^^^^^^^^\n    ...<5 lines>...\n        fallback_value,\n        ^^^^^^^^^^^^^^^\n\
    \    )\n    ^\n  File \"/home/tommy_ge/miniconda3/lib/python3.13/site-packages/torch/fx/experimental/recording.py\"\
    , line 297, in wrapper\n    return retlog(fn(*args, **kwargs))\n                  ~~^^^^^^^^^^^^^^^^^\n\
    \  File \"/home/tommy_ge/miniconda3/lib/python3.13/site-packages/torch/fx/experimental/symbolic_shapes.py\"\
    , line 7979, in _inner_evaluate_expr\n    return self._evaluate_expr(\n           ~~~~~~~~~~~~~~~~~~~^\n\
    \        orig_expr,\n        ^^^^^^^^^^\n    ...<4 lines>...\n        forcing_spec=forcing_spec,\n\
    \        ^^^^^^^^^^^^^^^^^^^^^^^^^^\n    )\n    ^\n  File \"/home/tommy_ge/miniconda3/lib/python3.13/site-packages/torch/fx/experimental/symbolic_shapes.py\"\
    , line 8212, in _evaluate_expr\n    raise self._make_data_dependent_error(\n    ...<3 lines>...\n\
    \    )\ntorch.fx.experimental.symbolic_shapes.GuardOnDataDependentSymNode: Could not guard on data-dependent\
    \ expression Eq(u0, 1) (unhinted: Eq(u0, 1)).  (Size-like symbols: none)\n\nconsider using data-dependent\
    \ friendly APIs such as guard_or_false, guard_or_true and statically_known_true.\nCaused by:   # <string>:5\
    \ in fn (masked/_ops.py:1483 in median)\nFor more information, run with TORCH_LOGS=\"dynamic\"\nFor\
    \ extended logs when we create symbols, also add TORCHDYNAMO_EXTENDED_DEBUG_CREATE_SYMBOL=\"u0\"\n\
    If you suspect the guard was triggered from C++, add TORCHDYNAMO_EXTENDED_DEBUG_CPP=1\nFor more debugging\
    \ help, see https://docs.google.com/docu"
