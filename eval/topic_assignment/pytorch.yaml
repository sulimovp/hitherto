    \ are very briefly talked about.\r\n\r\n```python\r\ndef zipf_sentence_lengths(alpha: float, batch_size:\
    \ int) -> torch.Tensor:\r\n    # generate fake corpus by unigram Zipf distribution\r\n    # from wikitext-2\
    \ corpus, we get rank \".\" = 3, \"!\" = 386, \"?\" = 858\r\n    sentence_lengths = np.empty(batch_size,\
    \ dtype=int)\r\n    for ibatch in range(batch_size):\r\n        sentence_lengths[ibatch] = 1\r\n \
    \       word = np.random.zipf(alpha)\r\n        while word != 3 and word != 386 and word != 858:\r\
    \n            sentence_lengths[ibatch] += 1\r\n            word = np.random.zipf(alpha)\r\n    return\
    \ torch.tensor(sentence_lengths)\r\n\r\ndef gen_batch(N, E_q, E_k, E_v, device):\r\n    # generate\
    \ semi-realistic data using Zipf distribution for sentence lengths\r\n    sentence_lengths = zipf_sentence_lengths(alpha=1.2,\
    \ batch_size=N)\r\n\r\n    # Note: the torch.jagged layout is a nested tensor layout that supports\
    \ a single ragged\r\n    # dimension and works with torch.compile. The batch items each have shape\
    \ (B, S*, D)\r\n    # where B = batch size, S* = ragged sequence length, and D = embedding dimension.\r\
    \n    query = torch.nested.nested_tensor([\r\n        torch.randn(l.item(), E_q, device=device)\r\n\
