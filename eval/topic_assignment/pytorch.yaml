  title: Unify pointwise DTensor and NestedTensor OP Coverage. Adds over 100 op overloads to DTensor and
    about to 10 to NestedTensor
  body: "### \U0001F680 The feature, motivation and pitch\n\nCurrently, DTensor maintains it's own list\
    \ of which ops are pointwise. NestedTensor has a similar requirement and instead elected to add a\
    \ pointwise tag to OpInfo. Maintaining two separate lists of pointwise ops is error prone. We should\
    \ have both use a single source of information on which ops are pointwise. Doing so should improve\
    \ op coverage for DTensor and perhaps NestedTensor and remove code duplication significantly.\n\n\
    These calculations I quickly did using PyTorch 2.8.0 in from Google Colab.\n\n> DTensor pointwise\
    \ ops #: 364\n> OPinfo pointwise ops #: 537\n> DTensor pointwise ops missing in OpInfo #: 10\n> OpInfo\
    \ pointwise ops missing in DTensor #: 185\n\n\nUnifying these would add 185 ops to DTensor coverage\
    \ and 10 ops to NestedTensor coverage\n\nI would suggest checking if an op is pointwise\nwith `torch.Tag.pointwise\
    \ in op.tags` for an arbitrary aten operator. I would then add the pointwise tags to any ops that\
    \ are listed as pointwise in DTensor but not in opinfo and unify the lists. Doing so would ensure\
    \ NestedTensor and DTensor have similar coverage\n\nTagging @ezyang \n\nSlack Discussion:\n> Anyone\
    \ know why DTensor doesn’t use optest’s pointwise tag registration that NestedTensor already uses?\
    \ It’s weird to me it maintains a second list of all the pointwise ops when that info should be provided\
    \ already by OpInfo registration?\n> @ezyang Reply: it probably should just use it\n\n### Alternatives\n\
    \n_No response_\n\n### Additional context\n\nExample of drift between DTensor and NestedTensor op\
    \ coverage: https://github.com/pytorch/pytorch/pull/167973\n\nCurrent analysis:\n```\ncheck if op\
    \ is pointwise: [torch.Tag.pointwise in op.tags for op in pointwise_ops] \n```\n\nThese ops are missing\
    \ the op that are in the  do not have pointwise tags currently, but are list in DTensor:\n```python\n\
    [<OpOverload(op='aten.__irshift__', overload='Scalar')>, <OpOverload(op='aten.__irshift__', overload='Tensor')>,\
    \ <OpOverload(op='aten._conj', overload='default')>, <OpOverload(op='aten.abs_', overload='default')>,\
    \ <OpOverload(op='aten.copysign_', overload='Scalar')>, <OpOverload(op='aten.copysign_', overload='Tensor')>,\
    \ <OpOverload(op='aten.ldexp', overload='default')>, <OpOverload(op='aten.native_dropout_backward',\
    \ overload='out')>, <OpOverload(op='aten.where', overload='self_out')>, <OpOverload(op='aten.xlogy_',\
    \ overload='Scalar_Other')>]\n```\n\n```python\ndef get_pointwise_overloads():\n    pointwise = []\n\
    \n    # All registered operator schemas\n    for schema in torch._C._jit_get_all_schemas():\n    \
    \    ns, op_name = schema.name.split(\"::\", 1)\n\n        # Only care about aten ops; drop prim,\
    \ quantized, etc.\n        if ns != \"aten\":\n            continue\n\n        # Get the OpOverloadPacket,\
    \ e.g. torch.ops.aten.add\n        try:\n            packet = getattr(getattr(torch.ops, ns), op_name)\n\
    \        except AttributeError:\n            continue  # some schemas may not be exposed via torch.ops\n\
    \n        # Map JIT overload name -> Python overload attribute\n        overload_name = schema.overload_name\
    \ or \"default\"\n\n        try:\n            overload = getattr(packet, overload_name)  # OpOverload\n\
    \        except AttributeError:\n            continue  # can happen in weird cases\n\n        # Check\
    \ tag\n        if torch.Tag.pointwise in overload.tags:\n            pointwise.append(overload)\n\n\
    \    return pointwise\n```\nand comparing to that the list in the DTensor:\nDTensor pointwise ops\
    \ #: 364\nOPinfo pointwise ops #: 537\nDTensor pointwise ops missing in OpInfo #: 10\nOpInfo pointwise\
    \ ops missing in DTensor #: 185\n\nSo unifying this would add 173 ops to DTensor and add 10 op coverage\
    \ to NestedTensor!\n\nPointwoise opinfo tags are found here: https://github.com/pytorch/pytorch/blob/f9724db4921288a096e331cee835abd43257fbd6/aten/src/ATen/native/native_functions.yaml#L10242\n\
    \ncc @H-Huang @awgu @wanchaol @fegin @fduwjj @wz337 @wconstab @d4l3k @pragupta @msaroufim @dcci @tianyu-l\
    \ @XilunWu @SherlockNoMad\n\nThe least invasive way to handle this is probably to add a fallback"
