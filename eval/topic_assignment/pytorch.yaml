    \ 2, batch_first=True).to(\"xpu\").eval()\nnt = torch.nested.nested_tensor([torch.randn(2, 16), torch.randn(3,\
    \ 16)], device=\"xpu\")\nwith torch.no_grad():\n    mha(nt, nt, nt, need_weights=False)\n```\n\nThis\
