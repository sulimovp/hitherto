- repo: pytorch/pytorch
  number: 112509
  topic: null
  title: Add a function to torch.nested to create nested tensors from a buffer and sizes
  body: "### \U0001F680 The feature, motivation and pitch\r\n\r\nThere currently exists no function in\
    \ the `torch.nested` namespace to create nested Tensors from buffers combined with sizes and (optionally\
    \ I think) strides and storage offsets, but the C++ Code already has functions for this kind of operation:\
    \ `wrap_buffer` in `aten/src/ATen/native/nested/NestedTensorUtils.h`: https://github.com/pytorch/pytorch/blob/04024926f4d6ee07bfd2368a96d848879c982314/aten/src/ATen/native/nested/NestedTensorUtils.h#L35-L45\
    \ I use nested Tensors to accelerate my Dataset storage/loading, as can be observed using the small\
    \ example below, so this feature would be greatly appreciated. \r\n\r\nI would be willing to open\
    \ an according PR if that is desired, maybe this feature can also be included for the promotion of\
    \ nested Tensors to the beta stage (#112398)\r\n\r\n```python3\r\nimport torch\r\nfrom time import\
    \ time\r\n\r\n# create a random dataset of variable sequence lengths (10k elements)\r\nsizes = torch.randint(32,\
    \ 256, size=(10000,))\r\ndataset = {\r\n    'input_ids': [torch.randint(32000, size=(i,)) for i in\
    \ sizes],\r\n    'labels': [torch.randint(32000, size=(i,)) for i in sizes],\r\n}\r\n\r\ndef measure(name,\
    \ func):\r\n    s = time()\r\n    func()\r\n    print(f\"{name} took {time() - s} seconds\")\r\n\r\
    \n# save the dataset\r\nmeasure(\"store_dict\", lambda: torch.save(dataset, \"dataset.pt\"))\r\n#\
    \ load the dataset\r\nmeasure(\"load_dict\", lambda: torch.load(\"dataset.pt\", weights_only=True))\r\
    \n\r\n# convert the dataset to nested tensor\r\ndef to_nested_tensor_info(ds: dict):\r\n    return\
    \ {k: torch.nested.nested_tensor(v) for k, v in ds.items()}\r\n\r\ndef save_nested_tensor(ds: dict):\r\
    \n    nested_ds = to_nested_tensor_info(ds)\r\n    torch.save({\r\n        k: (\r\n            torch.cat(v,\
    \ dim=-1),  # one large tensor\r\n            nested_ds[k]._nested_tensor_size(),\r\n            nested_ds[k]._nested_tensor_strides(),\r\
    \n            nested_ds[k]._nested_tensor_storage_offsets(),\r\n        ) for k, v in ds.items()\r\
    \n    }, \"nested.pt\")\r\n\r\ndef load_nested_tensor():\r\n    tuple_ds = torch.load(\"nested.pt\"\
    , weights_only=True)\r\n    return {\r\n        k: torch._nested_view_from_buffer(*v) for k, v in\
    \ tuple_ds.items()\r\n    }\r\n\r\n# save the dataset\r\nmeasure(\"store_nested\", lambda: save_nested_tensor(dataset))\r\
    \n# load the dataset\r\nmeasure(\"load_nested\", lambda: print(load_nested_tensor()['input_ids']))\r\
    \n\r\n```\r\n\r\n### Alternatives\r\n\r\nThere exists `_nested_view_from_buffer`, but it is not located\
    \ in the `torch.nested.` namespace, so I am unsure about the future for the function at hand.\r\n\r\
    \n### Additional context\r\n\r\n```text\r\nstore_dict took 0.5521411895751953 seconds\r\nload_dict\
    \ took 1.3255178928375244 seconds\r\nstore_nested took 0.10043215751647949 seconds\r\nload_nested\
    \ took 0.009233236312866211 seconds\r\n```\n\ncc @mruberry @mikaylagawarecki @cpuhrsch @jbschlosser\
    \ @bhosmer @drisspg @soulitzer"
