  title: Add distinction between Tensor and NestedTensor in python
  body: "### \U0001F680 The feature, motivation and pitch\n\nAs of https://github.com/pytorch/pytorch/pull/74691,\
    \ the nested tensor class has been removed. From the python interface there seems to be no way to\
    \ distingush between Tensor and NestedTensor. I think it would be useful to have an efficent way to\
    \ determine if a tensor is nested or not.\n\n### Alternatives\n\n Currently I have two work arounds:\r\
    \n```python\r\n    try:\r\n        tensor.shape\r\n        is_nested = False\r\n    except RuntimeError\
    \ as ex:\r\n        is_nested = \"NestedTensorImpl\" in str(ex)\r\n```\r\nor \r\n```python\r\n   \
    \ is_nested = \"nested_tensor\" in str(tensor)\r\n```\r\n\r\nThe former is very slow because of the\
    \ try except perfomace. The latter requires a copy to the CPU for the print.\n\n### Additional context\n\
    \n_No response_\n\ncc @cpuhrsch"
