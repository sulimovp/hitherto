  body: "## \U0001F680 Feature\r\n\r\nA `pytorch/ExampleRepo` template repository that has a working C++\
    \ extension build, CI setup, and binary build pipeline and is tested on a nightly or weekly basis.\r\
    \n\r\n## Motivation\r\n\r\nOut-of-tree repos are becoming more popular among PyTorch developers (functorch,\
    \ MaskedTensor, xFormers) and are important for developer velocity while prototyping new features.\
    \ The main pain point for out-of-tree repos is release engineering: very few people have the knowledge\
    \ to set up a binaries release if the repo contains C++ or CUDA code. The inability to build binaries\
    \ means that engineers spend countless weeks on figuring out how to build binaries. We should have\
    \ some ExampleRepo template that comes with a tested CircleCI configuration that builds binaries.\r\
    \n\r\n## Alternatives\r\n\r\nEach repo needs a release engineer.\r\n\r\n## Additional context\r\n\r\
    \nn/a\r\n\n\ncc @seemethere @malfet @pytorch/pytorch-dev-infra"
