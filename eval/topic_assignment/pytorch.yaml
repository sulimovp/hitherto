- repo: pytorch/pytorch
  number: 118580
  topic: null
  title: '[NestedTensor] Support for operations found commonly in point cloud analysis architectures'
  body: "### \U0001F680 The feature, motivation and pitch\n\nThanks all for such a great effort here.\
    \ I do a lot of work on point cloud analysis (which often involves ragged data), and it would be great\
    \ to have upstream support for this sort of thing instead of having to rely on heavyweight specialized\
    \ libraries (i.e. Pytorch Geometric) which come with a lot of baggage/learning curve when creating\
    \ simple pytorch networks. Lots of the common point cloud analysis architectures (PointNet++, PointNeXT,\
    \ PointTransformer, etc.) involve a small handful of operations which are not yet implemented in the\
    \ torch.nested module. Off the top of my head:\r\n\r\n- nn.Conv{1D,2D}: Example: https://github.com/yanx27/Pointnet_Pointnet2_pytorch/blob/master/models/pointnet2_utils.py#L171\r\
    \n- BatchNorm{1D,2D}\r\n- MaxPool{1D,2D}: Example: https://github.com/POSTECH-CVLab/point-transformer/blob/master/model/pointtransformer/pointtransformer_seg.py#L45\r\
    \n\r\nI've been able to hack the conv1d/2d operations reshaping / using Linear layers, since they're\
    \ usually trying to do point-wise operations. But this mechanism is not efficient.\r\n\r\nThere are\
    \ also various sampling/grouping operations (k-nearest-neighbors, \"ball query\", etc), which may\
    \ or may not be efficient to implement using torch primitives (I know some of the other libraries\
    \ use their own cuda implementations for certain ops, like [torch_cluster](https://pytorch-geometric.readthedocs.io/en/1.4.1/_modules/torch_cluster/radius.html).\r\
    \n\r\nIf you think there might be interest/bandwidth to implement all or even a few of these operations,\
    \ I'd be happy to:\r\n\r\nmore-thoroughly list the operations which would give reasonable coverage\
    \ of point clouds\r\nguinnea-pig new operations by implementing architectures/training procedures\
    \ from some of the widely-used methods, to see that it matches expected performance.\n\n### Alternatives\n\
    \n_No response_\n\n### Additional context\n\n_No response_\n\ncc @cpuhrsch @jbschlosser @bhosmer @drisspg\
    \ @soulitzer"
  bucket: adjacent_unassigned
