- repo: pytorch/pytorch
  number: 79477
  topic: null
  title: Implement NestedTensor size function
  body: "### \U0001F680 The feature, motivation and pitch\n\nNestedTensor does not implement a size method.\
    \ NestedTensor has been integrated into nn.Transformer, which has revealed a couple of use cases where\
    \ the sizes of intermediate tensors in the model are needed.\r\n\r\nThe three main cases are:\r\n\
    - PyTorch profiler fails on nn.Transformer because it attempts to find the size of all intermediate\
    \ tensors, which includes NestedTensors in the transformer. \r\n- Autograd with NestedTensor fails\
    \ because it requires the size of the tensor\r\n- Torchscript with NestedTensor fails because torch.jit.script(model)\
    \ attempts to find the size of intermediate tensors for performance optimizations.\n\n### Alternatives\n\
    \nTwo main ways to fix:\r\n1. In all code that tries to find size of intermediate tensors, check for\
    \ NestedTensor, and if it's a NestedTensor, do not ask for size. This seems feasible for the above\
    \ use cases (profiler: has a WIP patch to check for NestedTensor, autograd: WIP in https://github.com/pytorch/pytorch/issues/79039,\
    \ torchscript: could probably make a torchscript-specific patch). But I imagine that there are many\
    \ such use cases and it would be hard to cover them all.  \r\n2. Implement NestedTensor size method\
    \ in a way that does not break existing use cases. \n\n### Additional context\n\n_No response_\n\n\
    cc @cpuhrsch @jbschlosser @bhosmer @erichan1"
