  title: Public API comparison between v2.4.1 and v2.5 release branch
  body: "Below a comparison of the Public API between v2.4.1 and the v2.5 release branch (https://github.com/pytorch/pytorch/issues/135522)\
    \ @kit1980 \r\nMost changes are not that exciting, but some might be helpful for writing the release\
    \ notes.\r\n\r\nRemoved parameters:\r\n\r\n- torch/ao/quantization/observer.py:984: HistogramObserver.__init__:\
    \ `upsample_rate` removed (set to default of 16)\r\n- torch/autograd/profiler.py:197: profile.__init__:\
    \ `use_mtia` removed\r\n- torch/fx/experimental/symbolic_shapes.py:4387: ShapeEnv.get_implications:\
    \ `compute_hint` removed\r\n- torch/fx/experimental/symbolic_shapes.py:5117: ShapeEnv.evaluate_expr:\
    \ `expect_rational` removed\r\n- torch/export/exported_program.py:663: ExportedProgram.__init__: `verifier`\
    \ and `tensor_constants` removed\r\n\r\nRequired parameter added:\r\n\r\n- torch/distributed/elastic/rendezvous/etcd_rendezvous.py:152:\
    \ EtcdRendezvousHandler.__init__: `local_addr`  was added as required (but can be set to `None`).\
    \ Perhaps set to `None` by default?\r\n\r\nRenamed parameters:\r\n\r\n- torch/__init__.py:970: typename(o):\
    \ Parameter `o` was renamed to `obj`\r\n- torch/masked/maskedtensor/core.py:18: is_masked_tensor:\
    \ Parameter `a` was renamed to `obj`\r\n- torch/autograd/graph.py:172: Node.__subclasshook__: Parameter\
    \ `C` was renamed to `subclass`\r\n\r\nParameter was changed to positional-only:\r\n\r\n- torch/__init__.py:1005:\
    \ is_tensor(obj)\r\n- torch/__init__.py:1025: is_storage(obj)\r\n- torch/__init__.py:1117: set_default_tensor_type(t)\r\
    \n- torch/__init__.py:1490: set_warn_always(b)\r\n- torch/_tensor.py:1165: Tensor.__contains__(self)\r\
    \n- torch/_tensor.py:1165: Tensor.__contains__(element)\r\n\r\nParameter was changed to keyword-only:\r\
    \n\r\n- torch/onnx/__init__.py:137: export(export_params):\r\n- torch/onnx/__init__.py:137: export(verbose)\r\
