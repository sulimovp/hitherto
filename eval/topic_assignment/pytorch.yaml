  title: Integration of __torch_dispatch__ with masked tensor semantics
  body: "Creating this issue to discuss if masked tensor semantics are correctly maintained with `__torch_dispatch__`.\
    \ This came up in an offline discussion with @ezyang while talking about `DiagLinearOperator` class\
    \ and the requirement to have gradients of the same size as that of the tensor stored in `DiagLinearOperator`\
    \ (and not the meta tensor) while using `__torch_dispatch__`. Currently, the masked semantics for\
    \ `DiagLinearOperator` are not maintained in the backward pass (the size of gradient tensor is the\
    \ same as that of the meta tensor). \r\n\r\n```\r\n// x = diag(...)  # x is sparse\r\n// z = x @ y\
    \  # z is dense\r\n// z.sum().backward()\r\n//\r\n// grad_z = all ones\r\n// grad_x = should be sparse\r\
    \n//\r\n// grad_x = grad_z @ y  # grad_x is dense here\r\n//\r\n// x             = [ 0 0 0 0 1 0 ]\r\
    \n// grad_x        = [ 1 1 1 1 1 1 ]\r\n// sparse_grad_x = [ 0 0 0 0 1 0 ]\r\n//\r\n// sparse_x.sparse_sum().backward()\r\
    \n// x.sum().backward()\r\n```\r\n\r\ncc @albanD"
