  title: dim broadcast in masked tensor between mask and data.
  body: '### 🚀 The feature, motivation and pitch


    ```

    mask = torch.randint(size=(3,),low=0, high=2, dtype=torch.bool, device = device)

    data = torch.rand(size=(3,2),device=device)

    masked_tensor = torch.masked.as_masked_tensor(data,mask)

    ```

    <img width="1159" height="202" alt="Image" src="https://github.com/user-attachments/assets/60edecad-c7e4-48e7-a6aa-58ecce20c0d3"
    />


    now, a tensor[mask] can have broadcast feature.


    ### Alternatives


    I really believe when we use pytorch as a tool(not a toy), broadcast should not be by default. When
    you implement this for masked tensor, think it twice.


    ### Additional context


    <img width="314" height="59" alt="Image" src="https://github.com/user-attachments/assets/00b3d1ca-b7ad-4b66-b662-aaa9659b6040"
    />

    congrats, significantly faster.'
