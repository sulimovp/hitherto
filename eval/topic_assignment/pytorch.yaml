  title: Error computing the norm of MaskedTensor
  body: "### \U0001F41B Describe the bug\n\nAccording to the [documentation](https://pytorch.org/docs/2.1/masked.html#reductions),\
    \ the `norm` reduction is supported for the beta `MaskedTensor`. However the following does not work:\r\
    \n\r\n```python\r\n>>> import torch\r\n>>> x = torch.rand(2, 3, 4, 5)\r\n>>> torch.masked.as_masked_tensor(x,\
    \ x>0.5).norm()\r\n/opt/homebrew/Caskroom/miniforge/base/envs/torch/lib/python3.10/site-packages/torch/masked/maskedtensor/core.py:156:\
    \ UserWarning: The PyTorch API of MaskedTensors is in prototype stage and will change in the near\
    \ future. Please open a Github issue for features requests and see our documentation on the torch.masked\
    \ module for further information about the project.\r\n  warnings.warn((\"The PyTorch API of MaskedTensors\
    \ is in prototype stage \"\r\n---------------------------------------------------------------------------\r\
    \nTypeError                                 Traceback (most recent call last)\r\nCell In[3], line\
    \ 1\r\n----> 1 torch.masked.as_masked_tensor(x, x>0.5).norm()\r\n\r\nFile /opt/homebrew/Caskroom/miniforge/base/envs/torch/lib/python3.10/site-packages/torch/_tensor.py:705,\
    \ in Tensor.norm(self, p, dim, keepdim, dtype)\r\n    703 r\"\"\"See :func:`torch.norm`\"\"\"\r\n\
    \    704 if has_torch_function_unary(self):\r\n--> 705     return handle_torch_function(\r\n    706\
    \         Tensor.norm, (self,), self, p=p, dim=dim, keepdim=keepdim, dtype=dtype\r\n    707     )\r\
    \n    708 return torch.norm(self, p, dim, keepdim, dtype=dtype)\r\n\r\nFile /opt/homebrew/Caskroom/miniforge/base/envs/torch/lib/python3.10/site-packages/torch/overrides.py:1577,\
    \ in handle_torch_function(public_api, relevant_args, *args, **kwargs)\r\n   1571     warnings.warn(\"\
    Defining your `__torch_function__ as a plain method is deprecated and \"\r\n   1572              \
    \     \"will be an error in future, please define it as a classmethod.\",\r\n   1573             \
    \      DeprecationWarning)\r\n   1575 # Use `public_api` instead of `implementation` so __torch_function__\r\
    \n   1576 # implementations can do equality/identity comparisons.\r\n-> 1577 result = torch_func_method(public_api,\
    \ types, args, kwargs)\r\n   1579 if result is not NotImplemented:\r\n   1580     return result\r\n\
    \r\nFile /opt/homebrew/Caskroom/miniforge/base/envs/torch/lib/python3.10/site-packages/torch/masked/maskedtensor/core.py:269,\
    \ in MaskedTensor.__torch_function__(cls, func, types, args, kwargs)\r\n    267 from ._ops_refs import\
    \ _MASKEDTENSOR_FUNCTION_TABLE\r\n    268 if func in _MASKEDTENSOR_FUNCTION_TABLE:\r\n--> 269    \
    \ return _MASKEDTENSOR_FUNCTION_TABLE[func](*args, **kwargs)\r\n    271 if not all(issubclass(cls,\
    \ t) for t in types):\r\n    272     return NotImplemented\r\n\r\nFile /opt/homebrew/Caskroom/miniforge/base/envs/torch/lib/python3.10/site-packages/torch/masked/maskedtensor/_ops_refs.py:184,\
    \ in _general_function_reductions(func, *args, **kwargs)\r\n    182 @register_function_func(NATIVE_REDUCE_FNS\
    \ + TORCH_REDUCE_FNS + TENSOR_REDUCE_FNS)\r\n    183 def _general_function_reductions(func, *args,\
    \ **kwargs):\r\n--> 184     return _apply_reduction(func, *args, **kwargs)\r\n\r\nFile /opt/homebrew/Caskroom/miniforge/base/envs/torch/lib/python3.10/site-packages/torch/masked/maskedtensor/reductions.py:172,\
    \ in _apply_reduction(fn, *args, **kwargs)\r\n    170     return TORCH_REDUCE_MAP[fn](*args, **kwargs)\r\
    \n    171 if fn in TENSOR_REDUCE_MAP:\r\n--> 172     return TENSOR_REDUCE_MAP[fn](*args, **kwargs)\r\
    \n    173 return NotImplemented\r\n\r\nFile /opt/homebrew/Caskroom/miniforge/base/envs/torch/lib/python3.10/site-packages/torch/masked/maskedtensor/reductions.py:128,\
    \ in _torch_grad_reduce.<locals>.grad_reduce(*args, **kwargs)\r\n    126     return _torch_reduce_all(fn)(args[0])\r\
    \n    127 # TODO: autograd.Function doesn't support kwarg\r\n--> 128 input, dim, keepdim, dtype =\
