  body: "### \U0001F41B Describe the bug\n\n\n## \U0001F41B Describe the bug\n\n`torch.compile` crashes\
    \ with `InternalTorchDynamoError: IndexError: list index out of range` when `F.layer_norm` is applied\
    \ to a jagged `NestedTensor` with `requires_grad=True`. The crash happens during guard building (before\
    \ any kernels run) and affects **all backends** (inductor, aot_eager, eager).\n\nEager mode works\
    \ correctly. The crash also occurs with `nn.LayerNorm`.\n\nThe root cause is more general than `layer_norm`:\
    \ any binary operation between a jagged NestedTensor and its `keepdim=True` reduction triggers the\
    \ same crash (e.g. `nt - nt.mean(-1, keepdim=True)`). Since `layer_norm` decomposes to this pattern\
    \ internally, it crashes. Manual RMSNorm (`x * rsqrt(x.pow(2).mean(-1, keepdim=True) + eps)`) also\
    \ crashes.\n\n## Minimal reproducer\n\n```python\nimport torch\nimport torch.nn.functional as F\n\n\
    values = torch.randn(15, 8, device=\"cuda\", requires_grad=True)\noffsets = torch.tensor([0, 5, 10,\
    \ 15], device=\"cuda\", dtype=torch.int64)\n\n# Eager: works\nnt = torch.nested.nested_tensor_from_jagged(values,\
    \ offsets)\nF.layer_norm(nt, [8]).values().sum().backward()  # OK\n\n# Compiled: crashes\ntorch._dynamo.reset()\n\
    \n@torch.compile(backend=\"inductor\")\ndef fn(v, o):\n    nt = torch.nested.nested_tensor_from_jagged(v,\
    \ o)\n    return F.layer_norm(nt, [8]).values().sum()\n\nfn(values, offsets)  # InternalTorchDynamoError\n\
    ```\n\n**Equivalent minimal pattern** (no `layer_norm` dependency):\n\n```python\n@torch.compile(backend=\"\
    inductor\")\ndef fn(v, o):\n    nt = torch.nested.nested_tensor_from_jagged(v, o)\n    return (nt\
    \ - nt.mean(-1, keepdim=True)).values().sum()\n\nfn(values, offsets)  # Same crash\n```\n\n## Root\
    \ cause\n\nThe crash is in `symbolic_shapes.py:produce_guards_verbose` at:\n```python\nsource = symbol_to_source[symbol][0]\
    \  # IndexError: list index out of range\n```\n\nWhen tracing `nt OP nt.reduce(-1, keepdim=True)`,\
    \ the keepdim reduction on a jagged NestedTensor introduces a symbolic variable during shape propagation\
    \ that has no corresponding source entry in `symbol_to_source`. Guard building then fails because\
    \ it tries to access `symbol_to_source[symbol][0]` on an empty list.\n\n## What works vs. what crashes\n\
    \n**CRASH** — binary op between jagged NT and its keepdim reduction:\n\n| Pattern | Status |\n|---------|--------|\n\
    | `nt + nt.mean(-1, keepdim=True)` | CRASH |\n| `nt - nt.mean(-1, keepdim=True)` | CRASH |\n| `nt\
    \ * nt.mean(-1, keepdim=True)` | CRASH |\n| `nt / (nt.mean(-1, keepdim=True) + 1)` | CRASH |\n| `F.layer_norm(nt,\
    \ [D])` | CRASH |\n| `nn.LayerNorm(D)(nt)` | CRASH |\n| `nt * rsqrt(nt.pow(2).mean(-1, keepdim=True)\
    \ + eps)` (RMSNorm) | CRASH |\n\n**OK** — individual components:\n\n| Pattern | Status |\n|---------|--------|\n\
    | `nt.values().sum()` | OK |\n| `nt.relu()`, `nt.sin()`, `F.gelu(nt)`, `F.silu(nt)` | OK |\n| `nt.mean(-1)`\
    \ (no keepdim) | OK |\n| `nt.mean(-1, keepdim=True)` (alone) | OK |\n| `nt * nt`, `nt * scalar`, `nt\
    \ + dense` | OK |\n| `F.softmax(nt, dim=-1)` | OK |\n| `F.layer_norm(nt.values(), [D])` (workaround)\
    \ | OK |\n\n## Workaround\n\nExtract `.values()` before applying normalization:\n\n```python\n@torch.compile(backend=\"\
    inductor\")\ndef fn_workaround(v, o):\n    nt = torch.nested.nested_tensor_from_jagged(v, o)\n   \
    \ return F.layer_norm(nt.values(), [8]).sum()\n```\n\n### Versions\n\n## Versions\n\n- **PyTorch**:\
    \ 2.13.0.dev20260501+cu126 (also tested on dev20260429)\n- **Triton**: 3.7.0+git88b227e2\n- **CUDA**:\
    \ 12.6\n- **GPU**: Tesla T4 (sm_75)\n- **Python**: 3.11\n\n\ncc @cpuhrsch @jbschlosser @bhosmer @drisspg\
    \ @soulitzer @davidberard98 @YuqingJ @chauhang @penguinwu @ezyang @bobrenjc93 @aditvenk @laithsakka"
