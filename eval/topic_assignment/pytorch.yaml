  topic: torch/masked
  title: Implement `permute` for masked tensor
  body: '### 🚀 The feature, motivation and pitch


    I have a RNN-like module, which reads the input step by step in for-loop. The batch contains sequences
    of different length, which are therefore padded. I would like to ignore the padding throughout the
    various layers in the network. I thought I could use masked tensors! But, the `permute` function I
    need is not yet implemented:


    > /opt/conda/envs/project/lib/python3.11/site-packages/torch/masked/maskedtensor/core.py:322: UserWarning:
    permute is not implemented in __torch_dispatch__ for MaskedTensor.

    If you would like this operator to be supported, please file an issue for a feature request at https://github.com/pytorch/maskedtensor/issues
    with a minimal reproducible code snippet.

    In the case that the semantics for the operator are not trivial, it would be appreciated to also include
    a proposal for the semantics.


    I open the request here as the GH for maskedtensor is archived.


    Or, is there an alternative to ignore padding at a core level? I know RNN can accept packed sequences
    natively, but linear layers and so on cannot.


    ### Alternatives


    _No response_


    ### Additional context


    _No response_


    cc @cpuhrsch @jbschlosser @bhosmer @drisspg @soulitzer @davidberard98 @YuqingJ'
