  body: "### \U0001F41B Describe the bug\n\nI was testing [nanoGPT ](https://github.com/karpathy/nanoGPT)\
    \ sample model training and inference on the latest ROCm nightly release on MI300X GPU and came across\
    \ this bug after I trained the model and ran `python sample.py --out_dir=out-shakespeare-char` command.\
    \ \r\n\r\nError message:\r\n```\r\nOverriding: out_dir = out-shakespeare-char\r\nTraceback (most recent\
    \ call last):\r\n  File \"/home/mahdi/Github/nanoGPT/sample.py\", line 38, in <module>\r\n    checkpoint\
    \ = torch.load(ckpt_path, map_location=device)\r\n  File \"/home/mahdi/nightly1120/lib/python3.10/site-packages/torch/serialization.py\"\
    , line 1436, in load\r\n    return _load(\r\n  File \"/home/mahdi/nightly1120/lib/python3.10/site-packages/torch/serialization.py\"\
    , line 1933, in _load\r\n    result = unpickler.load()\r\n  File \"/home/mahdi/nightly1120/lib/python3.10/site-packages/torch/_weights_only_unpickler.py\"\
    , line 339, in load\r\n    if full_path in _get_allowed_globals():\r\n  File \"/home/mahdi/nightly1120/lib/python3.10/site-packages/torch/_weights_only_unpickler.py\"\
    , line 188, in _get_allowed_globals\r\n    torch.nested._internal.nested_tensor.NestedTensor\r\nAttributeError:\
    \ module 'torch.nested' has no attribute '_internal'\r\n```\r\n\r\nI then tested it with stable 2.5.1\
    \ release and it worked as expected. I dug a bit deeper and tried forcing the import before calling\
    \ ` torch.load(ckpt_path, map_location=device)` and found that this also solves the issue. The workaround\
    \ I tried was added to line31 in [sample.py](https://github.com/karpathy/nanoGPT/blob/master/sample.py)\
    \ and is provide below for your reference.\r\n\r\n```\r\nif init_from == 'resume':\r\n\r\n# adding\
    \ the forced import as shown by Mahdi\r\n    try:\r\n        from torch.nested._internal import nested_tensor\r\
    \n        print(\"Successfully forced import of torch.nested._internal.nested_tensor\")\r\n    except\
    \ Exception as e:\r\n        print(f\"Forced import failed: {e}\")\r\n# end of changes by Mahdi\r\n\
    \r\n    # init from a model saved in a specific directory\r\n    ckpt_path = os.path.join(out_dir,\
