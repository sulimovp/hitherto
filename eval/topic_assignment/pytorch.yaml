- repo: pytorch/pytorch
  number: 187582
  topic: null
  title: torch.nested NJTs with identical layout fail on binary operation
  body: '### 🐛 Describe the bug


    It is not possible to apply a simple binary operation, such as `-`, to two `NestedTensor` with jagged
    layout (NJT) despite them having identical shapes/offsets.


    In this MRE, two tensors with identical shapes are converted to NJTs using `as_nested_tensor`. Notice
    that, for both tensors, the jagged dimension always has length 5 for each element and that the offsets
    of both tensors are **identical**. Thus one would expect a binary operation to be successful.


    ```python

    >>> a = torch.randn(12,5,32)

    >>> b = torch.randn(12,5,32)


    >>> A = torch.nested.as_nested_tensor(a, layout=torch.jagged)

    >>> B = torch.nested.as_nested_tensor(b, layout=torch.jagged)


    >>> A

    NestedTensor(size=(12, j1, 32), offsets=tensor([ 0,  5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]),
    contiguous=True)


    >>> B

    NestedTensor(size=(12, j2, 32), offsets=tensor([ 0,  5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]),
    contiguous=True)


    >>> a-b

    tensor(...)


    >>> A-B

    RuntimeError: cannot call binary pointwise function sub.Tensor with inputs of shapes (12, j1, 32)
    and (12, j2, 32)

    ```


    The documentation states:


    > Ragged structure incompatibility

    >

    > RuntimeError: cannot call binary pointwise function add.Tensor with inputs of shapes (2, j2, 128)
    and (2, j3, 128)

    >

    > This error occurs when calling an op that operates over multiple **NJTs with incompatible ragged
    structures**. **Currently, it is required that input NJTs have the exact same offsets constituent
    in order to have the same symbolic ragged structure symbol (e.g. j1).**


    In the above example, both NJTs have compatible ragged structures, but their symbolic structure symbols
    differ (despite having identical offsets). So either the documentation is wrong, or the code.


    The above example is not a hypothetical edge case. There are situations where one can guarantee that
    the ragged dimensions are exactly identical between two NJTs, often in the context of encoding and
    decoding. A concrete example is a Transformer VAE that operates on different sequence lengths per
    sample in a batch, e.g. due to different image sizes.


