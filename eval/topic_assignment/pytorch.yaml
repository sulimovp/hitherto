  topic: null
  title: '[NT] Implementing Multi-Head Attention with NestedTensors'
  body: "### \U0001F680 The feature, motivation and pitch\r\n\r\nNested tensors are supported by PyTorch's\
    \ flash attention implementation (cf. https://gist.github.com/victoroliv2/3668f07e11a0757febb6e55a8d78592a)\
    \ and this has a markable (approx 25%) speedup compared to alternative options. But extending this\
    \ example to a full multi-head attention implementation does not work at the moment since flash attention\
    \ expects 3D tensors in the nested_tensor while nn.Linear requires 2D tensors. \r\n\r\nRuntimeError:\
    \ Linear requires nested_tensor.dim == 3 and dense_matrix.dim == 2. Nested tensor dim: 4. Dense tensor\
    \ dim: 2\r\n\r\nThis restriction on nn.Linear also seems odd to me. One could in principle construct\
    \ the nested_tensor only after the projection but since this involves a copy operation it is rather\
    \ inefficient and will likely negate any benefit from the flash attention with nested tensors. \r\n\
    \r\n### Alternatives\r\n\r\n_No response_\r\n\r\n### Additional context\r\n\r\nHere's a minimal example:\r\
    \n\r\n```\r\nclass AttentionHead(torch.nn.Module):\r\n\r\n  def __init__(self, proj_dims) :\r\n  \
