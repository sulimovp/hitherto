- repo: pytorch/pytorch
  number: 131292
  topic: torch/masked
  title: Poor scaling of `torch.masked.mean`
  body: "### \U0001F41B Describe the bug\n\nConsider this equivalent formulation (for strided tensors,\
    \ at least):\r\n\r\n```python\r\ndef masked_mean(\r\n    input: torch.Tensor,\r\n    mask: torch.Tensor,\r\
    \n    dim: int | torch.types._size | None = None,\r\n    keepdim: bool = False,\r\n    dtype: torch.dtype\
    \ | None = None,\r\n) -> torch.Tensor:\r\n    return (input * mask).sum(dim=dim, keepdim=keepdim,\
    \ dtype=dtype or input.dtype) / mask.broadcast_to(input.shape).sum(dim=dim, keepdim=keepdim)\r\n```\r\
    \n\r\n\r\n\r\n![21232fda-366a-47ea-a017-15a35cd51d0c](https://github.com/user-attachments/assets/00bc8f67-2831-4acf-abc3-1b949458d2bc)\r\
    \n\r\n\r\nIt is due to the `count` calculation:\r\n\r\nhttps://github.com/pytorch/pytorch/blob/e506dfa640639b381efa3ae87b4992d40e8b4d6a/torch/masked/_ops.py#L1388-L1393\r\
    \n\r\nAllocating a new tensor is both expensive and unnecessary. Notably, this is also done in `torch.masked._std_var`:\r\
    \n\r\nhttps://github.com/pytorch/pytorch/blob/e506dfa640639b381efa3ae87b4992d40e8b4d6a/torch/masked/_ops.py#L1612-L1617\r\
    \n\r\nJust switching this line to:\r\n\r\n```python\r\ncount = inmask.sum(dim=dim, keepdim=keepdim)\r\
    \n```\r\n\r\nYou can see the scaling matches the proposed implementation:\r\n\r\n![aad2dfcc-52c9-4046-86ab-122b044fa19c](https://github.com/user-attachments/assets/89a89f3c-f982-494e-b026-b1eb9fcf6a5e)\r\
    \n\r\nHere is the code I used to generate the plots:\r\n\r\n```python\r\nimport time\r\n\r\nimport\
    \ matplotlib.pyplot as plt\r\nimport torch\r\nimport torch.types\r\n\r\nnum_elements: list[int] =\
    \ []\r\navg_times_custom: list[float] = []\r\navg_times_torch_masked_mean: list[float] = []\r\n\r\n\
    # takes about 3 minutes on my laptop\r\nNUM_STEPS = 16\r\nRUNS_PER_STEP = 5\r\nMAX_NUM_ELEMENTS =\
    \ 4096 * 4096 * 32\r\n\r\n\r\ndef masked_mean(\r\n    input: torch.Tensor,\r\n    mask: torch.Tensor,\r\
    \n    dim: int | torch.types._size | None = None,\r\n    keepdim: bool = False,\r\n    dtype: torch.dtype\
    \ | None = None,\r\n) -> torch.Tensor:\r\n    return (input * mask).sum(dim=dim, keepdim=keepdim,\
    \ dtype=dtype or input.dtype) / mask.broadcast_to(input.shape).sum(dim=dim, keepdim=keepdim)\r\n\r\
    \n\r\nfor n_elements in torch.linspace(1, MAX_NUM_ELEMENTS, NUM_STEPS):\r\n    n_elements = int(n_elements)\r\
    \n    num_elements.append(n_elements)\r\n\r\n    input_tensor = torch.randn(n_elements, dtype=torch.float32)\r\
    \n    mask = torch.tensor(True)\r\n    # mask = torch.randint_like(input_tensor, 0, 2, dtype=torch.bool)\
    \  # non-trivial mask\r\n\r\n    torch.testing.assert_close(masked_mean(input_tensor, mask=mask),\
    \ torch.masked.mean(input_tensor, mask=mask))  # will fail if not mask.any()\r\n\r\n    total_time_custom\
    \ = 0.0\r\n\r\n    for _ in range(RUNS_PER_STEP):\r\n        start_time = time.perf_counter()\r\n\
    \        masked_mean(input_tensor, mask=mask)\r\n        end_time = time.perf_counter()\r\n      \
    \  total_time_custom += (end_time - start_time)\r\n\r\n    avg_time_cusotm = (total_time_custom /\
    \ RUNS_PER_STEP)\r\n    avg_times_custom.append(avg_time_cusotm)\r\n\r\n    total_time_torch_masked_mean\
    \ = 0.0\r\n\r\n    for _ in range(RUNS_PER_STEP):\r\n        start_time = time.perf_counter()\r\n\
    \        torch.masked.mean(input_tensor, mask=mask)\r\n        end_time = time.perf_counter()\r\n\
    \        total_time_torch_masked_mean += (end_time - start_time)\r\n\r\n    avg_time_torch_masked_mean\
    \ = (total_time_torch_masked_mean / RUNS_PER_STEP)\r\n    avg_times_torch_masked_mean.append(avg_time_torch_masked_mean)\r\
    \n\r\nplt.figure(figsize=(10, 6))\r\nplt.plot(num_elements, avg_times_custom, label='proposed implementation\
    \ (without new_ones)')\r\nplt.plot(num_elements, avg_times_torch_masked_mean, label='torch.masked.mean')\r\
    \nplt.scatter(num_elements, avg_times_custom)\r\nplt.scatter(num_elements, avg_times_torch_masked_mean)\r\
    \nplt.xlabel('Number of Elements')\r\nplt.ylabel('Average Execution Time (s)')\r\nplt.title('Average\
    \ Execution Time Scaling')\r\nplt.legend()\r\nplt.show()\r\n```\n\n### Versions\n\ntorch v2.3.1"
  bucket: assigner_positive
  query: repo:pytorch/pytorch is:issue "torch.masked"
- repo: pytorch/pytorch
  number: 129272
  topic: torch/masked
  title: RecursionError for MaskedTensor.where
  body: "### \U0001F41B Describe the bug\r\n\r\n```pycon\r\n>>> import torch\r\n>>> from torch.masked\
    \ import MaskedTensor\r\n>>> a = MaskedTensor(torch.tensor([0, 1, 1]), torch.tensor([True, True, False]))\r\
    \n>>> b = MaskedTensor(torch.tensor([1, 1, 1]), torch.tensor([True, True, False]))\r\n>>> torch.where(a\
    \ != 0, a, b)\r\n...\r\nRecursionError: maximum recursion depth exceeded while calling a Python object\r\
    \n```\r\n\r\nwhereas:\r\n\r\n```pycon\r\n>>> torch.where((a != 0)._masked_data, a, b)\r\nMaskedTensor(\r\
    \n  [0, 1,       --]\r\n)\r\n```\r\n\r\nI understand that when a value is not specified in the mask,\
    \ it is impossible to know from which tensor to take the value from. However, due to the existance\
    \ of `torch.Tensor.where`, I understand the semantic as \"for each cell where the mask is `False`,\
    \ take the value from other, otherwise take from self\".\r\n\r\n- Hence, can we change the operator\
    \ to use `cond = cond.to_tensor(True)` if the condition is a `MaskedTensor`?\r\n- Otherwise, can we\
    \ accept a `MaskedTensor` as `cond` if both masks from `self` and `other` match? In that case there\
    \ is no ambiguity, and we can apply `cond = _get_data(cond)`\r\n\r\n### Versions\r\n\r\nmain and latest"
  bucket: assigner_positive
  query: repo:pytorch/pytorch is:issue "torch.masked"
- repo: pytorch/pytorch
  number: 124964
  topic: torch/masked
  title: Give the possibly to get back normal `Tensor`s as `MaskedTensor` gradients
  body: "### \U0001F680 The feature, motivation and pitch\r\n\r\nI am working on a project that requires\
    \ to manipulate a lot of masks and some math should only be applied on the masked values as part of\
    \ a loss function. `MaskedTensor` comes ideal in this situation but is not supported by all functions\
    \ in the backward pass.\r\n\r\nFor instance, let's say we want to perform a sliding window:\r\n```pycon\r\
    \n>>> import torch\r\n>>> from torch.masked import as_masked_tensor\r\n>>> t = torch.randn(3, 3, requires_grad=True).unfold(1,\
    \ 2, 1)\r\n>>> m = as_masked_tensor(t, torch.ones(t.shape, dtype=torch.bool))\r\n.../torch/masked/maskedtensor/core.py:156:\
    \ UserWarning: The PyTorch API of MaskedTensors is in prototype stage and will change in the near\
    \ future. Please open a Github issue for features requests and see our documentation on the torch.masked\
    \ module for further information about the project.\r\n  warnings.warn((\"The PyTorch API of MaskedTensors\
    \ is in prototype stage \"\r\n.../torch/masked/maskedtensor/core.py:161: UserWarning: It is not recommended\
    \ to create a MaskedTensor with a tensor that requires_grad. To avoid this, you can use data.clone().detach()\r\
    \n  warnings.warn(\"It is not recommended to create a MaskedTensor with a tensor that requires_grad.\
    \ \"\r\n>>> m.sum().backward()\r\n.../torch/masked/maskedtensor/core.py:299: UserWarning: unfold_backward\
    \ is not implemented in __torch_dispatch__ for MaskedTensor.\r\nIf you would like this operator to\
    \ be supported, please file an issue for a feature request at https://github.com/pytorch/maskedtensor/issues\
    \ with a minimal reproducible code snippet.\r\nIn the case that the semantics for the operator are\
    \ not trivial, it would be appreciated to also include a proposal for the semantics.\r\n  warnings.warn(msg)\r\
    \nTraceback (most recent call last):\r\n  File \".../torch/_tensor.py\", line 513, in backward\r\n\
    \    return handle_torch_function(\r\n  File \"...s/torch/overrides.py\", line 1621, in handle_torch_function\r\
    \n    result = torch_func_method(public_api, types, args, kwargs)\r\n  File \".../torch/masked/maskedtensor/core.py\"\
    , line 274, in __torch_function__\r\n    ret = func(*args, **kwargs)\r\n  File \".../torch/_tensor.py\"\
    , line 522, in backward\r\n    torch.autograd.backward(\r\n  File \".../torch/autograd/__init__.py\"\
    , line 266, in backward\r\n    Variable._execution_engine.run_backward(  # Calls into the C++ engine\
    \ to run the backward pass\r\nTypeError: Multiple dispatch failed for 'torch._ops.aten.unfold_backward.default';\
    \ all __torch_dispatch__ handlers returned NotImplemented:\r\n  - tensor subclass <class 'torch.masked.maskedtensor.core.MaskedTensor'>\r\
    \nFor more information, try re-running with TORCH_LOGS=not_implemented\r\n```\r\n\r\nIn my case, I'd\
    \ don't really care about the mask in the backward pass and would be happy with a 0 gradient. Hence,\
    \ would it be possible to allow to chose betwen keeping a `MaskedTensor` or filling the masked gradients\
    \ with 0?\r\n\r\nThis feature could be a change in `maskedtensor/core.py` and `maskedtensor/creation.py`\
    \ like `keep_masked_gradient=True`\r\nhttps://github.com/pytorch/pytorch/blob/87079f5e91be657743cfc6df74b519b68a8b0205/torch/masked/maskedtensor/core.py#L220-L233\r\
    \n\r\n```diff\r\n--- /torch/masked/maskedtensor/core.py\r\n@@ -221 +221 @@\r\n-    def _from_values(data,\
    \ mask):\r\n+    def _from_values(data, mask, keep_masked_gradient=True):\r\n@@ -227,229 +227,232\
    \ @@\r\n         @staticmethod \r\n         def backward(ctx, grad_output):\r\n-             return\
    \ grad_output, None\r\n+             if keep_masked_gradient:\r\n+                 return grad_output,\
    \ None\r\n+             else:\r\n+                 return grad_output._masked_data.masked_fill(~grad_output.get_mask(),\
    \ 0), None \r\n```\r\n\r\n### Alternatives\r\n\r\nAt the moment, I have an `as_masked_tensor` overload\
    \ filling missing gradient with 0s in the backward pass:\r\n\r\n```python\r\ndef as_masked_tensor(data,\
    \ mask):\r\n    \"\"\"\r\n    Overload original `torch.masked.as_masked_tensor` to convert masked\
    \ tensors back to normal tensors in the backward\r\n    pass. Filling missing gradients with 0.\r\n\
    \    \"\"\"\r\n    clas"
