  title: Backpropagating on some losses produces NaN where it should not
  body: "### \U0001F41B Describe the bug\r\n\r\nI run into `nan` in gradients where there should not be,\
    \ when using the `SmoothL1Loss`, the `MSELoss` or the `HuberLoss` on masked tensors.\r\n\r\n```python\r\
    \nimport torch\r\nfrom torch import nn\r\n\r\nL = nn.MSELoss(reduction=\"none\")  # Same result with\
    \ SmoothL1Loss or HuberLoss\r\n\r\nx = torch.zeros(2, requires_grad=True)\r\ny = torch.Tensor([0,\
    \ torch.nan])\r\nmask = torch.logical_not(torch.isnan(y))\r\n\r\nloss = L(x[mask], y[mask]).sum()\r\
    \nloss.backward()\r\nprint(x.grad)  # tensor([0., 0.]) -> expected result\r\n\r\nloss = L(x, y)[mask].sum()\r\
    \nloss.backward()\r\nprint(x.grad)  # tensor([0., nan]) -> unexpected\r\n```\r\n\r\nIs this behavior\
    \ the expected result? Note that when I try with `L1Loss` instead, I don't get any `nan`.\r\n\r\n\
