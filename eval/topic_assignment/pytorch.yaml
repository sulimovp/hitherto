  number: 156005
  topic: torch/masked
  title: Deprecation notice of `torch.norm` and `Tensor.norm` across the documentation
  body: "### \U0001F4DA The doc issue\n\nIn the current stable version's [`torch.norm`](https://docs.pytorch.org/docs/2.7/generated/torch.norm.html),\
    \ it says it is deprecated. However, in several other places, such as [`Tensor.norm`](https://docs.pytorch.org/docs/2.7/generated/torch.Tensor.norm.html),\
    \ or in the quasi-tutorial page of [`MaskedTensor`](https://docs.pytorch.org/docs/2.1/masked.html#reductions),\
    \ `torch.norm` is still listed as a reference. \n\n### Questions\n- Is this intended?\n- Is the overall\
    \ documentation shifting toward the usage of `torch.linalg.norm`,  `torch.linalg.vector_norm`, and\
    \ `torch.linalg.matrix_norm`?\n- This is related to #117287 , as certain norms of `MaskedTensor` is\
    \ ill-defined unless the fill values are specified (e.g., 2 norm for example).\n\n### Suggest a potential\
    \ alternative/fix\n\n- If `Tensor.norm` is gonna be deprecated in the future, should the documentation\
    \ reflect that? or simply change the following from `torch.norm` to `torch.linalg.norm`:\nhttps://github.com/pytorch/pytorch/blob/0fa361e4295bbd8ac8b1f1ea74852535326f08f2/torch/_tensor.py#L881-L893\n\
    \ncc @svekars @sekyondaMeta @AlannaBurke @albanD"
  bucket: assigner_positive
  query: repo:pytorch/pytorch is:issue MaskedTensor
