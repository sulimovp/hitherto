- repo: pytorch/pytorch
  number: 85376
  topic: null
  title: '[NestedTensor] Implement the following operations: nested_tensor, as_nested_tensor'
  body: "# Summary\r\nCurrently the function [`torch.nested_tensor`]( exists). This function creates a\
    \ nestedtensor that is a non_leaf node of the tensors in the input tensor_list. This is counterintuitive\
    \ of the the other main tensor construction functions `torch.tensor` & `torch.as_tensor`. \r\n\r\n\
    \r\nCreate two new functions:\r\n- `torch.nested.nested_tensor` ->  This function will construct tensors\
    \ from a tensor list and the constructed tensor will be a leaf node in the context of autograd. \r\
    \n\r\n- `torch.nested.as_nested_tensor` ->this implementation will match the existing torch.nested_tensor.\r\
    \n\r\n\r\nBoth functions will live in the nested namespace.\r\n* If the creator also felt like creating\
    \ a new nestedtensor c++ `NestedTensorFactories.cpp` that implemented the kernels for constructing\
    \ nested tensors I would not be mad about it.\n\ncc @cpuhrsch @jbschlosser @bhosmer @mikaylagawarecki"
