  title: '[DTensor] backward fails for cumprod, cummax, cummin'
  body: "Added pr fixing this\n\nrepro\n```\nimport os\nimport sys\n\nimport torch\nimport torch.distributed\
    \ as dist\nfrom torch.distributed.tensor import Replicate, Shard, distribute_tensor, init_device_mesh\n\
    \ndist.init_process_group(\"nccl\")\ntorch.cuda.set_device(int(os.environ[\"LOCAL_RANK\"]))\nmesh\
    \ = init_device_mesh(\"cuda\", (dist.get_world_size(),))\n\nop = sys.argv[1]\n\nif op == \"cumprod\"\
    :\n    x_local = torch.rand(12, 8, device=\"cuda\").add_(0.1)\n    x_local.select(0, x_local.size(0)\
    \ // 2).zero_()\n    x = distribute_tensor(x_local.requires_grad_(True), mesh, [Shard(0)])\n    out\
    \ = torch.cumprod(x, dim=0)\nelif op == \"masked_cumprod\":\n    x = distribute_tensor(\n        torch.rand(12,\
    \ 8, device=\"cuda\").add_(0.1).requires_grad_(True),\n        mesh,\n        [Shard(0)],\n    )\n\
    \    row = torch.arange(12, device=\"cuda\").unsqueeze(1)\n    col = torch.arange(8, device=\"cuda\"\
    ).unsqueeze(0)\n    mask = distribute_tensor((row + col) % 2 == 0, mesh, [Replicate()])\n    out =\
    \ torch.masked.cumprod(x, mask=mask, dim=0)\nelse:\n    x = distribute_tensor(\n        torch.randn(12,\
    \ 8, device=\"cuda\").requires_grad_(True),\n        mesh,\n        [Shard(0)],\n    )\n    out =\
    \ getattr(torch, op)(x, dim=0)[0]\n\nout.sum().backward()\nprint(f\"[rank {dist.get_rank()}] {op}\
    \ backward done\", flush=True)\n\ndist.destroy_process_group()\n```\n\nbackward fails with a mixed\
    \ Tensor / DTensor error\n\ncc @awgu @wanchaol @fegin @fduwjj @wz337 @wconstab @d4l3k @pragupta @msaroufim\
    \ @dcci @aditvenk @weifengpy @tianyu-l @XilunWu @SherlockNoMad @ppwwyyxx"
