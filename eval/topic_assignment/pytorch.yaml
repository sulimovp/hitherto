- repo: pytorch/pytorch
  number: 82534
  topic: null
  title: Use NestedTensor in RNN models
  body: "### \U0001F680 The feature, motivation and pitch\r\n\r\nNow that NestedTensor is in core, I believe\
    \ a high-impact application would be to replace many RNN utils, such as:\r\n\r\n```\r\ntorch.nn.utils.rnn.pad_sequence\r\
    \ntorch.nn.utils.rnn.pad_packed_sequence\r\ntorch.nn.utils.rnn.pack_sequence\r\n```\r\nwith nested\
    \ tensors. LSTM/GRUs are still heavily used in RL, where long episodes can result in a batch of sequences\
    \ from 1 to 10,000 timesteps. The entire batch must be zero-padded to the length of the longest episode,\
    \ which uses a ton of memory (or perhaps the RNN utils do something smarter). The RNN utils also pass\
    \ around list of indices and sort the outputs, which the user must unsort. Furthermore, the above\
    \ methods are not flexible -- they do not allow a sequence of zero length, for example.\r\n\r\nIt\
    \ would be fantastic to stack a bunch of episodes/rollouts into a ragged NestedTensor and pass this\
    \ straight into an LSTM. I believe all that's needed are sigmoid, tanh, and linear operations which\
    \ I believe NestedTensor already supports.\r\n\r\nI don't think you would have to worry about backwards\
    \ compatibility. You can check `instanceof(lstm_input, torch.NestedTensor)` and branch from there.\r\
    \n\r\n### Alternatives\r\n\r\n_No response_\r\n\r\n### Additional context\r\n\r\ncc @cpuhrsch @jbschlosser\
    \ @bhosmer @drisspg "
