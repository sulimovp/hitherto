  number: 83994
  topic: null
  title: General NestedTensor op coverage tracking issue
  body: "### This issue is to have a centralized place to list and track work on adding support to new\
    \ ops for the NestedTensor backend.\r\nThere are  large number of operators in pytorch and so they\
    \ are not all implemented yet for the NestedTensor backends as it is still in the prototype phase.\
    \ We will be prioritizing adding new operators based on user feedback. If possible, please also provide\
    \ link to the network or use-case where this op is getting used.\r\n\r\nIf you want to work on adding\
    \ support for such op, feel free to comment below to get assigned one. Please avoid picking up an\
    \ op that is already being worked on or that already has a PR associated with it.\r\n\r\n#### Op coverage\
    \ requests\r\n- [ ] aten::convolution\r\n- [ ] aten::max.dim\r\n- [x] detach #84078 \r\n- [x] to #87146\r\
    \n- [ ] eq\r\n- [ ] masked_select\r\n- [ ] index_select\r\n- [ ] narrow\r\n- [ ] alias\r\n- [ ] Broadcasting\
    \ Ufuncs along implicit NT dim\r\n- [ ] Zero-copy Nt construction from Size info\r\n- [ ] BCE/ Other\
    \ loss functions for NT\r\n- [ ] nested tensor creation from arbitrary masks rather than left-aligned\r\
    \n\r\n#### Backward op coverage requests\r\n- [ ] gelu, relu backward\r\n- [ ] layernorm backward\r\
    \n\r\ncc @cpuhrsch @jbschlosser @bhosmer"
