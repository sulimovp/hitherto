- repo: pytorch/pytorch
  number: 124205
  topic: null
  title: '[NestedTensor] torch.compile silent specialization on _max_seqlen'
  body: "As illustrated in code snippet below, NestedTensor._max_seqlen property is being silently specialized\
    \ when compiled - problematic behavior (silent hardcoding of value used for tracing) can be reproduced\
    \ in both `inductor` and `eager` compilation modes.\r\n\r\nExpected behavior:\r\n* compiler generated\
    \ dynamic code that doesn't specialize into specific value of NestedTensor\r\nOR at least fails prominently\
    \ if specialization occurs - and guards kick in.\r\n\r\nObserved behavior:\r\n* success that leads\
    \ to wrong outputs, as torch.compile produces specialized code without adding guards.\r\n\r\n\r\n\
    cc @cpuhrsch @jbschlosser @bhosmer @drisspg @soulitzer\r\n\r\n```\r\nfrom torch.nested._internal.nested_tensor\
    \ import NestedTensor\r\nimport torch\r\n\r\n@torch.compile\r\n@torch._dynamo.config.patch(error_on_recompile=True)\r\
    \ndef sample_fun(njt: NestedTensor) -> NestedTensor:\r\n    njt = njt.clamp(0.1, 0.5)\r\n    # if\
    \ this is NOT specialized - this should lead to second printed output be larger than first\r\n   \
    \ njt *= njt._max_seqlen\r\n    return njt\r\n\r\ndef create_njt(el_per_row):\r\n    torch.manual_seed(0)\r\
    \n    njt = NestedTensor(\r\n        values=torch.randn(10 * el_per_row, device=\"cuda\"),\r\n   \
    \     offsets=torch.arange(11, device=\"cuda\") * el_per_row,\r\n    )\r\n    # This sets _max_seqlen\
    \ in cache\r\n    print(njt._max_seqlen)\r\n    return njt\r\n\r\nwith torch.inference_mode():\r\n\
    \    # This works\r\n    print(sample_fun(create_njt(el_per_row=1)).values())\r\n    # But this printed\
    \ output should be 2x as big - and it is NOT as max_seqlen is specialized in generated code.\r\n \
    \   print(sample_fun(create_njt(el_per_row=2)).values())\r\n```\r\n\r\nWhen run with TORCH_LOGS=output_code\
    \ this produces code that hardcodes _max_seqlen=1\r\n\r\nhttps://gist.github.com/tgalkovskyi/691ccb841c318a795873bfa30c990b06\r\
    \n\r\n### Versions\r\nANP kernel pytorch (meta internal)\r\n\r\nVersion 2266\r\nBuilt April 16, 2024,\
    \ 5:22:27 AM"
