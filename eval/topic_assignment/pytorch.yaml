  number: 127097
  topic: null
  title: '[NestedTensor] RelaxedUnspecConstraint failures due to mark_dynamic in NT constructor'
  body: "### \U0001F41B Describe the bug\n\nIf a tensor is marked as `mark_dynamic`, then there is some\
    \ logic later on to verify that the shape does in fact remain dynamic:\r\n\r\nhttps://github.com/pytorch/pytorch/blob/87f79af24dae87712996c9f135f2912a95bdd029/torch/fx/experimental/symbolic_shapes.py#L3653-L3664\r\
    \n\r\nNJT constructor marks its values tensor as dynamic:\r\n\r\nhttps://github.com/pytorch/pytorch/blob/87f79af24dae87712996c9f135f2912a95bdd029/torch/nested/_internal/nested_tensor.py#L122\r\
    \n\r\nThis can cause issues, demonstrated in the repro below:\r\n\r\n```python\r\nimport torch\r\n\
    \r\nvalues = torch.randn((18, 16))\r\noffsets = torch.tensor([0, 2, 3, 6, 15, 18])\r\nlike_values\
    \ = torch.randn_like(values)\r\n\r\n# this marks values as dynamic\r\nnt = torch.nested.nested_tensor_from_jagged(values,\
    \ offsets)\r\n\r\ndef fn(values, same_size):\r\n    return values + same_size\r\n\r\ntorch.compile(fn)(values,\
    \ like_values)\r\n```\r\n\r\nIf we do some operation on `values` which compares it to a tensor with\
    \ static but otherwise equal shape, then we can specialize the dynamic shape of `values` and cause\
    \ this check to fail\r\n\r\nSee https://github.com/pytorch/pytorch/issues/102814\n\n### Versions\n\
    \nmain branch of pytorch as of may 23, CPU-only build\n\ncc @cpuhrsch @jbschlosser @bhosmer @drisspg\
    \ @soulitzer"
  bucket: adjacent_unassigned
  query: repo:pytorch/pytorch is:issue NestedTensor in:title
