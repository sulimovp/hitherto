- repo: pytorch/pytorch
  number: 147140
  topic: torch/masked
  title: Mask in MaskedTensor does not change device
  body: '### 🐛 Describe the bug


    When you create a MaskedTensor and change it to cuda, the data is the only one that change to cuda.
    When we use a reduction function on cuda MaskedTensor (sum, to_tensor, etc), it will always fail since
    the mask in on another device.


    ```

    import torch

    from torch.masked import as_masked_tensor

    data = torch.tensor([1,2,3])

    mask = torch.tensor([True,False,True])

    mt = as_masked_tensor(data, mask).to(''cuda'')

    mt.get_data().device, mt.get_mask().device

    ```

    ```

    (device(type=''cuda'', index=0), device(type=''cpu''))

    ```


    ```

    mt.sum(dim=0)

    ```

    ```

    File [/pyenv/versions/3.11.2/lib/python3.11/site-packages/torch/masked/_ops.py:857](/pyenv/versions/3.11.2/lib/python3.11/site-packages/torch/masked/_ops.py#line=856),
    in _where(mask, input, fill_value)

    857     return torch.where(mask, input, fill_value)

    RuntimeError: Expected all tensors to be on the same device, but found at least two devices, cuda:0
    and cpu!

    ```

    ### Versions


    Run on torch 2.6, python 3.11'
