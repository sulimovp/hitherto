  title: '[NestedTensor] torch.compile fails when accessing _max_seqlen with GuardOnDataDependentSymNode'
  body: "### \U0001F41B Describe the bug\n\n\n`torch.compile` fails when a function accesses `NestedTensor._max_seqlen`\
    \ inside the compiled region.\n\nEager execution succeeds, but the compiled function fails during\
    \ Dynamo tracing with:\n\n```text\ntorch.fx.experimental.symbolic_shapes.GuardOnDataDependentSymNode:\n\
    Could not extract specialized integer from data-dependent expression u0\n```\n\nThe failure is triggered\
    \ by:\n```\nnt *= nt._max_seqlen\n```\nThe stack trace shows that `_max_seqlen` internally calls `_get_sdpa_extreme_seqlen`,\
    \ which attempts to convert a symbolic value to a Python integer:\n```\ntorch/nested/_internal/nested_tensor.py\"\
    , line 237, in _max_seqlen\n    return self._get_max_seqlen()\n\ntorch/nested/_internal/nested_tensor.py\"\
    , line 194, in _get_max_seqlen\n    max_val = _get_sdpa_extreme_seqlen(...)\n\ntorch/nested/_internal/nested_tensor.py\"\
    , line 36, in _get_sdpa_extreme_seqlen\n    return int(func(tensor).item())\n```\nThe important detail\
    \ is that `_max_seqlen` is not accessed before calling the compiled function. If `_max_seqlen` is\
    \ accessed before compilation, the value may appear to be cached and the failure can be hidden.\n\n\
    \n### Minimal repro\n```python\n#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\nimport os\nimport\
    \ platform\nimport traceback\n\nimport torch\nfrom torch.nested._internal.nested_tensor import NestedTensor\n\
    \n\ndef print_env():\n    print(\"Python:\", platform.python_version())\n    print(\"Platform:\",\
    \ platform.platform())\n    print(\"PyTorch:\", torch.__version__)\n    print(\"CUDA available:\"\
    , torch.cuda.is_available())\n    print(\"CUDA device count:\", torch.cuda.device_count())\n    print(\"\
    CUDA_VISIBLE_DEVICES:\", os.environ.get(\"CUDA_VISIBLE_DEVICES\", \"\"))\n    if torch.cuda.is_available():\n\
    \        print(\"Current CUDA device:\", torch.cuda.current_device())\n        print(\"CUDA device\
    \ name:\", torch.cuda.get_device_name(0))\n\n\ndef create_njt(el_per_row: int):\n    # Do not access\
    \ nt._max_seqlen here.\n    # Accessing it before torch.compile may cache the value and hide the issue.\n\
    \    values = torch.randn(10 * el_per_row, device=\"cuda\")\n    offsets = torch.arange(11, device=\"\
    cuda\") * el_per_row\n    return NestedTensor(values, offsets)\n\n\ndef f(nt):\n    nt = nt.clamp(0.1,\
    \ 0.5)\n    nt *= nt._max_seqlen\n    return nt\n\n\ndef get_values(nt):\n    return nt.values()\n\
    \n\ndef main():\n    print_env()\n\n    if not torch.cuda.is_available():\n        raise RuntimeError(\"\
    This repro expects CUDA.\")\n\n    torch.manual_seed(0)\n\n    eager_input = create_njt(el_per_row=2)\n\
    \    compiled_input = create_njt(el_per_row=2)\n\n    print(\"\\nRunning eager...\")\n    with torch.no_grad():\n\
    \        eager_out = f(eager_input)\n        eager_values = get_values(eager_out)\n    print(\"Eager\
    \ succeeded.\")\n    print(\"Eager output sum:\", eager_values.sum().item())\n\n    print(\"\\nRunning\
    \ compiled...\")\n    compiled_f = torch.compile(\n        f,\n        backend=\"inductor\",\n   \
    \     fullgraph=True,\n        dynamic=True,\n    )\n\n    try:\n        with torch.no_grad():\n \
    \           compiled_out = compiled_f(compiled_input)\n            compiled_values = get_values(compiled_out)\n\
    \n        print(\"Compiled succeeded.\")\n        print(\"Compiled output sum:\", compiled_values.sum().item())\n\
    \n        torch.testing.assert_close(compiled_values, eager_values)\n        print(\"Compiled output\
    \ matches eager.\")\n\n    except Exception:\n        print(\"Compiled failed:\")\n        traceback.print_exc()\n\
    \        raise\n\n\nif __name__ == \"__main__\":\n    main()\n```\n\n### Actual behavior\n\nEager\
    \ execution succeeds:\n```\nRunning eager...\nEager succeeded.\nEager output sum: 9.313737869262695\n\
    ```\n\nCompiled execution fails:\n\nRunning compiled...\nCompiled failed:\n```\ntorch.fx.experimental.symbolic_shapes.GuardOnDataDependentSymNode:\n\
    Could not extract specialized integer from data-dependent expression u0\n```\nRelevant stack trace:\n\
    ```\nFile \"repro.py\", line 35, in f\n    nt *= nt._max_seqlen\n\nFile \"torch/nested/_internal/nested_tensor.py\"\
    , line 237, in _max_seqlen\n    return self._get_max_seqlen()\n\nFile \"torch/nested/_internal/nested_tensor.py\"\
    , line 19"
