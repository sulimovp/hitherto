  title: torch.nested.nested_tensor — INTERNAL ASSERT FAILED on MPS for strided layout
  body: "### \U0001F41B Describe the bug\n\ntorch.baddbmm — INTERNAL ASSERT FAILED on MPS for size-0 batch\
    \ dimensions\n\ntorch.baddbmm raises an internal RuntimeError on MPS when batch1 has a\nsize-0 dimension\
    \ (e.g. shape (2, 0, 3)).  PyTorch does not reject the call\nat the Python boundary; the MPS backend\
    \ hits a fatal assertion in\nOperationUtils.mm because the placeholder buffer is empty.\n\nError message:\n\
    \  RuntimeError: [srcBuf length] > 0 INTERNAL ASSERT FAILED at\n  \".../aten/src/ATen/native/mps/OperationUtils.mm\"\
    :525, please report a bug\n  to PyTorch. Placeholder tensor is empty!\n\nRoot cause: same class of\
    \ MPS failure as torch.index_add with size-0 tensors\n(see index_add_mps_empty_placeholder_assert_20260610.py).\
    \  Size-0 dims in\nbatched matmul are valid on CPU and should produce empty output tensors.\n\nFailing\
    \ example (fuzz crash, Specialized generator, mps):\n  input=(2, 0, 1)  batch1=(2, 0, 3)  batch2=(2,\
    \ 3, 1)  dtype=float32\n  beta=0.5  alpha=100\n  hash [134c4670] × 177\n\nExpected: empty result tensor\
    \ with shape (2, 0, 1), OR a clear validation\n          error at dispatch time.\nActual:   INTERNAL\
    \ ASSERT FAILED — opaque backend assertion.\n\nAffected op:     torch.baddbmm\nAffected device: mps\
    \ (Apple Silicon)\nNot affected:    same inputs on CPU (empty result succeeds)\nVersions:        PyTorch\
    \ 2.12.0, macOS arm64 (Apple Silicon MPS)\n\n```\nimport torch\n\nINPUT_SHAPE = (2, 0, 1)\nBATCH1_SHAPE\
    \ = (2, 0, 3)\nBATCH2_SHAPE = (2, 3, 1)\nDTYPE = torch.float32\nBETA = 0.5\nALPHA = 100\n\n\nprint(f\"\
    torch version: {torch.__version__}\")\nassert torch.backends.mps.is_available(), \"MPS not available\
    \ — run on Apple Silicon\"\n\ndevice = torch.device(\"mps\")\n\n# ── Baseline: non-empty batch on\
    \ MPS ─────────────────────────────────────────\nprint(\"[baseline] non-empty baddbmm on MPS:\")\n\
    inp_ok = torch.randn(2, 3, 1, dtype=DTYPE, device=device)\nb1_ok = torch.randn(2, 3, 4, dtype=DTYPE,\
    \ device=device)\nb2_ok = torch.randn(2, 4, 1, dtype=DTYPE, device=device)\nout_ok = torch.baddbmm(inp_ok,\
    \ b1_ok, b2_ok, beta=1.0, alpha=1.0)\nprint(f\"    input={tuple(inp_ok.shape)} -> out={tuple(out_ok.shape)}\"\
    )\n\n# ── Fuzz repro: size-0 middle dim in batch1 ──────────────────────────────────\nprint(\"\\n[bug]\
    \ size-0 batch dim on MPS (fuzz example):\")\nprint(f\"    input={INPUT_SHAPE}  batch1={BATCH1_SHAPE}\
    \  batch2={BATCH2_SHAPE}\")\nprint(f\"    dtype={DTYPE}  beta={BETA}  alpha={ALPHA}\")\ninp = torch.randn(INPUT_SHAPE,\
    \ dtype=DTYPE, device=device)\nbatch1 = torch.randn(BATCH1_SHAPE, dtype=DTYPE, device=device)\nbatch2\
    \ = torch.randn(BATCH2_SHAPE, dtype=DTYPE, device=device)\ntry:\n    out = torch.baddbmm(inp, batch1,\
    \ batch2, beta=BETA, alpha=ALPHA)\n    print(f\"    result shape: {tuple(out.shape)}\")\nexcept RuntimeError\
    \ as e:\n    print(f\"    RuntimeError: {e}\")\n\nprint(\"\\n[ref] CPU (same inputs — should succeed\
    \ with empty output):\")\ninp_cpu = torch.randn(INPUT_SHAPE, dtype=DTYPE)\nbatch1_cpu = torch.randn(BATCH1_SHAPE,\
    \ dtype=DTYPE)\nbatch2_cpu = torch.randn(BATCH2_SHAPE, dtype=DTYPE)\ntry:\n    out_cpu = torch.baddbmm(inp_cpu,\
    \ batch1_cpu, batch2_cpu, beta=BETA, alpha=ALPHA)\n    print(f\"    result shape: {tuple(out_cpu.shape)}\"\
    )\nexcept Exception as e:\n    print(f\"    {type(e).__name__}: {e}\")\n```\n\n### Versions\n\nCollecting\
    \ environment information...\nPyTorch version: 2.12.0\nIs debug build: False\nCUDA used to build PyTorch:\
    \ None\nROCM used to build PyTorch: N/A\n\nOS: macOS 26.5 (arm64)\nGCC version: Could not collect\n\
    Clang version: 21.0.0 (clang-2100.1.1.101)\nCMake version: Could not collect\nLibc version: N/A\n\n\
    Python version: 3.14.5 (main, May 10 2026, 19:20:57) [Clang 22.1.3 ] (64-bit runtime)\nPython platform:\
    \ macOS-26.5-arm64-arm-64bit-Mach-O\nIs CUDA available: False\nCUDA runtime version: No CUDA\nCUDA_MODULE_LOADING\
    \ set to: N/A\nGPU models and configuration: No CUDA\nNvidia driver version: No CUDA\ncuDNN version:\
    \ No CUDA\nIs XPU available: False\nHIP runtime version: N/A\nMIOpen runtime version: N/A\nIs XNNPACK\
    \ available: True\nCaching allocator config: N/A\n\nCPU:\nApple M5\n\nVersions of relevant libraries:\n\
    [pip3] numpy==2.4.6\n[pip3] torch==2.12"
