- repo: pytorch/pytorch
  number: 150186
  topic: torch/masked
  title: '`MaskedTensor` 10x slower than `Tensor` compared with `nn.functional.softmax`'
  body: "## Context\n\nI was reading the docs on the new `MasedTensor` feature and wanted to get some\
    \ insight if it might be useful in our transformer-based model. Thus, I started with pushing a demo\
    \ input though the `softmax` function: once with a mask where certain values are set to `-inf` (typical\
    \ for the attention mask in transformers), and once with the new `MasedTensor` feature. My hope was\
    \ that the masked tensor would be faster as the masked values are skipped, but the opposite is the\
    \ case.\n\nAm I overlooking something? \n\n## MWE\n\nHere is the code to reproduce my results\n\n\
    ```py\nimport torch\nfrom torch.nn.functional import softmax\nfrom torch.masked import MaskedTensor\n\
    import torch.utils.benchmark as benchmark\n\n# Define parameters\nDEBUG = False\nbatch_size = 1 if\
    \ DEBUG else 32\nseq_len = 6 if DEBUG else 200\nembed_dim = 4 if DEBUG else 64\n\n# Set the seed\n\
    torch.manual_seed(0)\n\n# Generate random input tensor\ninput_tensor = torch.randn(batch_size, seq_len,\
    \ embed_dim)\n\n# Generate a random mask\nmask = torch.randint(0, 2, (batch_size, seq_len, embed_dim),\
    \ dtype=torch.bool)\n\n# Create the \"normal\" (tensor as it would be seen by our model)\ninput_with_minf\
    \ = input_tensor.masked_fill(~mask, float(\"-inf\"))\n\n# Create masked tensor\nmasked_input = MaskedTensor(input_tensor,\
    \ mask)\n\n# Define the benchmarking tasks\nt1 = benchmark.Timer(\n    stmt=\"softmax(input_with_minf,\
    \ dim=-1, dtype=torch.float32)\",\n    globals={\"softmax\": softmax, \"input_with_minf\": input_with_minf},\n\
    )\n\nt2 = benchmark.Timer(\n    stmt=\"softmax(masked_input, dim=-1, dtype=torch.float32)\",\n   \
    \ globals={\"softmax\": softmax, \"masked_input\": masked_input},\n)\n\n# Run the benchmarks (run\
    \ multiple iterations)\nn_iter = 1 if DEBUG else 1000\nnormal_result = t1.timeit(n_iter)\nmasked_result\
    \ = t2.timeit(n_iter) \n\n# Check if outputs are the same\nsoftmax_output_normal = softmax(input_with_minf,\
    \ dim=-1, dtype=torch.float32)\nsoftmax_output_masked = softmax(masked_input, dim=-1, dtype=torch.float32)\n\
    assert isinstance(softmax_output_masked, MaskedTensor)\nsoftmax_output_masked = softmax_output_masked.to_tensor(value=0.0)\
    \ # 0.0 is softmax-specific\noutputs_match = torch.allclose(softmax_output_normal, softmax_output_masked,\
    \ equal_nan=True)\n\n# Print results\nprint(f\"Normal Tensor median time: {normal_result.median:.6f}\
    \ s\")\nprint(f\"Masked Tensor median time: {masked_result.median:.6f} s\")\nprint(f\"Outputs Match:\
    \ {outputs_match}\")\n```\n\n## My Output (except the warnings about torch.masked being in prototype\
    \ phase)\n\n```sh\nNormal Tensor median time: 0.000589 s\nMasked Tensor median time: 0.006134 s\n\
    Outputs Match: True\n```\n\ncc @msaroufim"
  bucket: assigner_positive
  query: repo:pytorch/pytorch is:issue "torch/masked"
