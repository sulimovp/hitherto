  title: Implement shape/size functions for nestedtensor
  body: "### \U0001F680 The feature, motivation and pitch\n\nCurrently, nt.shape does not work. It just\
    \ throws an error:\r\n\r\n```\r\n>>> import torch\r\n>>> x = torch.nested_tensor([torch.rand(2), torch.rand(3)])\r\
    \n<stdin>:1: UserWarning: The PyTorch API of nested tensors is in prototype stage and will change\
    \ in the near future. (Triggered internally at /Users/runner/work/pytorch/pytorch/pytorch/aten/src/ATen/NestedTensorImpl.cpp:99.)\r\
    \n>>> x.shape\r\nTraceback (most recent call last):\r\n  File \"<stdin>\", line 1, in <module>\r\n\
    RuntimeError: Internal error: NestedTensorImpl doesn't support sizes. Please file an issue on https://github.com/pytorch/nestedtensor\r\
    \n```\r\n\r\nThe shape function has been implemented, as seen [in this colab](https://colab.research.google.com/github/pytorch/nestedtensor/blob/master/tutorials/notebooks/basic.ipynb#scrollTo=STGxLWXXVg5Z),\
    \ it just hasn't been migrated to torch.\r\n\r\nI do not see any downside to implementing this function,\
    \ as it is easy it implement (the code is already written; it just needs to be migrated), and it's\
    \ much better than throwing an error.\r\n\r\n\n\n### Alternatives\n\n_No response_\n\n### Additional\
    \ context\n\nMy use case:\r\nI am working with graph neural networks, which involve a variable number\
    \ of agents, each of which can observe a variable number of objects in the environment. if fully functional,\
    \ nestedtensor would significantly simply the problem, as it would obviate the need to store and manipulate\
    \ tensors of batch indices.\n\ncc @cpuhrsch"
