- repo: pytorch/pytorch
  number: 135704
  topic: null
  title: '[feature request] Varlen indexing function for lookup and concat of varlen BPE tokens from a
    tensor vocab (i.e. `detokenize(...)` and arrays of strings). NestedTensor could become a representation
    for arrays-of-strings'
  body: "### \U0001F680 The feature, motivation and pitch\r\n\r\nIn BPE decoding we often have a tensor\
    \ of token ids and a vocab storing an array of strings where elements may have a variable length.\
    \ Decoding in the basic way corresponds to looping over the ids, retrieving the token offset and token\
    \ size and then indexing into the vocab and concatting. In practice, this is useful for embedding\
    \ BPE detokenizer into the hermetic ONNX model and maybe slightly speeding up BPE detokenization (e.g.\
    \ for ASR).\r\n\r\nIf we have NJT representing an array of strings, the hack below is simply indexing\
    \ + flattening. Maybe this can give an impulse to representing strings / arrays of strings in bare\
    \ PyTorch (maybe as NJT) and how these can get lowered to ONNX / other simpler opsets if they do not\
    \ support arrayss of strings. Sometimes it might be god to expose publicly the lower-level NJT-like\
    \ working functions (accepting/filling offsets/lengths). \r\n\r\nI propose to add some function for\
    \ doing this in a loopless way, this function already exists in ONNX as https://github.com/onnx/onnx/blob/main/docs/Operators-ml.md#aionnxmlarrayfeatureextractor\
    \ (although not sure if this supports string-valued tensors cc @cpuhrsch @jbschlosser @bhosmer @drisspg\
    \ @soulitzer @davidberard98 @YuqingJ @justinchuby, but it appears so )\r\n\r\nThis is also very related\
    \ to handling/encoding of varlen tensors like nested/jagged tensors. Ideally, it could be represented\
    \ as some function indexing into a NJT which could present an array of strings. Especially if we want\
    \ to do it in a batched way, accepting a list of token id arrays as input and producing an array of\
    \ varlen byte strings as output.\r\n\r\nEven if such function higher-level function is not added,\
    \ some lower level / \"plumbing\" varlen+concat functions might be useful which would help constructing\
    \ index arrays: batched varlen arange, or batched slice.\r\n\r\nThis is related to:\r\n- Standardized\
    \ ways of representing/storing strings in tensor:\r\n  - https://github.com/pytorch/pytorch/issues/101699\r\
    \n- repeat_interleave which can repeat with different lengths and concat\r\n- batched arange (where\
    \ start/end vary across the batch and even `end - start` can vary)\r\n- batched varlen slicing + cat\r\
    \n- nested/jagged tensors (because both strings and tokens and even unicode characters are typically\
    \ varlen)\r\n\r\nI implemented it with crazy hacks using `repeat_interleave`, `cumsum` and `gather`\
    \ (in form of tensor indexing). But not sure if this gets exported well to ONNX. Hopefully this works\
    \ now also for legacy torch.onnx.export:\r\n- https://github.com/pytorch/pytorch/issues/128505\r\n\
    \r\n```python\r\n# works only with a single, non-batched tensor of token ids\r\n\r\nimport torch\r\
    \n\r\ndef bpedecode_loop(token_ids, token_utf8bytes, token_lens):\r\n    inds = torch.cat((torch.zeros_like(token_lens[:1]),\
    \ token_lens.cumsum(-1)))\r\n    return torch.cat([token_utf8bytes[inds[i]:inds[i_p_1]] for i, i_p_1\
    \ in zip(token_ids, token_ids + 1)])\r\n\r\ndef bpedecode_vec(token_ids, token_utf8bytes, token_lens):\r\
    \n    inds_start = torch.cat((torch.zeros_like(token_lens[:1]), token_lens[:-1].cumsum(-1)))\r\n \
    \   inds_end = inds_start + token_lens\r\n\r\n    starts = inds_start[token_ids]\r\n    ends = inds_end[token_ids]\r\
    \n    lens = token_lens[token_ids]\r\n    ones = torch.ones_like(token_ids)\r\n\r\n    starts_shifted\
    \ = torch.cat([starts[:1], starts[1:] - ends[:-1] + 1])\r\n    repeats = torch.stack([ones, lens -\
    \ 1], dim = -1).flatten()\r\n    i = torch.stack([starts_shifted, ones], dim = -1).flatten()\r\n \
    \   I = i.repeat_interleave(repeats).cumsum(-1)\r\n    return token_utf8bytes[I]\r\n\r\nif __name__\
    \ == '__main__':\r\n    token_ids = torch.tensor([1, 0, 1, 3], dtype = torch.int64)\r\n    token_utf8bytes\
    \ = torch.tensor([1, 17, 31, 2, 2, 2, 2, 3, 7], dtype = torch.uint8)\r\n    token_lens = torch.tensor([1,\
    \ 2, 4, 2], dtype = torch.int64)\r\n\r\n    print('loop:', bpedecode_loop(token_ids, token_utf8bytes,\
    \ token_lens))\r\n    print(' vec:', bpedecode_vec (token_ids, token_utf8bytes, token_lens))\r\n```\r\
    \n\r\n### Alternatives\r\n\r\n_No response_\r\n\r\n##"
  bucket: adjacent_unassigned
