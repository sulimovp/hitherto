    [pip3] mypy-extensions==1.0.0\r\n[pip3] numpy==1.25.0\r\n[pip3] torch==2.0.1\r\n[conda] Could not\
    \ collect\r\n```\r\n\r\ncc @alexsamardzic @nikitaved @pearu @cpuhrsch @amjames @bhosmer @vincentqb\
