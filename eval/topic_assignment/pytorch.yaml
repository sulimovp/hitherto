  number: 128641
  topic: torch/masked
  title: Backward is not supported by `MaskedTensor`'s `torch.maximum`
  body: "### \U0001F41B Describe the bug\n\nRunning the following code:\r\n```python\r\ntorch.maximum(\r\
    \n    MaskedTensor(\r\n        torch.tensor(5.),\r\n        torch.tensor(True),\r\n        requires_grad=True\r\
    \n    ),\r\n    MaskedTensor(\r\n        torch.tensor(10.),\r\n        torch.tensor(True)\r\n    )\r\
