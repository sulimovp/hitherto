  title: torch.compile crashes on nested_tensor_from_jagged + layer_norm with InternalTorchDynamoError
  body: "### \U0001F41B Describe the bug\n\n`torch.compile` with the Inductor backend crashes when compiling\
    \ a function that creates a jagged nested tensor and applies `F.layer_norm` to it.\n\nEager execution,\
    \ including backward, runs successfully. However, `torch.compile` fails during shape guard generation\
    \ with an `InternalTorchDynamoError`.\n\n```\nimport torch\nimport torch.nn.functional as F\n\ndevice\
    \ = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n\ntorch.manual_seed(11)\n\nvalues = torch.randn(20,\
    \ 12, device=device, requires_grad=True)\noffsets = torch.tensor([0, 6, 11, 14, 20], device=device,\
    \ dtype=torch.int64)\n\ndef fn(v, o):\n    nt = torch.nested.nested_tensor_from_jagged(v, o)\n   \
    \ return F.layer_norm(nt, [12]).values().sum()\n\nfn(values, offsets).backward()\n\ntorch._dynamo.reset()\n\
    \ntry:\n    torch.compile(fn, backend=\"inductor\")(\n        values.detach().clone().requires_grad_(True),\n\
    \        offsets,\n    )\n    print(\"OK\")\nexcept Exception as e:\n    msg = str(e).splitlines()[0]\n\
    \    matched = \"InternalTorchDynamoError\" in type(e).__name__ or \"list index out of range\" in\
    \ repr(e)\n    print(f\"raised: {type(e).__name__}: {msg[:120]}\")\n    print(\"BUG\" if matched else\
    \ \"?\")\n```\n\n### Error logs\n\nW0512 07:21:37.558000 site-packages/torch/fx/experimental/symbolic_shapes.py:6117]\
    \ [0/0] Failing guard allocated at return F.layer_norm(nt, [12]).values().sum()\n\nE0512 07:21:37.559000\
    \ site-packages/torch/_guards.py:368] [0/0] Error while creating guard:\nE0512 07:21:37.559000 site-packages/torch/_guards.py:368]\
    \ [0/0]     Source: shape_env\nE0512 07:21:37.559000 site-packages/torch/_guards.py:368] [0/0]   \
    \  Create Function: SHAPE_ENV\n\nTraceback (most recent call last):\n  File \".../torch/fx/experimental/symbolic_shapes.py\"\
