  body: "### \U0001F41B Describe the bug\n\nWhen we use SDPA, we need max_seqlen and min_seqlen. Getting\
    \ max/min_seqlen normally requires a .item call (which usually graph breaks, I think?). \r\n\r\nSo\
    \ this focuses on removing graph breaks where:\r\n* We construct the NT in the graph\r\n* we use SDPA\
    \ and\r\n* we pass in the max/min_seqlen manually.\r\n\r\nGeneral repro - the approach is to call\
    \ `nested_view_from_values_offsets_lengths` with `max_seqlen` and `min_seqlen` passed in:\r\n<details>\r\
    \n\r\n```python\r\nimport torch\r\nfrom torch.nested._internal.nested_tensor import ViewNestedFromBuffer,\
    \ nested_view_from_values_offsets_lengths\r\nimport torch._dynamo\r\n\r\n# note: for testing with\
    \ ViewNestedFromBuffer, which I wasn't able to get working\r\ntorch._dynamo.allow_in_graph(ViewNestedFromBuffer)\r\
    \n\r\n\r\ndef convert_jagged_to_nested_tensor(\r\n    values: torch.Tensor, offsets: torch.Tensor,\
    \ max_length: int\r\n) -> torch.Tensor:\r\n    # metadata_cache = {\"max_seqlen\": max_length, \"\
    min_seqlen\": 1}\r\n    # nt = ViewNestedFromBuffer.apply(values, offsets, metadata_cache)\r\n   \
    \ nt = nested_view_from_values_offsets_lengths(values, offsets, lengths=None, min_seqlen=1, max_seqlen=max_length)\r\
    \n    return nt\r\n\r\n\r\nclass MyModule(torch.nn.Module):\r\n    def __init__(self):\r\n       \
    \ super().__init__()\r\n        self.q_linear = torch.nn.Linear(8, 32*4)\r\n        self.k_linear\
    \ = torch.nn.Linear(8, 32*4)\r\n        self.v_linear = torch.nn.Linear(8, 32*4)\r\n\r\n    def forward(self,\
    \ values, offsets):\r\n        nt = convert_jagged_to_nested_tensor(values, offsets, 5)\r\n      \
    \  q, k, v = [mod(nt) for mod in (self.q_linear, self.k_linear, self.v_linear)]\r\n        q, k, v\
    \ = [\r\n            x.view(4, -1, 4, 32).transpose(1, 2)\r\n            for x in (q, k, v)\r\n  \
    \      ]\r\n        sdpa_out = torch.nn.functional.scaled_dot_product_attention(q, k, v, is_causal=False)\r\
    \n        return sdpa_out.values()\r\n\r\n\r\nvalues = torch.randn(10, 8, device='cuda')\r\noffsets\
    \ = torch.tensor([0, 1, 3, 6, 10], device='cuda')\r\n\r\n# optionally, dynamic=False; but I wasn't\
    \ able to get that to work either\r\ntorch.compile(MyModule().cuda(), fullgraph=True)(values, offsets)\r\
    \n```\r\n\r\n</details>\r\n\r\nFailure 1: With #122836 (rebased onto 7f1d5aba9376789ba4d24551688694b86f98b820)\r\
    \n\r\n<details>\r\n\r\n```\r\nTraceback (most recent call last):\r\n  File \"/home/dberard/local/scripts/nt_2.py\"\
    , line 38, in <module>\r\n    torch.compile(MyModule().cuda(), fullgraph=True)(values, offsets)\r\n\
    \  File \"/home/dberard/local/pytorch/torch/nn/modules/module.py\", line 1532, in _wrapped_call_impl\r\
    \n    return self._call_impl(*args, **kwargs)\r\n  File \"/home/dberard/local/pytorch/torch/nn/modules/module.py\"\
    , line 1541, in _call_impl\r\n    return forward_call(*args, **kwargs)\r\n  File \"/home/dberard/local/pytorch/torch/_dynamo/eval_frame.py\"\
    , line 420, in _fn\r\n    return fn(*args, **kwargs)\r\n  File \"/home/dberard/local/pytorch/torch/nn/modules/module.py\"\
    , line 1532, in _wrapped_call_impl\r\n    return self._call_impl(*args, **kwargs)\r\n  File \"/home/dberard/local/pytorch/torch/nn/modules/module.py\"\
    , line 1541, in _call_impl\r\n    return forward_call(*args, **kwargs)\r\n  File \"/home/dberard/local/pytorch/torch/_dynamo/convert_frame.py\"\
    , line 986, in catch_errors\r\n    return callback(frame, cache_entry, hooks, frame_state, skip=1)\r\
