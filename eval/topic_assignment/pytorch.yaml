  title: Enable UFMT on all files in PyTorch
  body: "### \U0001F41B Describe the bug\r\n\r\nRight now, around 1.5k files are grandfathered in as \"\
    not UFMT'ed\" in the PyTorch codebase. Let's make them all formatted!\r\n\r\nTo format a file, remove\
    \ its name from `exclude_patterns` of `UFMT` section in `.lintrunner.toml`. Then, run `lintrunner\
    \ -a --take UFMT --all-files`. You'll end up with a pull request like this: https://github.com/pytorch/pytorch/pull/123061\r\
    \n\r\n~~For ease of review, the UFMT diff should be 100% generatable from the `.lintrunner.toml` change.\
    \ In particular, if you are code reviewing a UFMT change from an untrusted source, clear all changes\
    \ except the `.lintrunner.toml` and manually rerun `lintrunner` to regenerate the changes. To verify\
    \ that there are no changes, a maintainer can use this script:~~ You may need to make fixup changes.\
    \ This means maintainers MUST verify the additional changes on top of lint. This can be done with\
    \ this script:\r\n\r\n```\r\n#!/bin/bash\r\nset -ex\r\ngh pr checkout $1\r\nREV=$(git rev-parse HEAD)\r\
    \ngit fetch origin\r\ngit checkout $(git merge-base origin/main HEAD)\r\ngit checkout $REV .lintrunner.toml\r\
    \nlintrunner init\r\nlintrunner -a --take UFMT --all-files\r\ngit diff $REV\r\n```\r\n\r\nIn some\
    \ cases, preparatory work needs to be done.  Here are some known problems:\r\n\r\n* torch/cuda/_memory_viz.py\
    \ - mypy type: ignore annotations get moved in such a way that an ignore is no longer applied to the\
    \ correct line\r\n* test/functorch/test_control_flow.py - flake8: reformatting moves flake8 ignore\
    \ to the wrong line, and now a multiline string no longer has flake8 suppressed\r\n* torch/masked/\
    \ - the import reordering causes an import cycle\r\n* ... probably more ...\r\n\r\nThese problems\
    \ should be resolved in preparatory commits BEFORE the UFMT commit, for ease of review.\r\n\r\nHow\
    \ to split the work? I decided to bundle things up by directory, so long as there were not too many\
    \ changes in one directory that necessitated splitting it up. With https://gist.github.com/ezyang/6c10a63d5795cbd7787beeea94497948\
    \ I did a sweep to find an optimal threshold:\r\n\r\n<img width=\"679\" alt=\"image\" src=\"https://github.com/pytorch/pytorch/assets/13564/3d9a1774-2b70-4dfd-8999-3bd2c48e1ec0\"\
    >\r\n\r\n13k seems like a good splitting point. Here is the worklist:\r\n\r\n- [ ] `    7 - test/_test_bazel.py`\r\
    \n- [x] ` 1831 - test/ao`\r\n- [x] `  635 - test/autograd`\r\n- [x] `   33 - test/backends`\r\n- [\
    \ ] `  231 - test/benchmark_utils`\r\n- [ ] `    9 - test/bottleneck_test`\r\n- [ ] `   49 - test/conftest.py`\r\
    \n- [ ] `  127 - test/cpp`\r\n- [x] `  660 - test/cpp_api_parity`\r\n- [x] `  108 - test/cpp_extensions`\r\
    \n- [x] `    4 - test/create_dummy_torchscript_model.py`\r\n- [x] `   14 - test/custom_backend`\r\n\
    - [x] `   32 - test/custom_operator`\r\n- [ ] ` 6342 - test/distributed` https://github.com/pytorch/pytorch/pull/123539\r\
    \n- [x] ` 5766 - test/distributions` https://github.com/pytorch/pytorch/pull/123527\r\n- [x] `   91\
    \ - test/error_messages` https://github.com/pytorch/pytorch/pull/123527\r\n- [ ] `  837 - test/export`\
    \ https://github.com/pytorch/pytorch/pull/123520 https://github.com/pytorch/pytorch/pull/123527\r\n\
    - [x] `   40 - test/forward_backward_compatibility` https://github.com/pytorch/pytorch/pull/123527\r\
    \n- [ ] `11846 - test/functorch` https://github.com/pytorch/pytorch/pull/123541 BLOCKED\r\n- [ ] `\
    \ 1784 - test/fx` https://github.com/pytorch/pytorch/issues/123062\r\n- [x] ` 9432 - test/jit` https://github.com/pytorch/pytorch/pull/123623\r\
    \n- [ ] `   59 - test/jit_hooks`\r\n- [ ] `  348 - test/lazy`\r\n- [ ] `    3 - test/linear.py`\r\n\
    - [ ] `    3 - test/load_torchscript_model.py`\r\n- [ ] `    5 - test/mkl_verbose.py`\r\n- [ ] ` \
    \   6 - test/mkldnn_verbose.py`\r\n- [x] `  665 - test/mobile` https://github.com/pytorch/pytorch/pull/123521\r\
    \n- [ ] ` 7397 - test/nn`\r\n- [ ] `    1 - test/onnx_caffe2` https://github.com/pytorch/pytorch/pull/123901\r\
    \n- [ ] `  346 - test/optim` https://github.com/pytorch/pytorch/pull/123901\r\n- [ ] `   41 - test/package`\
    \ https://github.com/pytorch/pytorch/pull/123901\r\n- [ ] ` 1019 - test/profiler` https://github.com/pytorch/pytorch/pull/12390"
