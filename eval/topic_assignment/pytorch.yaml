  title: 'NestedTensor: max_dim / min_dim not working for integer tensors'
  body: "### \U0001F41B Describe the bug\n\n# Bug Description\n\nCalling `.max(dim=...)`. `.min(dim=...)`,\
    \ `.argmax(dim=...)`, or `.argmin(dim=...)` on a nested jagged tensor *with integer datatype* raises\
    \ an error. The functions are supported, however, for floating point types.\n\n# Cause\n\nThe implementation\
    \ accesses `torch.finfo` to determine the minimum value for the given type. For integral types, `torch.iinfo`\
    \ would have to be used instead.\n\n# Minimal Reproducing Example\n\n```python\nimport torch\n\nx\
    \ = torch.nested.nested_tensor(\n    [torch.arange(0, n) for n in (10, 20, 30)],\n    layout=torch.jagged,\n\
    )\nprint(x.max(dim=1).values)\n```\n\n## Expected Result\n\n```\ntensor([9, 19, 29])\n```\n\n## Actual\
    \ Result (Error)\n\n```python-traceback\n---------------------------------------------------------------------------\n\
    TypeError                                 Traceback (most recent call last)\nCell In[7], line 1\n\
    ----> 1 x.max(dim=1).values\n\nFile ~/software/anaconda3/envs/torch28/lib/python3.12/site-packages/torch/nested/_internal/nested_tensor.py:367,\
    \ in NestedTensor.__torch_function__(cls, func, types, args, kwargs)\n    365     pass\n    366 with\
    \ torch._C.DisableTorchFunctionSubclass():\n--> 367     return func(*args, **kwargs)\n\nFile ~/software/anaconda3/envs/torch28/lib/python3.12/site-packages/torch/nested/_internal/nested_tensor.py:332,\
    \ in NestedTensor.__torch_dispatch__(cls, func, types, args, kwargs)\n    330 fn = lookup_jagged(func,\
    \ *args, **kwargs)\n    331 if fn is not None:\n--> 332     return fn(*args, **kwargs)\n    334 #\
    \ Poor man's redispatch for composite ops. This becomes relevant under inference\n    335 # mode,\
    \ where disabling autograd key dispatch prevents decomposition.\n    336 all_dks = (\n    337    \
    \ # We want to handle both the cases where NestedTensor overrides the\n    338     # composite implicit\
    \ autograd kernel, and the case where it doesn't.\n   (...)    341     torch._C.DispatchKey.CompositeImplicitAutograd,\n\
    \    342 )\n\nFile ~/software/anaconda3/envs/torch28/lib/python3.12/site-packages/torch/nested/_internal/ops.py:218,\
    \ in register_func.<locals>.wrapper.<locals>.get_inner.<locals>.inner(*args, **kwargs)\n    216 def\
    \ inner(*args, **kwargs):\n    217     check_schema(schema_str, func, *args, **kwargs)\n--> 218  \
    \   return func(aten_op, *args, **kwargs)\n\nFile ~/software/anaconda3/envs/torch28/lib/python3.12/site-packages/torch/nested/_internal/ops.py:2057,\
    \ in max_dim(func, *args, **kwargs)\n   2051 @register_jagged_func(torch.ops.aten.max.dim, \"self:\
    \ jt_all, dim: any, keepdim: any?\")\n   2052 def max_dim(func, *args, **kwargs):\n   2053     _,\
    \ new_kwargs = normalize_function(  # type: ignore[misc]\n   2054         func, args=args, kwargs=kwargs,\
    \ normalize_to_only_use_kwargs=True\n   2055     )\n-> 2057     dtype_min = torch.finfo(new_kwargs[\"\
    input\"].dtype).min\n   2058     return _apply_reduction(func, \"max\", dtype_min, *args, **kwargs)\n\
    \nTypeError: torch.finfo() requires a floating point input type. Use torch.iinfo to handle 'torch.finfo'\n\
    ```\n\n# Workaround\n\nCast the tensor to float and back:\n\n```python\nprint(x.float().max(dim=1).values.long())\n\
    ```\n\n### Versions\n\nPyTorch version: 2.8.0+cu128\nIs debug build: False\nCUDA used to build PyTorch:\
    \ 12.8\nROCM used to build PyTorch: N/A\n\nOS: Ubuntu 24.04.2 LTS (x86_64)\nGCC version: (Ubuntu 13.3.0-6ubuntu2~24.04)\
    \ 13.3.0\nClang version: Could not collect\nCMake version: version 3.28.3\nLibc version: glibc-2.39\n\
    \nPython version: 3.12.11 | packaged by Anaconda, Inc. | (main, Jun  5 2025, 13:09:17) [GCC 11.2.0]\
    \ (64-bit runtime)\nPython platform: Linux-6.11.0-29-generic-x86_64-with-glibc2.39\nIs CUDA available:\
    \ True\nCUDA runtime version: 12.6.85\nCUDA_MODULE_LOADING set to: LAZY\nGPU models and configuration:\
    \ \nGPU 0: NVIDIA GeForce RTX 5090\nGPU 1: NVIDIA RTX A400\n\nNvidia driver version: 575.57.08\ncuDNN\
    \ version: Could not collect\nIs XPU available: False\nHIP runtime version: N/A\nMIOpen runtime version:\
    \ N/A\nIs XNNPACK available: True\n\nCPU:\nArchitecture:                         x86_64\nCPU op-mode(s):\
