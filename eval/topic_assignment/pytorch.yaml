  title: Implement KV cached attention with NestedTensor
  body: "### \U0001F680 The feature, motivation and pitch\r\n\r\nNestedTensor would save tons of resource\
    \ in SDPA, but it seems to be missing some feature to implement kv cached attention with NestedTensor.\
    \ Or at least missing a best practice?\r\n\r\nHow do I store the cached kv? And how do I concat the\
    \ cached and new kv together?\r\n\r\n\r\nHeres are some of failed my attempts:\r\n1. concat new tensor\
    \ to exist NT\r\n```python\r\nbatch_size=8\r\nmemory_seq_len=9\r\nnew_seq_len=2\r\nn_head=4\r\nhead_dim=16\r\
    \n\r\n# model inputs\r\ncache_keys_normal = torch.rand(batch_size,memory_seq_len,n_head,head_dim)\
    \ # same seq_len for simple demo here\r\nnew_keys_normal = torch.rand(batch_size,new_seq_len,n_head,head_dim)\r\
    \n# -----------\r\n\r\ncache_keys = torch.nested.as_nested_tensor(list(cache_keys_normal.unbind(0)))\r\
    \nnew_keys = torch.nested.as_nested_tensor(list(new_keys_normal.unbind(0)))\r\n\r\nconcated_keys =\
    \ torch.cat([cache_keys,new_keys], dim=1)\r\n# RuntimeError: setStorage: sizes [88, 4, 16], strides\
    \ [64, 16, 1], storage offset 5632, and itemsize 4 requiring a storage size of 45056 are out of bounds\
    \ for storage of size 22528\r\n# It seems we can only concat dim=0 and dim=-1 of NT currently, not\
    \ dim=1\r\n```\r\n\r\n2. build NT after normal concat, using narrow()\r\n```python\r\nconcated_keys_normal\
    \ = torch.cat([cache_keys_normal,new_keys_normal], dim=1)\r\nconcated_keys_nested = torch.nested.narrow(concated_keys_normal,\
    \ 1, 1, 11, layout=torch.jagged)\r\n\r\nconcated_keys_nested = concated_keys_nested.transpose(1, 2)\r\
    \n# ValueError: transpose(): not supported on jagged layout nested tensor with holes\r\n```\r\n\r\n\
    3. same as attempt 2, but tranpose before build NT\r\n```python\r\nconcated_keys_nested = torch.nested.narrow(concated_keys_normal.transpose(1,2),\
    \ 2, 1, 11, layout=torch.jagged)\r\n# RuntimeError: jagged layout only supports dim=1\r\n```\r\n\r\
    \n4. squeeze n_head in to batch dim, bypass the dim=1 limit\r\n```python\r\nconcated_keys_normal_squeezed\
    \ = concated_keys_normal.transpose(1,2).reshape(-1, *concated_keys_normal.shape[2:])\r\nconcated_keys_nested\
    \ = torch.nested.narrow(concated_keys_normal_squeezed, 1, 1, 11, layout=torch.jagged)\r\n\r\nF.scaled_dot_product_attention(concated_keys_nested,\
    \ concated_keys_nested, concated_keys_nested) # just use same tensor as qkv here for demo\r\n#   File\
    \ \"/opt/miniforge311/lib/python3.11/site-packages/torch/nested/_internal/ops.py\", line 736, in transpose_int\r\
    \n#    raise ValueError(\r\n# ValueError: transpose(): not supported on jagged layout nested tensor\
    \ with holes\r\n```\r\n\r\n\r\n### Alternatives\r\n\r\n_No response_\r\n\r\n### Additional context\r\
    \n\r\n_No response_\n\ncc @cpuhrsch @jbschlosser @bhosmer @drisspg @soulitzer"
