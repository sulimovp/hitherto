- repo: pytorch/pytorch
  number: 192226
  topic: null
  title: 'BUG: Out of Bounds Reads with offset/strided views on compiled kernels'
  body: "### \U0001F41B Describe the bug\n\nSections marked as AI analysis are reviewed and edited by\
    \ me for clarity.\n\nAI Analysis:\n> When a tensor that is a view with a non-zero `storage_offset`\
    \ is passed as a mutated pointer argument to a raw `triton.jit` kernel, `torch.compile` silently produces\
    \ an incorrect result. This is due to data being read from beyond the end of a buffer into memory.\n\
    \nMy Analysis:\nAt a high level, strided/offset views of tensors can read out of bounds when used\
    \ with torch compile in some edge cases.\n\nAI Analysis:\n> The over-read is normally invisible because\
    \ the kernel overwrites the whole region. The edge case is when the kernel skips writing part of its\
    \ output as a performance optimization. E.G \"if this row is masked/ignored, return early\".\n\nMy\
    \ Analysis:\nThe primary edge case is when we are dealing with masked tensors, where not all of the\
    \ tensor is used as a performance optimization.\n\nAI Analysis:\n> This bug was originally found when\
    \ compiling Liger-Kernel's `LigerFusedLinearJSD`  and `LigerFusedLinearCrossEntropy` functions, where\
    \ it silently corrupted outputs returning incorrect losses compared to eager execution whenever any\
    \ label was `ignore_index` was present. Both of these failures can be silent.\nI introduced a workaround\
    \ with Liger at https://github.com/linkedin/Liger-Kernel/pull/1338, however the bug is fundamentally\
    \ in PyTorch.\n\nMy Analysis:\nI was using those kernels and ran into this bug. You can make a workaround\
    \ in Liger, but this is a Pytorch bug.\n\n## Reproduction\n\n\nWith AI assistance, I created a script\
    \ which depends only on `torch` and `triton`.\n\nAI Analysis:\n> The script poisons the caching allocator\
    \ so the\ncorruption is identifiable. The usual `compute-sanitizer --tool memcheck` does not flag\
    \ this, because CUDA mappings are page-granular and a small over-read still lands in mapped memory.\n\
    \nMy Analysis:\nIn other words, when the overruns are small enough, you land in your paged memory\
    \ pool, which is still technically owned by the process and doesn't immediately fault.\n\nThe AI reproduction\
    \ script is\n\n```python\nimport torch, triton, triton.language as tl\n\nN, R, SKIP, POISON, DEV =\
    \ 2048, 4, 1, 12345.0, \"cuda\"\n\n@triton.jit\ndef maybe_fill(out_ptr, do_write, n_cols, BLOCK: tl.constexpr):\n\
    \    \"\"\"Fill out_ptr[0:n_cols] with 1.0, but only when do_write != 0.\"\"\"\n    if do_write !=\
    \ 0:\n        offs = tl.arange(0, BLOCK)\n        tl.store(out_ptr + offs, 1.0, mask=offs < n_cols)\n\
    \ndef run():\n    base = torch.zeros(R, N, device=DEV, dtype=torch.float32)\n    for i in range(R):\n\
    \        row = base[i : i + 1]                       # view, storage_offset = i * N\n        maybe_fill[(1,)](row,\
    \ 0 if i == SKIP else 1, N, BLOCK=N)\n        base[i : i + 1] = row                       # write-back\n\
    \    return base\n\ndef poison_allocator(count=2048):\n    junk = [torch.full((N,), POISON, device=DEV,\
    \ dtype=torch.float32) for _ in range(count)]\n    del junk\n    torch.cuda.synchronize()\n\nexpected\
    \ = torch.zeros(R, N, device=DEV)\nexpected[[i for i in range(R) if i != SKIP]] = 1.0\n\npoison_allocator();\
    \ eager = run().clone()\ncf = torch.compile(run, fullgraph=True); cf()      # compile before poisoning\n\
    poison_allocator(); compiled = cf().clone()\n\nprint(\"eager    matches:\", torch.equal(eager, expected))\n\
    print(\"compiled matches:\", torch.equal(compiled, expected))\nprint(\"freed-memory value present:\"\
    , int((compiled == POISON).sum()), \"elements\")\n```\n\nAI Analysis:\n> Row `SKIP` is never written\
    \ by the kernel, so it must remain zero in both runs.\n\n**Observed:**\n\n```text\neager    matches:\
    \ True\ncompiled matches: False\nfreed-memory value present: 2048 elements\n```\n\n> The poison value\
    \ `12345.0` never exists in live tensors. It is written into memory that was freed before the call.\
    \ Its presence is direct evidence of an out-of-bounds read.\n\nMy Analysis:\nThe AI generated script\
    \ perfectly captures the bug that we are trying to resolve.\n\n### Mechanism\n\nAI Analysis\n> Three\
    \ different pieces interact to cause the bug. The first two are individually reasonable. T"
