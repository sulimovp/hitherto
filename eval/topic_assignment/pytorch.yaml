  title: TypeIs Not Found in typing_extensions for python version 3.10
  body: "### \U0001F41B Describe the bug\n\nEncountered an issue with a recent merge in the PyTorch repository\
    \ ([https://github.com/pytorch/pytorch/commit/cf60fe53a83bafec0857d5b49c2054de6ba4cddc](https://github.com/pytorch/pytorch/commit/cf60fe53a83bafec0857d5b49c2054de6ba4cddc))\r\
    \nThe issue arises because `TypeIs` was changed from `TypeGuard`.  It is proposed for a future version\
    \ of  python (3.13) but does not currently work on 3.10. \r\nLink: https://peps.python.org/pep-0742/\r\
    \n\r\nReverting the change to use `TypeGuard` resolves the issue.\r\nTo reproduce this bug, run a\
    \ torchrun command in an environment with python version 3.10: \r\n \r\n `torchrun -node_rank=${ARRAY_INDEX}\
    \ --master_addr=${MASTER_ADDR} --master_port=49228  --nproc_per_node=8 --nnodes=1 test.py`\r\n\r\n\
    `test.py` is a simple `Hello World` print program. \r\n \r\n The error that I get is: \r\n`ImportError:\
    \ cannot import name 'TypeIs' from 'typing_extensions' (/usr/local/lib/python3.10/dist-packages/typing_extensions.py)`\r\
    \n\r\nThe files where 'TypeGuard' was changed to 'TypeIs':\r\n- torch/__init__.py\r\n- torch/_dynamo/utils.py\r\
    \n- torch/_inductor/pattern_matcher.py\r\n- torch/_subclasses/fake_tensor.py\r\n- torch/masked/maskedtensor/core.py\r\
    \n- torch/nn/parameter.pyi\r\n- torch/serialization.py\r\n- torch/utils/_python_dispatch.py\r\n- torch/utils/_sympy/value_ranges.py\r\
    \n\r\nReverting the change to use `TypeGuard` resolves the issue.\r\n\n\n### Versions\n\n```\r\ntorchrun\
    \ -node_rank=${ARRAY_INDEX} --master_addr=${MASTER_ADDR} --master_port=49228  --nproc_per_node=8 --nnodes=1\
    \  /workspace/test.py\r\nTraceback (most recent call last):\r\n  File \"/usr/local/bin/torchrun\"\
    , line 33, in <module>\r\n    sys.exit(load_entry_point('torch==2.2.0a0+81ea7a4', 'console_scripts',\
    \ 'torchrun')())\r\n  File \"/usr/local/bin/torchrun\", line 25, in importlib_load_entry_point\r\n\
    \    return next(matches).load()\r\n  File \"/usr/lib/python3.10/importlib/metadata/__init__.py\"\
