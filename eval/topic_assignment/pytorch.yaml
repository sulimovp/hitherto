- repo: pytorch/pytorch
  number: 137464
  topic: null
  title: Add support for using NestedTensors with linalg operations
  body: "### \U0001F680 The feature, motivation and pitch\r\n\r\nI have a scenario where I'm currently\
    \ calling `torch.linalg.ldl_factor` on a bunch of tensors and then repeatedly calling `torch.linalg.ldl_solve`\
    \ as part of an iterative linear systems solver. Currently I have to do this in a loop for each tensor,\
    \ as all my tensors may not have exactly the same dimensions. For example, one tensor may be 1024x1024\
    \ and another may be 1019x1019, so I can't create a batch and use that.\r\n\r\nIt would be really\
    \ handy to be able to use NestedTensor's with these operations to batch the call (to take advantage\
    \ of multiprocessing of batched operations, and to optionally ship it to the GPU), as I could then\
    \ store a single NestedTensor with the factorisations (ideally having a slick, inbuilt method to store\
    \ only the elements from the lower triangle, to save memory when there's no real need to store the\
    \ upper triangle of zeros) and then be able to repeatedly call the solver during the iterations with\
    \ the NestedTensor factorisations (and have it parse the lower triangle back to the solver as required).\r\
    \n\r\n### Alternatives\r\n\r\nCurrently has to be performed individually for each tensor in a loop.\r\
    \n\r\n### Additional context\r\n\r\n_No response_\n\ncc @jianyuh @nikitaved @pearu @mruberry @walterddr\
    \ @xwang233 @Lezcano @cpuhrsch @jbschlosser @bhosmer @drisspg @soulitzer @davidberard98 @YuqingJ"
