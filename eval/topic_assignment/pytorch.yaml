    \ details. If NumPy is needed, it should be specified as pip dependency and installed automatically.\r\
    \n\r\nIf it's not strictly required, I propose that either no warning is shown on import or the warning\
    \ is more clear: remove the file paths, line number, example tensor and clearly explain why NumPy\
