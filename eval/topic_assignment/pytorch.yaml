  number: 104574
  topic: torch/masked
  title: Adam raises RuntimeError("Adam does not support sparse gradients, ...") for masked gradients
    due to API discrepancy
  body: "### \U0001F41B Describe the bug\r\n\r\nThere is an API discrepancy between `torch.masked.MaskedTensor.is_sparse`\
    \ and `torch.Tensor.is_sparse`, causing `torch.optim.Adam` to raise `RuntimeError: Adam does not support\
    \ sparse gradients, please consider SparseAdam instead` for masked gradients even if the underlying\
    \ data are dense.\r\n\r\nIn particular, for `torch.Tensor`, `is_sparse` is an attribute:\r\n\r\n```python\r\
    \n>>> x = torch.randn(4)\r\n>>> x.__class__.is_sparse\r\n<attribute 'is_sparse' of 'torch._C._TensorBase'\
    \ objects>\r\n```\r\n\r\nHowever, for `torch.masked.MaskedTensor`, `is_sparse` is a method:\r\n\r\n\
    ```python\r\n>>> y = torch.masked.as_masked_tensor(x, x < 0)\r\n>>> y.__class__.is_sparse\r\n<function\
    \ torch.masked.maskedtensor.core.MaskedTensor.is_sparse(self)>\r\n```\r\n\r\nNow `torch.optim.Adam`\
    \ checks for sparse gradients like so:\r\n\r\nhttps://github.com/pytorch/pytorch/blob/7ae100628ec530e1da7bd5e5f86024afa8843a32/torch/optim/adam.py#L90-L91\r\
    \n\r\nCallables are truth-y, and, consequently, the `RuntimeError` is raised. It would be possible\
    \ to fix this discrepancy by adding a `@property` decorator in the `torch.masked.MaskedTensor` implementation\
    \ here (but it would break backwards-compatibility).\r\n\r\nhttps://github.com/pytorch/pytorch/blob/7ae100628ec530e1da7bd5e5f86024afa8843a32/torch/masked/maskedtensor/core.py#L333-L335\r\
    \n\r\n### Versions\r\n\r\n```\r\nCollecting environment information...\r\nPyTorch version: 2.0.1\r\
    \nIs debug build: False\r\nCUDA used to build PyTorch: None\r\nROCM used to build PyTorch: N/A\r\n\
