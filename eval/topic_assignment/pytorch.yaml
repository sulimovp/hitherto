  title: 'numel overflows silently on large sparse tensors '
  body: "As in title. Here's a reproducer (using the current master):\r\n```\r\n>>> torch.sparse_coo_tensor([[]]*4,\
    \ [], (10000,)*4).numel()\r\n10000000000000000\r\n>>> torch.sparse_coo_tensor([[]]*4, [], (100000,)*4).numel()\r\
    \n7766279631452241920\r\n```\r\n\r\nThe overflow is not silent in https://app.circleci.com/pipelines/github/pytorch/pytorch/315245/workflows/5572e810-d80a-44d0-8555-cabfc2caf637/jobs/13112422\
    \ that prevents testing the overflow error in https://github.com/pytorch/pytorch/pull/57492 .\r\n\r\
    \nNotice that COO sparse tensor construction always computes `numel` as `product(size)`: \r\nhttps://github.com/pytorch/pytorch/blob/dc49299078611543261949acfb1a7f1cc6e1392f/aten/src/ATen/SparseTensorImpl.h#L62\r\
    \n\r\n# Discussion\r\n\r\n\"[torch.numel returns the total number of elements in the input tensor](https://pytorch.org/docs/stable/generated/torch.numel.html?highlight=numel#torch.numel)\"\
    . This definition makes certain sense for sparse tensors if the unspecified elements are interpreted\
    \ as elements that have certain fill value, say, 0. However, in the masked semantics of sparse tensors,\
    \ the total number of elements is the total number of specified elements (=nnz). So, there exists\
    \ an interpretation-dependent ambiguity in the definition of `numel`.\r\n\r\nFor applications using\
    \ sparse tensor, the current definition can be a hard restriction: one cannot define sparse tensors\
    \ with `product(size) > max int64` because of undefined behavior in `numel`. See https://github.com/pytorch/pytorch/issues/57416\
    \ for examples.\r\n\r\nPossible solutions:\r\n1. Overflow in `numel` should trigger an exception.\r\
    \n2. To support sparse tensors with large dimensions, (i) re-define `numel` to be the number of specified\
    \ elements (=nnz) ,or (ii) avoid computing `numel` (read: un-define `numel`) for sparse tensors. (BC\
    \ warning).\r\n\r\nI think 1 makes sense anyway. 2 would allow widening the application of sparse\
    \ tensors to large masked tensor cases.\r\n\r\nWhat do you think?\n\ncc @aocsa @nikitaved @pearu @mruberry\
    \ @pietern @mrshenli @pritamdamania87 @zhaojuanmao @satgera @rohan-varma @gqchen @aazzolini @osalpekar\
    \ @jiayisuse @agolynski @SciPioneer @H-Huang @mrzzd @cbalioglu @gcramer23"
