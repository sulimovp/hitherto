- repo: pytorch/pytorch
  number: 22169
  topic: null
  title: '[RFC] NestedTensor - 0.0.1'
  body: "## Motivation\r\nMany fields manipulate collections of Tensors of different shapes. For example,\
    \ paragraphs of text, images of different sizes or audio files of different lengths. We don't have\
    \ a first class abstraction that enables the concurrent manipulation of collections of this type of\
    \ data. We further often need to batch arbitrary data and operations for efficiency.\r\n\r\n## Definition\r\
    \nA NestedTensor, just like a torch.Tensor, has a dtype, layout, device and dimension.\r\n\r\nIn general,\
    \ there are two cases for which NestedTensors provide computational representations.\r\n\r\n**Lists\
    \ of Tensors** \r\nEach Tensor constituent of the list it represents, if any, must be of its dtype,\
    \ layout and device. The dimension of a constituent Tensor must be one less than the dimension of\
    \ the NestedTensor. An empty list of Tensors yields a NestedTensor of dimension one.\r\n\r\n**Lists\
    \ of NestedTensors**\r\nEach constituent NestedTensor must be of its dtype, layout and device. The\
    \ dimension of a constituent NestedTensor must be one less than the dimension of the NestedTensor.\
    \ \r\n\r\nYou cannot have a list of Tensors and NestedTensors, that is, you cannot mix them. \r\n\r\
    \n## Goals and current code\r\n\r\n**Convenience:** Remove tedious manual workarounds\r\n\r\nSometimes\
    \ research can be unblocked by or inspired by convenient abstractions. New code may be built on top\
    \ of NestedTensors if it's general enough and easy enough to use (discoverable). We want to make sure\
    \ that we solve existing problems well, but also want it to be general enough to inspire new work.\r\
    \n\r\n```\r\n# This does a lot of work to use our awkward packed sequence abstraction\r\ndef forward(self,\
    \ sent_tuple):\r\n    # sent_len: [len_1, ..., len_bsize]\r\n    # sent: (seqlen x bsize x worddim)\r\
    \n    sent, sent_len = sent_tuple\r\n\r\n    # Sort by length (keep idx)\r\n    sent_len_sorted, idx_sort\
    \ = np.sort(sent_len)[::-1], np.argsort(-sent_len)\r\n    sent_len_sorted = sent_len_sorted.copy()\r\
    \n    idx_unsort = np.argsort(idx_sort)\r\n\r\n    idx_sort = torch.from_numpy(idx_sort).cuda() if\
    \ self.is_cuda() \\\r\n        else torch.from_numpy(idx_sort)\r\n    sent = sent.index_select(1,\
    \ idx_sort)\r\n\r\n    # Handling padding in Recurrent Networks\r\n    sent_packed = nn.utils.rnn.pack_padded_sequence(sent,\
    \ sent_len_sorted)\r\n    sent_output = self.enc_lstm(sent_packed)[0]  # seqlen x batch x 2*nhid\r\
    \n    sent_output = nn.utils.rnn.pad_packed_sequence(sent_output)[0]\r\n\r\n    # Un-sort by length\r\
    \n    idx_unsort = torch.from_numpy(idx_unsort).cuda() if self.is_cuda() \\\r\n        else torch.from_numpy(idx_unsort)\r\
    \n    sent_output = sent_output.index_select(1, idx_unsort)\r\n```\r\n\r\n**Correctness:** Abstract\
    \ the subtle details\r\n\r\nMany users run into subtle issues when padding and masking manually. We\
    \ can hide these details and provide an implementation that deals with all these subtleties. \r\n\r\
    \nExample 1\r\n```\r\n# Currently users have to worry about setting their masked values to\r\n# the\
    \ correct number to not influence reductions such as max.\r\ndef neginf(dtype):\r\n    \"\"\"Returns\
    \ a representable finite number near -inf for a dtype.\"\"\"\r\n    if dtype is torch.float16:\r\n\
    \        return -NEAR_INF_FP16\r\n    else:\r\n        return -NEAR_INF\r\n        \r\n[...]\r\noutputs_of_interest\
    \ = embedding_layer[:, 1:, :]\r\n# The user carries around a mask to indicate regions that aren't\
    \ relevant\r\n# This mask needs to be updated for each layer.\r\nmask = (~attention_mask[:, 1:]).type(dtype).unsqueeze(2)\
    \ * neginf(dtype)\r\nsumed_embeddings = torch.sum(outputs_of_interest * mask, dim=1)\r\nnb_elems =\
    \ torch.sum(attention_mask[:, 1:].float(), dim=1).unsqueeze(1)\r\nembeddings = sumed_embeddings /\
    \ nb_elems\r\n# This is a very complicated way of getting torch.mean(outputs_of_interest, dim=1)\r\
    \n# for variably sized entries.\r\n[...]\r\n```\r\n\r\nExample 2\r\n```\r\ntensor *= mask.unsqueeze(-1).float()\r\
    \nfor i in range(self.n_layers):\r\n    # The user manually carries around a mask to indicate regions\r\
    \n    # that aren't relevant. Each layer has custom mask support\r\n    # which the user had to implement\r\
    \n    tensor "
