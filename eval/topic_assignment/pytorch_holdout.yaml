    \ Reproduce\r\n\r\nSteps to reproduce the behavior: Following code reproduces this:\r\n\r\n```\r\n\
    import torch\r\n\r\nT, B, C = 128, 8, 32\r\n\r\n# dummy input length beyond  which to mask\r\nL =\
