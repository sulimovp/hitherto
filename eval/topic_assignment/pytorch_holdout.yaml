- repo: pytorch/pytorch
  number: 96111
  topic: null
  title: Static size boolean masking
  body: "### \U0001F41B Describe the bug\n\nA long standing request is https://github.com/pytorch/pytorch/issues/62320\
    \ ; Executorch team has agreed to implement it.\r\n\r\nOnce this is implemented, we can also get static\
    \ size boolean masking to work too. The easiest way is to convert the boolean mask into an index tensor.\
    \ You can use the meta implementation for indexing to do this:\r\n\r\n```\r\n@register_meta(aten.index.Tensor)\r\
    \ndef meta_index_Tensor(self, indices):\r\n    result: List[Optional[Tensor]] = []\r\n    for i, index\
    \ in enumerate(indices):\r\n        if index is not None:\r\n            check(\r\n              \
    \  index.dtype in [torch.long, torch.int, torch.int8, torch.bool],\r\n                lambda: \"tensors\
    \ used as indices must be long, int, byte or bool tensors\",\r\n            )\r\n            if index.dtype\
    \ in [torch.int8, torch.bool]:\r\n                nonzero = index.nonzero()\r\n                k =\
    \ len(result)\r\n                check(\r\n                    k + index.ndim <= self.ndim,\r\n  \
    \                  lambda: f\"too many indices for tensor of dimension {self.ndim}\",\r\n        \
    \            IndexError,\r\n                )\r\n                for j in range(index.ndim):\r\n \
    \                   check(\r\n                        index.shape[j] == self.shape[k + j],\r\n   \
    \                     lambda: f\"The shape of the mask {index.shape} at index {i} \"\r\n         \
    \               f\"does not match the shape of the indexed tensor {self.shape} at index {k + j}\"\
    ,\r\n                        IndexError,\r\n                    )\r\n                    result.append(nonzero.select(1,\
    \ j))\r\n            else:\r\n                result.append(index)\r\n        else:\r\n          \
    \  result.append(index)\r\n    return result\r\n\r\n```\r\n\r\nThe main annoyance is that if there\
    \ are not enough elements to fill the nonzero, it will be zero padded. For a boolean mask, a zero\
    \ pad is inappropriate; instead you want an invalid index, and then to fill the indexing op with some\
    \ placeholder element like 0.\n\n### Versions\n\nmaster"
