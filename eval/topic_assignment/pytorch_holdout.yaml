    \ in case of a `bool` attention mask.\r\n\r\nhttps://github.com/pytorch/pytorch/blob/main/torch/nn/functional.py#L4923C1-L4927C39\r\
    \n\r\n```\r\nif attn_mask is not None:\r\n    if attn_mask.dtype == torch.bool:\r\n        attn_mask.masked_fill_(attn_mask.logical_not(),\
