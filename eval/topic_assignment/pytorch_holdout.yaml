- repo: pytorch/pytorch
  number: 189183
  topic: torch/masked
  title: '[inductor][mtia] Fix fp16 reduction accumulator dtype mismatch'
  body: "Summary:\r\nOn MTIA the Inductor Triton backend sets `codegen_upcast_to_fp32=False`, so a low-precision\
    \ reduction keeps its source dtype for the loop-carried accumulator (`upcast_acc_dtype(torch.float16)`\
    \ returns `torch.float16`). But an op inside the reduction body can still upcast the reduced value\
    \ to fp32 unconditionally -- e.g. the mean `truediv` in the `torch.masked._std_var` two-pass composite\
    \ -- leaving the accumulated value at fp32 while the accumulator stays fp16. The generic reduction\
    \ combine never reconciled the two, so the accumulator was reassigned from fp16 to fp32 inside the\
    \ loop. TritonMTIA's stricter loop-carried type check rejects it: `Loop-carried variable _tmp23 has\
    \ initial type <fp16> but is re-assigned to <fp32> in loop`.\r\n\r\nFix: in the non-persistent reduction\
    \ combine in `triton.py`, cast the reduced value to the accumulator dtype before combining when they\
    \ differ. The cast is guarded on a dtype mismatch, so it is a no-op for backends with `codegen_upcast_to_fp32=True`\
    \ and only affects the low-precision-accumulator path.\r\n\r\nTest Plan:\r\n\r\nBefore: `masked.std;\
    \ f16x5x5x5; mask; correction=0.5; keepdim=True` failed with the loop-carried type error.\r\n\r\n\
    After: `masked.std` compiles (`1 compiled, 0 errors`); the generated kernel casts the value to fp16\
    \ and keeps the `_tmp23` accumulator fp16 throughout.\r\n\r\nDifferential Revision: D110924494\r\n\
    \r\n\r\n\r\n\r\ncc @voznesenskym @penguinwu @EikanWang @jgong5 @Guobing-Chen @XiaobingSuper @zhuhaozhe\
    \ @blzheng @wenzhe-nrv @jiayisunx @ipiszy @kadeng @muchulee8 @amjames @chauhang @aakhundov @coconutruben\
    \ @jataylo"
  bucket: assigner_positive
  query: repo:pytorch/pytorch is:pr "torch.masked"
  is_pull_request: true
