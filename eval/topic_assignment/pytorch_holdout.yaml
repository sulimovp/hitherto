  number: 121632
  topic: null
  title: '[BUG] Given boolean tgt_mask, TransformerDecoder produces wrong results with MPS backend'
  body: "### \U0001F41B Describe the bug\n\nTwo tokens are decoded in this example. Ideally, the output\
    \ feature on the first token should be the same regardless of the sequence length as a square subsequent\
    \ mask is applied. Here are two ways to generate the tgt mask. One is from the official example where\
    \ a float mask is generated first but converted into a boolean mask later. Another way is to generate\
    \ the boolean mask directly.\r\n\r\n:heavy_check_mark: If running with `cpu` backend, the three printed\
    \ values should be the same:\r\n```\r\nToken_1 (Ground Truth): [[[ 1.1367519  -0.7223548   0.81752294\
    \ -1.2319201 ]]]\r\nGround Truth: [ 1.136752  -0.7223549  0.8175233 -1.2319204]\r\nBuggy Results:\
    \ [ 1.136752  -0.7223549  0.8175233 -1.2319204]\r\n``` \r\n\r\n❌  However, if we run it on `mps` backend,\
    \ the directly generated boolean mask would result in the wrong decoded feature for the first token.\
    \ The result looked like this:\r\n```\r\nToken_1 (Ground Truth): [[[ 1.4028326  -1.0564857  -0.8273474\
    \   0.48100036]]]\r\nGround Truth: [ 1.4028326  -1.0564857  -0.8273474   0.48100036]\r\nBuggy Results:\
    \ [ 1.3671896  -1.1002903  -0.79846895  0.5315697 ]\r\n```\r\n\r\nThe bug can be reproduced by this\
    \ minimal script:\r\n```python\r\nimport torch\r\nimport torch.nn as nn\r\n\r\n# Define the parameters\r\
    \ndropout = 0.  # Dropout rate\r\nd_model = 4\r\ndevice = \"mps\"\r\n# device = \"cpu\"\r\ntorch.manual_seed(0)\r\
    \ndecoder_layer = nn.TransformerDecoderLayer(batch_first=True, d_model=d_model, nhead=1, dim_feedforward=32,\r\
    \n                                           dropout=dropout)\r\ntransformer_decoder = nn.TransformerDecoder(decoder_layer=decoder_layer,\
