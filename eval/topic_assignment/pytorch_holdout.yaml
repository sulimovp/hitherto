  title: Incorrect gradient for masked_select when inputs are non-contiguous
  body: "### \U0001F41B Describe the bug\r\n\r\nCode:\r\n\r\n```python\r\nimport torch\r\n\r\nbatch_dim\
    \ = 3\r\nin_dim = 5\r\nclasses_dim = 5\r\ntime_dim_sizes = torch.tensor([4, 3, 2], dtype=torch.int32)\r\
    \ntime_dim = 4\r\n\r\n\r\ndef pack_padded_masked_select(x: torch.Tensor, sizes: torch.Tensor) -> torch.Tensor:\r\
    \n    \"\"\"\r\n    :param x: [B,T,...]\r\n    :param sizes: [B]\r\n    :return: [sum(sizes),...]\r\
    \n    \"\"\"\r\n    batch_dim, time_dim, *remaining_dims = x.shape\r\n    mask = torch.arange(time_dim,\
    \ device=x.device)[None, :] < sizes[:, None]  # [B,T]\r\n    mask: torch.Tensor\r\n    mask_bc = mask.view(batch_dim,\
    \ time_dim, *[1] * len(remaining_dims))  # [B,T,...]\r\n    # This, together with convolution, will\
    \ cause a bad gradient?\r\n    packed = torch.masked_select(x, mask_bc)\r\n    packed = packed.view(-1,\
    \ *remaining_dims)\r\n    return packed\r\n\r\n\r\ndef pack_padded_index_select(x: torch.Tensor, sizes:\
    \ torch.Tensor) -> torch.Tensor:\r\n    \"\"\"\r\n    :param x: [B,T,...]\r\n    :param sizes: [B]\r\
    \n    :return: [sum(sizes),...]\r\n    \"\"\"\r\n    batch_dim, time_dim, *remaining_dims = x.shape\r\
    \n    mask = torch.arange(time_dim, device=x.device)[None, :] < sizes[:, None]  # [B,T]\r\n    mask:\
    \ torch.Tensor\r\n    mask = mask.reshape(-1)  # [B*T]\r\n    packed = torch.index_select(x.reshape(-1,\
    \ *remaining_dims), dim=0, index=mask.reshape(-1).nonzero().flatten())\r\n    return packed\r\n\r\n\
    \r\ndef loss_packed_masked_select(logits: torch.Tensor, targets: torch.Tensor, sizes: torch.Tensor):\r\
    \n    logits_packed = pack_padded_masked_select(logits, sizes)\r\n    targets_packed = pack_padded_masked_select(targets,\
    \ sizes)\r\n    loss_pt_packed_raw = torch.nn.CrossEntropyLoss(reduction=\"sum\")(\r\n        logits_packed,\
    \ targets_packed.long()\r\n    )\r\n    return loss_pt_packed_raw\r\n\r\n\r\ndef loss_packed_index_select(logits:\
    \ torch.Tensor, targets: torch.Tensor, sizes: torch.Tensor):\r\n    logits_packed = pack_padded_index_select(logits,\
    \ sizes)\r\n    targets_packed = pack_padded_index_select(targets, sizes)\r\n    loss_pt_packed_raw\
    \ = torch.nn.CrossEntropyLoss(reduction=\"sum\")(\r\n        logits_packed, targets_packed.long()\r\
    \n    )\r\n    return loss_pt_packed_raw\r\n\r\n\r\ndef loss_packed(logits: torch.Tensor, targets:\
    \ torch.Tensor, sizes: torch.Tensor):\r\n    logits_packed = torch.nn.utils.rnn.pack_padded_sequence(\r\
    \n        logits, sizes, batch_first=True, enforce_sorted=False\r\n    )\r\n    targets_packed = torch.nn.utils.rnn.pack_padded_sequence(\r\
    \n        targets, sizes, batch_first=True, enforce_sorted=False\r\n    )\r\n    loss = torch.nn.CrossEntropyLoss(reduction=\"\
    sum\")(\r\n        logits_packed.data, targets_packed.data.long()\r\n    )\r\n    return loss\r\n\r\
    \n\r\ndef loss_padded(logits: torch.Tensor, targets: torch.Tensor, sizes: torch.Tensor):\r\n    loss\
    \ = torch.nn.CrossEntropyLoss(reduction=\"none\")(logits.transpose(1, 2), targets.long())  # [B,T]\r\
    \n    mask = torch.arange(time_dim, device=loss.device)[None, :] < sizes[:, None]  # [B,T]\r\n   \
    \ loss = torch.where(mask, loss, torch.zeros_like(loss))\r\n    loss = loss.sum()\r\n    return loss\r\
    \n\r\n\r\ntry:\r\n    import better_exchook\r\n    better_exchook.install()\r\nexcept ImportError:\r\
    \n    pass\r\n\r\n\r\ntry:\r\n    import lovely_tensors as lt\r\n    lt.monkey_patch()\r\nexcept ImportError:\r\
    \n    pass\r\n\r\n\r\nfor loss_fn in [loss_packed, loss_padded, loss_packed_index_select, loss_packed_masked_select]:\r\
    \n    print(\"***\", loss_fn.__name__)\r\n    torch.manual_seed(42)\r\n\r\n    net = torch.nn.Conv1d(in_dim,\
    \ classes_dim, 5, padding=\"same\")\r\n\r\n    inputs = torch.randn(batch_dim, time_dim, in_dim, requires_grad=True)\r\
    \n    targets = torch.randint(0, classes_dim, (batch_dim, time_dim))\r\n\r\n    x = inputs.transpose(1,\
    \ 2)\r\n    x = net(x)\r\n    x = x.transpose(1, 2)\r\n\r\n    loss = loss_fn(x, targets, time_dim_sizes)\r\
    \n    print(\"loss:\", loss)\r\n    print(\"bias grad:\", torch.autograd.grad(loss, net.bias, create_graph=True))\r\
    \n```\r\n\r\nOutput:\r\n```\r\n*** loss_packed\r\nloss: tensor grad NllLossBackward0 15.721\r\nbias\
    \ grad: (tensor[5] x∈[-2.044, 1.539] μ=0. σ=1.628 grad ConvolutionBackwardBackward0 [-1.437, 0.733,\
    \ 1.539, 1.208, -2.044],)\r\n*** loss_padded\r\nloss: tensor g"
