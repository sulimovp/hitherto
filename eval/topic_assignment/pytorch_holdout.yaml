  title: Torch handles assignment to all-False boolean masks incorrectly
  body: "## Issue description\r\n\r\ntorch yields a RuntimeError when assigning a vector to an empty set\
    \ of indices in an array.\r\n\r\n## Code example\r\n\r\n```\r\nimport torch\r\nx = torch.zeros((2,\
    \ 2))\r\n\r\nmask = torch.tensor([True, True])\r\nprint(x[mask])\r\nx[mask] = torch.tensor([1., 2.])\r\
    \n\r\nmask = torch.tensor([True, False])\r\nprint(x[mask])\r\nx[mask] = torch.tensor([1., 2.])\r\n\
    \r\nmask = torch.tensor([False, True])\r\nprint(x[mask])\r\nx[mask] = torch.tensor([1., 2.])\r\n\r\
    \nmask = torch.tensor([False, False])\r\nprint(x[mask])\r\nx[mask] = torch.tensor([1., 2.])\r\n```\r\
    \n\r\noutputs\r\n```\r\ntensor([[0., 0.],\r\n        [0., 0.]])\r\ntensor([[1., 2.]])\r\ntensor([[1.,\
    \ 2.]])\r\ntensor([])\r\nTraceback (most recent call last):\r\n  File \"bug.py\", line 18, in <module>\r\
    \n    x[mask] = torch.tensor([1., 2.])\r\nRuntimeError: The expanded size of the tensor (0) must match\
    \ the existing size (2) at non-singleton dimension 0\r\n```\r\n\r\n## System Info\r\n```\r\n$ python\
    \ collect_env.py\r\nCollecting environment information...\r\nPyTorch version: 0.4.1\r\nIs debug build:\
    \ No\r\nCUDA used to build PyTorch: None\r\n\r\nOS: Mac OSX 10.13.6\r\nGCC version: Could not collect\r\
    \nCMake version: version 3.11.4\r\n\r\nPython version: 3.6\r\nIs CUDA available: No\r\nCUDA runtime\
    \ version: No CUDA\r\nGPU models and configuration: No CUDA\r\nNvidia driver version: No CUDA\r\n\
    cuDNN version: No CUDA\r\n\r\nVersions of relevant libraries:\r\n[pip] Could not collect\r\n[conda]\
    \ torch                     0.4.1                     <pip>\r\n$ gcc --version\r\nConfigured with:\
    \ --prefix=/Library/Developer/CommandLineTools/usr --with-gxx-include-dir=/usr/include/c++/4.2.1\r\
    \nApple LLVM version 9.1.0 (clang-902.0.39.2)\r\nTarget: x86_64-apple-darwin17.7.0\r\nThread model:\
    \ posix\r\nInstalledDir: /Library/Developer/CommandLineTools/usr/bin\r\n$ pip --version\r\npip 18.0\
    \ from /anaconda3/lib/python3.6/site-packages/pip (python 3.6)\r\n```\r\n\r\n## Current workaround\r\
    \nCurrent workaround involves using an if-statement conditioned on mask.any(), i.e.:\r\n```\r\nif\
    \ mask.any(): x[mask] = torch.tensor([1., 2.])\r\n```"
