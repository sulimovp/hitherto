- repo: pytorch/pytorch
  number: 139999
  topic: torch/masked
  title: Update torch.masked.mean to upcast dtype for bool tensors
  body: "When calling `torch.masked.mean(...)` with a boolean tensor, the dtype is inferred to be bool.\
    \ When the mean is being computed, the sum operator is used. When the sum operator is used with dtype=torch.bool,\
    \ the result is clamped to True (1) leading to an incorrect mean being calculated.\r\n\r\nThe below\
    \ example shows how the incorrect result occurs:\r\n```\r\na = torch.tensor([True, True])\r\ncount\
    \ = torch.sum(torch.ones(a.shape, dtype=torch.int64)) # 2\r\ntotal = torch.sum(a, dtype=torch.bool)\
    \ # True (1)\r\nmean = total / count # 0.5\r\n```\r\n\r\nThis PR upcasts the dtype used for the sumation\
    \ to int32 in the case of bool tensors allowing for the correct result to be computed.\n\ncc @voznesenskym\
    \ @penguinwu @EikanWang @jgong5 @Guobing-Chen @XiaobingSuper @zhuhaozhe @blzheng @wenzhe-nrv @jiayisunx\
    \ @ipiszy @yf225 @chenyang78 @kadeng @muchulee8 @ColinPeppler @amjames @desertfire @chauhang @aakhundov"
  bucket: assigner_positive
  query: repo:pytorch/pytorch is:pr MaskedTensor
  is_pull_request: true
