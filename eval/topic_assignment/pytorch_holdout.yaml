  title: GradTrackingTensor does not copy layout (issue with torch.sparse)
  body: "### \U0001F41B Describe the bug\n\n`GradTrackingTensor` wrapped around a sparse tensor breaks\
    \ with `torch.sparse.mm` due to a failing layout check. Specifically, here is a minimal example:\n\
    \n```\nimport torch\n\n\ndef f(a, x):\n    print(a.layout, x.layout)\n\n    return torch.sparse.mm(a,\
    \ x)\n\n\na = torch.sparse_coo_tensor(torch.tensor([[0, 1, 2], [1, 2, 0]]), [1.0, 1.0, 1.0])\nx =\
    \ torch.tensor([1.0, 3.0, 2.0])[:, None]\nprint(f(a, x))  # works fine\n\nvjp = torch.func.vjp(f,\
    \ a, x)[1]  # fails\n```\n\nThis produces the following output (note that the `print(a.layout, x.layout)`\
    \ call produces different outputs depending on whether it is called inside or outside of the vjp):\n\
    ```\ntorch.sparse_coo torch.strided\ntensor([[3.],\n        [2.],\n        [1.]])\ntorch.strided torch.strided\n\
    Traceback (most recent call last):\n  File \"<frozen runpy>\", line 198, in _run_module_as_main\n\
