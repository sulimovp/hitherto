- repo: pytorch/pytorch
  number: 187831
  topic: torch/masked
  title: 'fix(maskedtensor): map each kwarg from its own value in _map_mt_args_kwargs'
  body: "## Summary\n\n`_map_mt_args_kwargs` in `torch/masked/maskedtensor/core.py` maps each keyword\
    \ argument from the wrong source:\n\n```python\nimpl_args = []\nfor a in args:\n    impl_args.append(_helper(a,\
    \ map_fn))\nimpl_kwargs = {}\nfor k in kwargs:\n    impl_kwargs[k] = _helper(a, map_fn)   # uses `a`,\
    \ not `kwargs[k]`\n```\n\nThe kwargs loop calls `_helper(a, ...)`, where `a` is the loop variable\
    \ left over from the preceding `for a in args` loop, instead of `_helper(kwargs[k], ...)`. So:\n\n\
    - every kwarg is mapped from the **last positional arg's** value, ignoring the actual kwarg value;\
    \ and\n- when there are **no positional args**, `a` is never bound and the function raises `NameError`.\n\
    \nThe mapped kwargs are not always discarded. `passthrough.py` feeds them straight into the op:\n\n\
    ```python\ndata_args, data_kwargs = _map_mt_args_kwargs(args, kwargs, lambda x: x.get_data())\nresult_data\
    \ = fn(*data_args, **data_kwargs)\n```\n\nso a passthrough op invoked with a keyword argument silently\
    \ runs on the wrong tensor data (or crashes when invoked with keyword args only).\n\nThe fix maps\
    \ each kwarg from its own value, mirroring the positional-arg loop.\n\n## Test\n\nAdded `TestBasics.test_map_mt_args_kwargs_maps_each_kwarg`,\
    \ which feeds a distinct `MaskedTensor` as a kwarg and asserts the mapped kwarg matches that kwarg's\
    \ data (not the positional arg's), including the no-positional-args case that used to raise `NameError`.\n\
    \n```\npytest test/test_maskedtensor.py -k test_map_mt_args_kwargs_maps_each_kwarg\n```\n\nI could\
    \ not run the suite in my environment (no compiled `torch` build available here), so I verified the\
    \ control-flow bug with a standalone reduction of the function (`_helper` stubbed, which does not\
    \ affect the leaked-variable behavior):\n\n- `_map_mt_args_kwargs((1, 2), {\"x\": 99}, lambda v: v)`\
    \ → `([1, 2], {\"x\": 2})` before the fix (should be `{\"x\": 99}`); `([1, 2], {\"x\": 99})` after.\n\
    - `_map_mt_args_kwargs((), {\"x\": 99}, lambda v: v)` → `NameError` before the fix; `([], {\"x\":\
    \ 99})` after.\n\nRelying on CI to run the added test against a real build.\n"
  bucket: assigner_positive
  query: repo:pytorch/pytorch is:pr MaskedTensor
  is_pull_request: true
