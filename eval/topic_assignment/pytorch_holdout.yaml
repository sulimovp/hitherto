  topic: null
  title: index_put modifies incorrect dimension when boolean mask is followed by null index
  body: "### \U0001F41B Describe the bug\n\nThis needs to be explained with an example:\n```python\n>>>\
    \ import torch\n>>> x = torch.tensor([[1, 2], [3, 4]])\n>>> m = torch.tensor([True, False])\n>>> x\n\
    tensor([[1, 2],\n        [3, 4]])\n>>> torch.ops.aten.index(x, [m])\ntensor([[1, 2]])  # correct\n\
    >>> torch.ops.aten.index(x, [m, None])\ntensor([[1, 2]])  # correct\n>>> torch.ops.aten.index_put(x,\
    \ [m], torch.tensor(0))\ntensor([[0, 0],   # correct\n        [3, 4]])\n>>> torch.ops.aten.index_put(x,\
    \ [m, None], torch.tensor(0))\ntensor([[0, 2],   # incorrect, it should be [[0, 0], [3, 4]] like the\
    \ last command\n        [0, 4]])\n```\n\nNotice that we don't have this problem if instead of using\
    \ a boolean mask, we use an integer tensor.\n```python\n>>> ix = torch.tensor([0,])  # equivalent\
    \ to boolean mask m when applied on dimension of size 2\n>>> torch.ops.aten.index_put(x, [ix], torch.tensor(0))\n\
    tensor([[0, 0],\n        [3, 4]])\n>>> torch.ops.aten.index_put(x, [ix, None], torch.tensor(0))\n\
    tensor([[0, 0],\n        [3, 4]])\n```\n\n### Versions\n\nnightly\n\ncc @ezyang @gchanan @zou3519\
    \ @kadeng @msaroufim"
