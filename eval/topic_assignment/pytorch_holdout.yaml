- repo: pytorch/pytorch
  number: 155987
  topic: null
  title: '[doc] Add documentation for division by zero behavior in autograd'
  body: "Fixes #128796\r\n\r\nThis PR adds documentation about the behavior of division by zero operations\
    \ in PyTorch's autograd system. The documentation explains:\r\n\r\n1. How division by zero produces\
    \ `inf` values following IEEE-754 floating point arithmetic\r\n2. How autograd handles these cases\
    \ and why masking after division can lead to `nan` gradients\r\n3. Provides concrete examples showing\
    \ the issue\r\n4. Recommends two solutions:\r\n   - Masking before division\r\n   - Using MaskedTensor\
    \ (experimental API)\r\n\r\nThe documentation is added to the autograd notes section, making it easily\
    \ discoverable for users who encounter this common issue.\r\n\r\nThis addresses the original issue\
    \ #128796 which requested better documentation of this behavior to help users avoid common pitfalls\
    \ when dealing with division by zero in their models.\r\n\r\ndditional changes:\r\n- Fixed formatting\
    \ consistency by replacing curly apostrophes with straight apostrophes in the existing documentation\r\
    \n\r\ncc @svekars @sekyondaMeta @AlannaBurke @ezyang @albanD @gqchen @nikitaved @soulitzer @Varal7\
    \ @xmfan"
  bucket: assigner_positive
  query: repo:pytorch/pytorch is:pr MaskedTensor
  is_pull_request: true
