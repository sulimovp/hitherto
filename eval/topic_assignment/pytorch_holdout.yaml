- repo: pytorch/pytorch
  number: 57515
  topic: null
  title: Dispatch `index_put` with boolean mask argument to masked_fill/masked_scatter when possible
  body: "Patterns like \r\n```\r\na[mask] = val\r\n```\r\nor\r\n```\r\na[mask] = tensor\r\n```\r\ngo through\
    \ index_put, and convert boolean mask to Long indices. This is memory-inefficient and slow. Additionally,\
    \ when people ask for deterministic algorithms, index_put_ does an unnecessary and inefficient thing\
    \ of dispatching to sort-based algo (it's not needed for mask indexing), and sort-based algo has a\
    \ bug related to broadcasting (see #61032).\r\n\r\nDispatch them to `masked_fill`/`masked_scatter`\
    \ when possible (those functions don't convert mask to long indices). \r\nShould fix #53070 (although\
    \ #53070 can be fixed directly). \r\nAs the next step, `masked_select` should be efficiently implemented\
    \ (instead of calling into `index`), and `index` should dispatch to `masked_select` when possible\
    \ (should fix #30246)\r\n\r\nFor cpu and gpu, perf difference is significant, especially for multi-d\
    \ tensors:\r\n```\r\nimport torch\r\nfrom torch.utils.benchmark import Timer, Compare\r\n\r\nresults\
    \ = []\r\nfor device in ['cuda', 'cpu']:\r\n    for dtype in [torch.float32]:\r\n        for tensor_size\
    \ in [100_000, 500000, 1_000_000, 5000000, 10_000_000]:\r\n            if tensor_size >5000000 and\
    \ device=='cpu':\r\n                continue\r\n            for mask_true_ratio in [0, 0.25, 0.5,\
    \ 0.75, 1.]:\r\n                a = torch.rand(tensor_size, dtype=dtype, device=device)\r\n      \
    \          mask = torch.empty(tensor_size, dtype=torch.bool, device=device).bernoulli_(mask_true_ratio)\r\
    \n                size = (1000, tensor_size//1000)\r\n                val=1.\r\n                stmts\
    \ = (\"a[mask]=val\", \"a.masked_fill_(mask, val)\")\r\n                labels = (f\"index, {device}\"\
    , f\"masked_fill, {device}\")\r\n                timers = [Timer(stmt=stmt, num_threads = 10, sub_label=f\"\
    {tensor_size}, full {mask_true_ratio}\", label = \"Fill\", description = l,\r\n                globals\
    \ = globals()) for stmt, l in zip(stmts, labels)]\r\n                a=a.reshape(size)\r\n       \
    \         mask = mask.reshape(size)\r\n                timers = timers + [Timer(stmt=stmt, num_threads\
    \ = 10, sub_label=f\"{size}, full {mask_true_ratio}\", label = \"Fill\", description = l,\r\n    \
    \            globals = globals()) for stmt, l in zip(stmts, labels)]\r\n                for t in timers:\r\
    \n                    results.append(t.blocked_autorange())\r\n\r\nc=Compare(results)\r\nc.print()\r\
    \n```\r\nresults on V100/devgpu, after #58468 fix. \r\n```\r\n[------------------------------------------------\
    \ Fill ------------------------------------------------]\r\n                                |  index,\
    \ cuda  |  masked_fill, cuda  |  index, cpu  |  masked_fill, cpu\r\n10 threads: --------------------------------------------------------------------------------------------\r\
    \n      100000, full 0            |      49.3     |          5.8        |      53.0    |         34.6\
    \     \r\n      (1000, 100), full 0       |      49.7     |          5.4        |      61.6    | \
    \        34.5     \r\n      100000, full 0.25         |      59.6     |          5.8        |    \
    \ 425.8    |        106.2     \r\n      (1000, 100), full 0.25    |      62.4     |          5.9 \
    \       |     486.8    |        100.2     \r\n      100000, full 0.5          |      58.0     |  \
    \        5.7        |     603.1    |        147.3     \r\n      (1000, 100), full 0.5     |      61.3\
    \     |          5.8        |     713.8    |        132.0     \r\n      100000, full 0.75        \
    \ |      55.7     |          5.6        |     521.5    |        104.0     \r\n      (1000, 100), full\
    \ 0.75    |      61.4     |          5.7        |     656.8    |        103.5     \r\n      100000,\
    \ full 1.0          |      56.2     |          5.7        |     377.7    |         37.9     \r\n \
    \     (1000, 100), full 1.0     |      60.3     |          5.7        |     502.5    |         33.7\
    \     \r\n      500000, full 0            |      50.3     |          5.6        |     251.0    | \
    \        66.0     \r\n      (1000, 500), full 0       |      52.7     |          9.2        |    \
    \ 264.0    |         60.9     \r\n      500000, full 0.25         |      66.5     |         "
