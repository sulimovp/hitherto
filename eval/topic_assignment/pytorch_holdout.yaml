- repo: pytorch/pytorch
  number: 56896
  topic: null
  title: masked_select is x3 slower than reshaping and index_select
  body: "## \U0001F41B Bug\r\n\r\nmasked_select is about x3 slower than index select of the corresponding\
    \ nonzero'ed mask\r\n(this is true for nightly, I have not checked with stable)\r\n\r\n## To Reproduce\r\
    \n```\r\nimport torch                                                                            \
    \                                                            \r\nimport torch.utils.benchmark as benchmark\
    \                                                                                                \
    \           \r\n                                                                                 \
    \                                                                   \r\ndevice = torch.device('cuda')\
    \                                                                                                \
    \                       \r\nsize = torch.Size([100, 100, 100])                                   \
    \                                                                              \r\nmask = torch.randint(low=0,\
    \ high=2, size=size, device=device).bool()                                                       \
    \                                       \r\nx = torch.randn(size=size, device=device, dtype=torch.float)\
    \                                                                                        \r\n    \
    \                                                                                                \
    \                                                  \r\nout0 = torch.masked_select(x, mask)       \
    \                                                                                                \
    \          \r\nout1 = x.view(-1).index_select(0, mask.view(-1).nonzero().squeeze())              \
    \                                                                  \r\n                          \
    \                                                                                                \
    \                            \r\nassert (out0 == out1).all()                                     \
    \                                                                                    \r\n        \
    \                                                                                                \
    \                                              \r\nt0 = benchmark.Timer(stmt='torch.masked_select(x,\
    \ mask)', globals={'x':x, 'mask':mask})                                                          \
    \   \r\nt1 = benchmark.Timer(stmt='x.view(-1).index_select(0, mask.view(-1).nonzero().squeeze())',\
    \ globals={'x':x, 'mask':mask})                            \r\n                                  \
    \                                                                                                \
    \                    \r\nprint(t0.timeit(100))                                                   \
    \                                                                            \r\nprint(t1.timeit(100))\
    \ \r\n```\r\nOn my system this takes **140.64 us** for ``masked_select``, and **57.36 us** for the\
    \ equivalent ``index_select``.\r\n\r\nIf the initial sizes are different but broadcastable and \"\
    broadcast_tensors\" is used before index_select, a comparable slowdown is observed. This can be easily\
    \ checked with a few modifications of the script.\r\n\r\nIf instead of Size([100, 100, 100]), Size([1000\
    \ ** 3]) is used, then this prints **59.90 us** for masked_select, and **56.86 us** us for index_select,\
    \ so index_select is still faster, but the difference is much smaller. \r\n\r\n## Expected behavior\r\
    \n\r\nSince masked_select is a more specific operator than the hand made implementation with index\
    \ select, it should be faster. I couldn't find any use case where masked_select was faster.\r\n\r\n\
    ## Environment\r\n\r\nCollecting environment information...\r\nPyTorch version: 1.9.0.dev20210223\r\
    \nIs debug build: False\r\nCUDA used to build PyTorch: 10.2\r\nROCM used to build PyTorch: N/A\r\n\
    \r\nOS: Ubuntu 20.04.2 LTS (x86_64)\r\nGCC version: (Ubuntu 8.4.0-3ubuntu2) 8.4.0\r\nClang version:\
    \ 10.0.0-4ubuntu1 \r\nCMake version: version 3.16.3\r\n\r\nPython version: 3.7 (64-bit runtime)\r\n\
    Is CUDA available: True\r\nCUDA runtime version: 10.2.89\r\nGPU models and configuration: "
  bucket: adjacent_unassigned
  query: repo:pytorch/pytorch is:issue masked_select in:title
  is_pull_request: false
