- repo: pytorch/pytorch
  number: 158125
  topic: null
  title: index.Tensor doesn't properly account for boolean masks acting on multiple dimensions.
  body: "### \U0001F41B Describe the bug\n\nThe following should fail, but it doesn't (x is 4-dim and\
    \ y is 2-dim boolean tensor)\n```python\nx = np.arange(2*3*5*7).reshape(2, 3, 5, 7)\ny = torch.tensor([[True,\
    \ False, True], [False, True, True]])\ntorch.ops.aten.index.Tensor(x, [y, None, None, None])\n```\n\
    \n**Explanation:**\nAdvanced indexing makes a crucial distinction between Integer indices and Boolean\
    \ masks. Integer indices of more than one dimension still act on a single dimension of the input tensor.\
    \ However, Boolean masks of K dimensions act on K dimensions of the input tensor.\nPyTorch's ATen\
    \ op (index.Tensor) doesn't account for this when checking if the number of dimensions being indexed\
    \ exceeds the input's dimensionality.\n\n```python\n>>> import numpy as np\n>>> import torch\n>>>\
    \ np_x = np.arange(2*3*5*7).reshape(2, 3, 5, 7)\n>>> py_x = torch.arange(2*3*5*7).reshape(2, 3, 5,\
    \ 7)\n>>> y = torch.tensor([[True, False, True], [False, True, True]])\n```\n\nThe following two examples\
    \ show the correct behavior by Numpy and PyTorch's [...] operator\n\nHere, the 2-dim boolean mask\
    \ `y` acts on the first two dimensions, and the two `:` act on the last two dimensions. The 4 in the\
    \ output shape comes from the number of True values in `y`.\n```python\n>>> np_x[y, :, :].shape\n\
    (4, 5, 7)\n\n>>> py_x[y, :, :].shape\ntorch.Size([4, 5, 7])\n```\n\nBut if we exceed the number of\
    \ dimensions of `py_x/np_x`, then we get an error. This is the correct behavior\n```python\n>>> np_x[y,\
    \ :, :, :].shape\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nIndexError:\
    \ too many indices for array: array is 4-dimensional, but 5 were indexed\n\n>>> py_x[y, :, :, :].shape\n\
    Traceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nIndexError: too many\
    \ indices for tensor of dimension 4\n```\n\nHowever, ATen's index.Tensor op doesn't properly account\
    \ for this. It only errors out when the number of elements in the indices list exceeds the number\
    \ of dimensions.\n```python\n>>> torch.ops.aten.index.Tensor(py_x, [y, None, None]).shape\ntorch.Size([4,\
    \ 5, 7])\n\n>>> torch.ops.aten.index.Tensor(py_x, [y, None, None, None]).shape  # should fail but\
    \ it doesn't\ntorch.Size([4, 4, 5, 7])\n\n>>> torch.ops.aten.index.Tensor(py_x, [y, None, None, None,\
    \ None]).shape\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n  File\
    \ \"/Users/mcandales/miniconda3/envs/optimum-executorch/lib/python3.11/site-packages/torch/_ops.py\"\
    , line 806, in __call__\n    return self._op(*args, **kwargs)\n           ^^^^^^^^^^^^^^^^^^^^^^^^^\n\
    IndexError: too many indices for tensor of dimension 4 (got 5)\n```\n\n\n### Versions\n\nnightly\n\
    \ncc @albanD"
  bucket: adjacent_unassigned
