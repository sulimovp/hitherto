- repo: pytorch/pytorch
  number: 94728
  topic: null
  title: Add sparse semantics context manager.
  body: "The feature and its usage are described in https://github.com/pytorch/pytorch/pull/94728/files#diff-6d0bd55f94dcbd4ccf83f4006976fa4cb87eb06b72dc16238a21980226be6315R491\r\
    \n\r\nThis PR is a piece of addressing the problem of interpreting unspecified elements in sparse\
    \ tensors for autograd.\r\n\r\nHistorically, functions and their backward functions were written for\
    \ masked semantics, but now, we target supporting sparse semantics while the masked semantics should\
    \ be covered by `MaskedTensor` feature. In the meantime, an attempt was made to keep the operations\
    \ with masked semantics in `torch.sparse` namespace but a clean separation has never been achieved\
    \ (e.g. the backward of `torch.to_dense` is implemented using masked semantics) and with `MaskedTensor`,\
    \ `torch.sparse` would not be needed when its implementations are moved under `MaskedTensor`.\r\n\r\
    \nThis PR introduces a context manager that allows choosing the semantics of operations with sparse\
    \ tensors, both in Python and Aten, using PyTorch Context. Until we have not clearly separated the\
    \ default sparse (non-masked) semantics (within `torch` namespace) and masked semantics in `MaskedTensor`,\
    \ the introduced context manager provides a method of separating the non-masked and masked semantics\
    \ for autograd methods like `backward` (I presume we don't want to introduce `masked` kw argument\
    \ to `backward` similar to `torch.autograd.gradcheck`) as well as for backward implementations of\
    \ various operations (e.g. see the `to_dense_backward` implementation in this PR).\r\n\r\nIn fact,\
    \ the suggested feature in this PR will promote moving `torch.sparse` implementations to `torch` implementations\
    \ on sparse tensors (the implementations can use `at::globalContext().sparseSemantics()` for the expected\
    \ behavior, `MaskedTensor` operations would disable sparse semantics, for instance).\r\n\r\nStack\
    \ from [ghstack](https://github.com/ezyang/ghstack) (oldest at bottom):\n* __->__ #94728\n* #95372\n\
    \r\n\r\n\r\ncc @alexsamardzic @nikitaved @cpuhrsch @amjames @bhosmer @ezyang @albanD @zou3519 @gqchen\
    \ @soulitzer @Lezcano @Varal7"
  bucket: assigner_positive
  query: repo:pytorch/pytorch is:pr MaskedTensor
  is_pull_request: true
