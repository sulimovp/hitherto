  title: Inductor backend exception (not a graph break planned by dynamo) on aten.nonzero.default from
    boolean-mask assignment under torch.compile(dynamic=True)
  body: "### \U0001F41B Describe the bug\n\nHuman rephrasing of Claude summary.\n\nCompiling a module\
    \ that applies BatchNorm to a boolean-masked subset and writes it back (out[mask] = norm(h[mask]))\
    \ fails in the inductor backend with Exception: aten.nonzero.default, then falls back via a graph\
    \ break. Dynamo itself handles the data-dependent nonzero (unbacked symints); it is the backend that\
    \ throws, and the error text itself says \"Hint: Report an issue to the backend compiler repo\". Should\
    \ result in either a lowering for the masked pattern or a graph break planned by dynamo, not a backend\
    \ exception on a documented-supported op.\n\nAblation: backend=\"inductor\" (default mode, dynamic=True)\
    \ throws; eager is fine.\n\nMinimal reproduction:\n\n```\nimport torch\n\nclass MaskedBN(torch.nn.Module):\n\
    \    def __init__(self):\n        super().__init__()\n        self.norm = torch.nn.BatchNorm1d(8)\n\
    \n    def forward(self, h, mask_bool):\n        out = h.clone()\n        out[mask_bool] = self.norm(h[mask_bool])\n\
    \        return out\n\nm = MaskedBN().cuda()\nf = torch.compile(m, dynamic=True)\nh = torch.randn(64,\
    \ 8, device=\"cuda\", requires_grad=True)\nmask = torch.rand(64, device=\"cuda\") > 0.3\nf(h, mask).sum().backward()\n\
    \n```\nObserved in a real training run (particle-physics GNN, per-step hot path) and reduced to the\
    \ above. Severity: functional fallback since training proceeds through the break. A performance bug,\
    \ but the break lands inside the per-step region and the exception path is undocumented.\n\n### Error\
    \ logs\n\nW0818 21:05:28 torch/_dynamo/exc.py:518 [4/0] Backend compiler exception\n  Explanation:\
    \ Backend compiler `inductor` failed with aten.nonzero.default. Adding a graph break.\n  Hint: Report\
    \ an issue to the backend compiler repo.\n  Developer debug context: Backend: inductor\n    Exception:aten.nonzero.default\n\
    \    Traceback:\n      File \".../plaingraphgps.py\", line 192, in torch_dynamo_resume_in_forward_at_191\n\
    \        return out\n/usr/local/lib/python3.12/dist-packages/torch/autograd/graph.py:829: UserWarning:\n\
    \  Error detected in IndexPutBackward0. Traceback of forward call that caused the error:\n  File \"\
    .../plaingraphgps.py\", line 191, in torch_dynamo_resume_in_forward_at_191\n    out[mask_bool] = self.norm(h[mask_bool])\
    \   # BatchNorm over the real nodes only\n\n### Versions\n\n2.8.0a0+34c6371d24.nv25.08\n\ncc @chauhang\
    \ @penguinwu @ezyang @bobrenjc93 @aditvenk @laithsakka @voznesenskym @EikanWang @jgong5 @Guobing-Chen\
    \ @XiaobingSuper @zhuhaozhe @blzheng @wenzhe-nrv @jiayisunx @ipiszy @kadeng @muchulee8 @amjames @aakhundov\
    \ @coconutruben @jataylo"
