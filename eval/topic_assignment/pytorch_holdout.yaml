    \ tensor with a one-dimensional all-false boolean tensor.\r\n\r\n## To Reproduce\r\n\r\n```\r\nIn\
    \ [1]: import torch                                                                              \
    \                                                                                                \
    \                                                                                \r\n\r\nIn [2]: x\
    \ = torch.randn(10, 8).requires_grad_()                                                          \
    \                                                                                                \
    \                                                                         \r\n\r\nIn [3]: y = x[(x.sum(1)\
    \ > 0) & (x.sum(1) < 0)]    # guaranteed to be all false                                         \
    \                                                                                                \
    \                                                           \r\n\r\nIn [4]: z = y.sum()          \
    \                                                                                                \
    \                                                                                                \
    \                                                     \r\n\r\nIn [5]: z.backward()               \
