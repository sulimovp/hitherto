  title: In-place modification with double slicing (using boolean mask)
  body: "## \U0001F41B Bug\r\n\r\nCannot do in-place modification of a tensor with a double slicing using\
    \ `torch.uint8` (boolean mask) tensor.\r\n\r\n## To Reproduce\r\n\r\nSteps to reproduce the behavior:\r\
    \n\r\n```\r\nimport torch\r\n\r\na = torch.tensor([[1., 2.], [13., 4.], [8., 14.]])\r\n\r\n# Creating\
    \ a mask for those elements of a that are greater than 10\r\nb = a > 10\r\nprint(\"b is: \", b)\r\n\
    print(\"a[b] is: \", a[b])\r\n\r\n# Creating a mask for those elements of a[b] (i.e. [13., 14.]) that\
    \ are greater than 13.5\r\nc = a[b] > 13.5\r\nprint(\"c is: \", c)\r\nprint(\"a[b][c] is: \", a[b][c])\r\
    \n\r\n# HERE IS THE BUG\r\na[b][c] = torch.tensor([17.], dtype=a.dtype)\r\n# a[b][c] = torch.tensor([17.])\r\
    \n# a[b][c] = 17.\r\n\r\nprint(\"a is: \", a)\r\nprint(\"a[b] is: \", a[b])\r\n\r\n```\r\n\r\nNo error\
    \ is reported when running this code.\r\n\r\n## Expected behavior\r\n\r\nI think that it is expected\
    \ that, no matter which of the three ways I described to do the in-place modification of the tensor,\
    \ `a` should have been modified while it is not. If I use a single mask, then everything works just\
    \ fine.\r\nIf I try something else such as `a[0][0] = 17.` or `a[0, :][0] = 17.` then everything is\
    \ working (but notice that the slicing is not done with a mask (or `torch.unit8` tensor) in these\
    \ two cases.\r\n\r\nOne way to work around this issue is using another tensor:\r\n\r\n```\r\nk = a[b]\r\
    \nprint(\"k is: \", k)\r\nk[c] = 42\r\n\r\n# k as been modified\r\nprint(\"k is: \", k)\r\n\r\na[b]\
    \ = k\r\n\r\n# a has been modified\r\nprint(\"a is: \", a)\r\nprint(\"a[b] is: \",  a[b])\r\n```\r\
    \n\r\n## Environment\r\n\r\n - PyTorch Version: 1.0.1\r\n - OS: Ubuntu 18.04\r\n - How I installed\
    \ PyTorch: `conda install pytorch cudatoolkit=9.0 -c pytorch`\r\n - Python version: 3.7\r\n"
