  title: '`masked_fill` with `FloatTensor` mask will never mask but fails silently.'
  body: "### \U0001F41B Describe the bug\n\nPassing `bool` or `int` tensors as a mask input to `masked_fill`\
    \ returns the excepted result, but a `float` tensor will not mask and returns input tensor silently.\r\
    \n\r\n```\r\nimport torch\r\n\r\nx = torch.rand(4, 4)\r\nm = torch.rand(4, 4) > 0.5\r\n\r\nprint(m,\
    \ '\\n')\r\nprint(x.masked_fill(m , 0.), '\\n')\r\nprint(x.masked_fill(m.int() , 0.), '\\n')\r\nprint(x.masked_fill(m.float()\
    \ , 0.), '\\n')\r\n```\r\n\r\nOutput:\r\n```\r\ntensor([[False, False,  True,  True],\r\n        [\
    \ True, False, False, False],\r\n        [ True,  True, False, False],\r\n        [ True,  True, False,\
    \ False]])\r\n\r\ntensor([[0.8455, 0.7714, 0.0000, 0.0000],\r\n        [0.0000, 0.1767, 0.9352, 0.1114],\r\
    \n        [0.0000, 0.0000, 0.7616, 0.2102],\r\n        [0.0000, 0.0000, 0.4796, 0.1690]])\r\n\r\n\
    tensor([[0.8455, 0.7714, 0.0000, 0.0000],\r\n        [0.0000, 0.1767, 0.9352, 0.1114],\r\n       \
    \ [0.0000, 0.0000, 0.7616, 0.2102],\r\n        [0.0000, 0.0000, 0.4796, 0.1690]])\r\n\r\ntensor([[0.8455,\
    \ 0.7714, 0.7397, 0.3867],\r\n        [0.8923, 0.1767, 0.9352, 0.1114],\r\n        [0.9112, 0.1297,\
    \ 0.7616, 0.2102],\r\n        [0.9136, 0.0941, 0.4796, 0.1690]])\r\n```\r\n\r\nI feel this behaviour\
    \ is inconsistent with python's behaviour: `bool(0.0) == False` and `bool(1.0) == True` and should\
    \ return the same as the other two examples. In any case, it should at least fail when a `FloatTensor`\
    \ is passed as a mask.\n\n### Versions\n\n```\r\n$ python collect_env.py\r\nCollecting environment\
