  title: masked_fill supports PrivateUse1, when value.device.type is cpu
  body: "### \U0001F41B Describe the bug\n\nWe added a device as privateuse1. I'm having trouble running\
    \ hf_DistilBert using benchmark. The error message is as follows\r\n```\r\nRuntimeError: Expected\
    \ `value` to be on same device as `a`\r\n```\r\nThe corresponding code is\r\n```\r\n@register_decomposition(aten.masked_fill)\r\
    \n@out_wrapper()\r\ndef masked_fill(a: TensorLikeType, mask: TensorLikeType, value: TensorOrNumberLikeType):\r\
    \n    python_type = utils.dtype_to_type(a.dtype)\r\n    if isinstance(value, Number):\r\n        value_type\
    \ = type(value)\r\n    else:\r\n        # NOTE: Could not use value = item(value) as it resulted in\r\
    \n        # RuntimeError: Cannot cast FakeTensor(cpu) to number\r\n        value_ndim = value.ndim\r\
    \n        torch._check(\r\n            value_ndim == 0,\r\n            lambda: f\"only supports a\
    \ 0-dimensional value tensor, but got tensor with {value_ndim} dimension\",\r\n        )\r\n     \
    \   # `masked_fill` allows cpu scalar to be moved to cuda and xpu but not otherwise.\r\n        is_cpu_scalar\
    \ = a.device.type in [\"cuda\", \"xpu\"] and value.device.type == \"cpu\"\r\n        torch._check(\r\
    \n            is_cpu_scalar or value.device == a.device,\r\n            lambda: \"Expected `value`\
    \ to be on same device as `a`\",\r\n        )\r\n        value_type = utils.dtype_to_type(value.dtype)\r\
    \n```\r\n\r\nhttps://github.com/pytorch/pytorch/blob/34bce27f0d12bf7226b37dfe365660aad456701a/torch/_refs/__init__.py#L5555\r\
    \n\r\nWhen a.device.type is `torch._C._get_privateuse1_backend_name()`（Not cuda or xpu）, and value.device.type\
    \ is 'cpu', I expect 'is_cpu_scalar' is True, but because a.device.type does not equal to 'cuda' or\
    \ 'xpu', causing 'torch.check( is_cpu_scalar or value.device == a.device,)' failed.\r\n\r\nModifying\
    \ the code as follows can make the model pass, but I don't know if there will be problems or other\
    \ restrictions.\r\n```\r\n is_cpu_scalar = a.device.type in [\"cuda\", \"xpu\", torch._C._get_privateuse1_backend_name()`]\
    \ and value.device.type == \"cpu\"\r\n```\n\n### Versions\n\npytorch commit id:3df1b3b0ade3214b9030224667b187bb1d712b1f"
