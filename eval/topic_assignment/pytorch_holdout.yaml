  topic: torch/masked
  title: Fix masked tensor test_stack memory leak
  body: "This test is currently failing in trunk when memory leak check is enabled, for example https://github.com/pytorch/pytorch/actions/runs/11296206361/job/31422348823#step:22:1970.\
    \  When testing locally, calling `backward` on a masked tensor always causes memory leak until I clean\
    \ up the data and the mask manually.  This is probably related to this warning from masked tensor\
    \ `UserWarning: It is not recommended to create a MaskedTensor with a tensor that requires_grad. To\
    \ avoid this, you can use data.clone().detach()`, but I don't know much about the internal details\
    \ here to go further.  So, let's just fix the test first/\r\n\r\n### Testing\r\n\r\n```\r\nPYTORCH_TEST_CUDA_MEM_LEAK_CHECK=1\
    \ python test/test_maskedtensor.py TestBasicsCUDA.test_stack_cuda\r\n```\r\n\r\npasses and doesn't\
    \ warn about memory leak anymore.\r\n\r\nThe test itself came from https://github.com/pytorch/pytorch/pull/125262#issuecomment-2344068012"
  bucket: assigner_positive
