  title: Tensor slicing with boolean numpy mask wrong
  body: "## \U0001F41B Bug\r\nNumpy arrays of dtype `np.bool` should be interpreted as masks when slicing\
    \ torch arrays, just like tensors of dtype `torch.bool` are. Insead, such arrays are interpreted as\
    \ indices.\r\n\r\n## To Reproduce\r\nSteps to reproduce the behavior:\r\n\r\n```python\r\nt = torch.tensor(range(5))\r\
    \nmask = np.array([False, True, True, False, True])\r\n\r\nprint(t[mask.astype(np.bool)])\r\nprint(t[mask.astype(np.uint8)])\r\
    \n```\r\nOutput\r\n```bash\r\ntensor([0, 1, 1, 0, 1])\r\ntensor([1, 2, 4])\r\n```\r\n## Expected behavior\r\
    \nThe expected behaviour is that the result is the same as for slicing with torch tensors with the\
    \ same dtype, where for the input\r\n```python\r\nt = torch.tensor(range(5))\r\nmask = torch.tensor([False,\
    \ True, True, False, True])\r\n\r\nprint(t[mask.to(torch.bool)])\r\nprint(t[mask.to(torch.uint8)])\r\
    \n```\r\nwe get the expected output\r\n```bash\r\ntensor([1, 2, 4])\r\ntensor([1, 2, 4])\r\n```\r\n\
    \r\n## Environment\r\n - PyTorch Version: 1.2.0a0+0885dd2\r\n - OS: Ubuntu 16.04.6 LTS\r\n - How you\
    \ installed PyTorch: Nvidia docker image (`FROM nvcr.io/nvidia/pytorch:19.06-py3`)\r\n - Python version:\
    \ 3.6\r\n - CUDA/cuDNN version: Nvidia driver version: 384.183, ` /usr/lib/x86_64-linux-gnu/libcudnn.so.7.6.0`\r\
    \n - GPU models and configuration: Tesla V100\r\n"
