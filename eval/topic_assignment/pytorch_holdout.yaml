  title: '[torch.compile] TransformerEncoder with boolean src_key_padding_mask fails under Dynamo fullgraph
    mode'
  body: "### \U0001F41B Describe the bug\n\n### Describe the bug\n\nCompiling a simple `nn.TransformerEncoder`\
    \ model with `torch.compile(fullgraph=True)` fails when a boolean `src_key_padding_mask` is passed.\n\
    \nEager mode works correctly, but `torch.compile` raises `torch._dynamo.exc.Unsupported` because of\
    \ an internal call to `torch._nested_tensor_from_mask_left_aligned`, which returns a `bool` instead\
    \ of a `Tensor`.\n\n### Minimal Reproducible Example\n```python\nimport torch\nimport torch.nn as\
    \ nn\n\nclass TinyEnc(nn.Module):\n    def __init__(self, d_model=512, nhead=8, num_layers=1):\n \
    \       super().__init__()\n        layer = nn.TransformerEncoderLayer(\n            d_model=d_model,\
    \ nhead=nhead, batch_first=True, dropout=0.1\n        )\n        self.enc = nn.TransformerEncoder(layer,\
    \ num_layers=num_layers)\n        self.proj = nn.Linear(d_model, 10)\n\n    def forward(self, x, pad_mask):\n\
    \        # Passing src_key_padding_mask triggers torch._nested_tensor_from_mask_left_aligned\n   \
    \     y = self.enc(x, mask=None, src_key_padding_mask=pad_mask)\n        return self.proj(y)\n\ndef\
    \ main():\n    torch.manual_seed(0)\n    m = TinyEnc().eval()\n\n    B, T, C = 1, 41, 512\n    x =\
    \ torch.randn(B, T, C, dtype=torch.float32)\n    pad_mask = (torch.rand(B, T) > 0.5)\n    pad_mask[...,\
    \ 0] = True\n\n    # Eager is fine\n    with torch.inference_mode():\n        y = m(x, pad_mask)\n\
    \    print(\"eager ok:\", tuple(y.shape))\n\n    # Compile (fullgraph=True required to reproduce)\n\
    \    cm = torch.compile(m, backend=\"inductor\", fullgraph=True)\n    _ = cm(x, pad_mask)\n\nif __name__\
    \ == \"__main__\":\n    main()\n```\n\n### Observed error\n```\neager ok: (1, 41, 10)\n\ntorch._dynamo.exc.Unsupported:\
    \ torch.* op returned non-Tensor\n  Explanation: torch.* ops that return a non-Tensor cannot be traced\
    \ into the Dynamo FX graph output\n\nDeveloper debug context: example_value type: bool; op: call_function;\
    \ \ntarget: <built-in method _nested_tensor_from_mask_left_aligned of type object at 0x...>\n\nfrom\
    \ user code:\n   File \"test.py\", line 16, in forward\n    y = self.enc(x, mask=None, src_key_padding_mask=pad_mask)\n\
    \   File \"torch/nn/modules/transformer.py\", line 467, in forward\n    ) and not torch._nested_tensor_from_mask_left_aligned(\n\
    ```\n\n### Versions\n\n```\nPyTorch version:  2.8.0a0+gitba56102 & 2.9.0a0+git31d5c67\nIs debug build:\
    \ True\nCUDA used to build PyTorch: 12.6\nROCM used to build PyTorch: N/A\n\nOS: Ubuntu 22.04.4 LTS\
    \ (x86_64)\nGCC version: (Ubuntu 12.3.0-1ubuntu1~22.04) 12.3.0\nClang version: Could not collect\n\
    CMake version: version 3.22.1\nLibc version: glibc-2.35\n\nPython version: 3.10.16 (main, Dec 11 2024,\
    \ 16:24:50) [GCC 11.2.0] (64-bit runtime)\nPython platform: Linux-6.8.0-59-generic-x86_64-with-glibc2.35\n\
    Is CUDA available: True\n```\n\ncc @albanD @mruberry @jbschlosser @walterddr @mikaylagawarecki @malfet\
    \ @chauhang @penguinwu"
