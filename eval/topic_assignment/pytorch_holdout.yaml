  number: 45125
  topic: null
  title: 'Boolean indexing of an ndarray with a torch.tensor mask breaks for size=1 '
  body: "## \U0001F41B Bug\r\n\r\nNumpy allows to index arrays with boolean pytorch tensors and usually\
    \ behaves just like pytorch. However, for a dimension of size 1 a pytorch boolean mask is interpreted\
    \ as an integer index. As a result, indexing of `np.ones(1)` with a `torch.ones(1, dtype=torch.bool)`\
    \ returns an error as it tries to access the second element. Expected behaviour is achieved by casting\
    \ the tensor to numpy.\r\n\r\n## To Reproduce\r\n\r\nIf the mask is False, indexing with a tensor\
    \ returns the first element:\r\n```\r\nimport torch\r\nimport numpy as np\r\nx = torch.zeros(1, dtype=torch.bool)\r\
    \ny = np.ones(1)\r\nprint(y[x.numpy()])\r\nprint(y[x])\r\n```\r\noutputs:\r\n```\r\n[]\r\n1.0\r\n\
    ```\r\nIf the mask is True, the second print raises an error:\r\n```\r\nimport torch\r\nimport numpy\
    \ as np\r\nx = torch.ones(1, dtype=torch.bool)\r\ny = np.ones(1)\r\nprint(y[x.numpy()])\r\nprint(y[x])\r\
    \n```\r\noutputs:\r\n```\r\n[1.]\r\n---------------------------------------------------------------------------\r\
    \n\r\nIndexError                                Traceback (most recent call last)\r\n\r\n<ipython-input-58-c59be12007b5>\
    \ in <module>()\r\n      2 y = np.ones(1)\r\n      3 print(y[x.numpy()])\r\n----> 4 print(y[x])\r\n\
    \r\nIndexError: index 1 is out of bounds for axis 0 with size 1\r\n```\r\n\r\n## Expected behavior\r\
    \n\r\nFor more than one element, the behaviour is as expected:\r\n```\r\nimport torch\r\nimport numpy\
    \ as np\r\nx = torch.ones(2, dtype=torch.bool)\r\ny = np.ones(2)\r\nprint(y[x.numpy()])\r\nprint(y[x])\r\
    \n```\r\noutputs:\r\n```\r\n[1. 1.]\r\n[1. 1.]\r\n```\r\n\r\n## Environment\r\nPython 3.6.9, NumPy\
    \ 1.19.2, PyTorch 1.6.0\r\n\r\n## Additional context\r\n\r\nI initially raised an issue in the numpy\
    \ repository (https://github.com/numpy/numpy/issues/17348), but was advised to open one here as it\
    \ appears to be a pytorch problem (probably explained in https://github.com/pytorch/pytorch/pull/4732#issuecomment-696435710).\r\
    \n\n\ncc @mruberry @rgommers @heitorschueroff"
  bucket: adjacent_unassigned
  query: repo:pytorch/pytorch is:issue "boolean mask" in:title
  is_pull_request: false
