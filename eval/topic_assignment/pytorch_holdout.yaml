  title: masked_fill_ (and possibly others) produces a different output than masked_fill on cpu
  body: "## Issue description\r\n\r\n`masked_fill_` produces an output different from its out-of-place\
    \ counterpart on cpu.\r\n\r\n## To Reproduce\r\n`masked_fill_` on cpu:\r\n```python\r\ntensor_cpu\
    \ = torch.LongTensor([[0], [1]]).expand(2, 4)\r\nmask_cpu = torch.BoolTensor(\r\n    [[False,  True,\
    \ False, False],\r\n     [False, False, False, False]]\r\n    )\r\ntensor_cpu.masked_fill_(mask_cpu,\
    \ 3)\r\nprint(tensor_cpu)\r\n```\r\nOutput:\r\n```\r\ntensor([[3, 3, 3, 3],\r\n        [1, 1, 1, 1]])\r\
    \n```\r\nNotice that the first row of the output tensor is filled with 3 instead of only the second\
    \ item in this row as specified by `mask_cpu`.\r\n\r\n## Expected Behavior\r\nOne would expect `masked_fill_`\
    \ and `masked_fill` to produce the same output on cpu and gpu.\r\n\r\n`masked_fill` on cpu:\r\n```python\r\
    \ntensor_cpu = torch.LongTensor([[0], [1]]).expand(2, 4)\r\nmasked_tensor_cpu = tensor_cpu.masked_fill(mask_cpu,\
    \ 3)\r\nprint(masked_tensor_cpu)\r\n```\r\nOutput:\r\n```\r\ntensor([[0, 3, 0, 0],\r\n        [1,\
    \ 1, 1, 1]])\r\n```\r\n\r\nThe expected behavior is also produced by `masked_fill_` and `masked_fill`\
    \ on gpu:\r\n```python\r\ntensor_cuda = torch.LongTensor([[0], [1]]).expand(2, 4).to('cuda')\r\nmask_cuda\
    \ = torch.BoolTensor(\r\n    [[False,  True, False, False],\r\n     [False, False, False, False]]\r\
    \n    ).to('cuda')\r\nmasked_tensor_cuda = tensor_cuda.masked_fill(mask_cuda, 3)\r\nprint(masked_tensor_cuda)\
    \                   # out-of-place version\r\ntensor_cuda.masked_fill_(mask_cuda, 3)\r\nprint(tensor_cuda)\
    \                          # in-place version\r\n```\r\nOutput:\r\n```\r\ntensor([[0, 3, 0, 0],\r\n\
    \        [1, 1, 1, 1]], device='cuda:0')\r\ntensor([[0, 3, 0, 0],\r\n        [1, 1, 1, 1]], device='cuda:0')\r\
    \n```\r\n\r\n## Possible Source\r\nI'm guessing this has something to do with `expand` while initializing\
    \ `tensor_cpu`. If I do not use `expand`, I get the expected behavior from `masked_fill_` on cpu:\r\
    \n```python\r\nother_cpu = torch.LongTensor(\r\n    [[0, 0, 0, 0],\r\n     [1, 1, 1, 1]]\r\n    )\r\
    \nprint(other_cpu.masked_fill_(mask_cpu, 3))\r\n```\r\nOutput:\r\n```\r\ntensor([[0, 3, 0, 0],\r\n\
    \        [1, 1, 1, 1]])\r\n```\r\n\r\n## System Info\r\nHere's the output of your `collect_env.py`\
    \ script:\r\n```\r\nCollecting environment information...\r\nPyTorch version: 1.5.0\r\nIs debug build:\
    \ No\r\nCUDA used to build PyTorch: 10.2\r\n\r\nOS: Ubuntu 18.04.4 LTS\r\nGCC version: (Ubuntu 7.5.0-3ubuntu1~18.04)\
    \ 7.5.0\r\nCMake version: Could not collect\r\n\r\nPython version: 3.7\r\nIs CUDA available: Yes\r\
    \nCUDA runtime version: Could not collect\r\nGPU models and configuration: GPU 0: GeForce 840M\r\n\
    Nvidia driver version: 440.82\r\ncuDNN version: Could not collect\r\n\r\nVersions of relevant libraries:\r\
    \n[pip] numpy==1.18.1\r\n[pip] numpydoc==0.9.2\r\n[pip] torch==1.5.0\r\n[pip] torchtext==0.6.0\r\n\
    [pip] torchvision==0.6.0a0+82fd1c8\r\n[conda] blas                      1.0                      \
    \   mkl  \r\n[conda] cudatoolkit               10.2.89              hfd86e86_1  \r\n[conda] mkl  \
    \                     2020.1                      217  \r\n[conda] mkl-service               2.3.0\
    \            py37he904b0f_0  \r\n[conda] mkl_fft                   1.0.15           py37ha843d7b_0\
    \  \r\n[conda] mkl_random                1.1.1            py37h0573a6f_0  \r\n[conda] numpy      \
    \               1.18.1           py37h4f9e942_0  \r\n[conda] numpy-base                1.18.1    \
    \       py37hde5b4d6_1  \r\n[conda] numpydoc                  0.9.2                      py_0  \r\n\
    [conda] pytorch                   1.5.0           py3.7_cuda10.2.89_cudnn7.6.5_0    pytorch\r\n[conda]\
    \ torchtext                 0.6.0                      py_1    pytorch\r\n[conda] torchvision    \
    \           0.6.0                py37_cu102    pytorch\r\n```\r\n\n\ncc @ezyang @gchanan @zou3519"
