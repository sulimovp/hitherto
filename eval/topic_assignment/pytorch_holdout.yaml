- repo: pytorch/pytorch
  number: 170400
  topic: null
  title: Clarify inverted boolean mask logic between nn.MultiHeadAttention and F.scaled_dot_product_attention
  body: "### \U0001F4DA The doc issue\n\n### \U0001F680 Motivation\n\nI am opening this issue to suggest\
    \ a documentation improvement regarding a common \"gotcha\" when migrating between `nn.MultiHeadAttention`\
    \ (MHA) and `F.scaled_dot_product_attention` (SDPA).\n\nMany users (including myself) have noticed\
    \ that the boolean mask semantics are inverted between these two APIs, which can lead to silent bugs\
    \ during migration.\n\n### \U0001F50D The Inconsistency\n\n  * **`nn.MultiHeadAttention` (`key_padding_mask`)**:\
    \ `True` means **PADDING** (Ignore/Mask out).\n  * **`F.scaled_dot_product_attention` (`attn_mask`)**:\
    \ `True` means **KEEP** (Attend to).\n\nWhile this behavior is hinted at in the SDPA docstring's pseudo-code\
    \ implementation:\n\n```python\nif attn_mask.dtype == torch.bool:\n    attn_bias.masked_fill_(attn_mask.logical_not(),\
    \ float(\"-inf\"))\n```\n\nThe use of `.logical_not()` confirms that SDPA expects `True` to be kept,\
    \ whereas MHA expects `True` to be masked. This implicit difference is easy to overlook if one relies\
    \ solely on parameter names or prior MHA experience.\n\n### ✅ Verification\n\nI have verified this\
    \ behavior with a minimal reproduction script on PyTorch 2.5.1, confirming that passing the identical\
    \ boolean mask to both APIs results in opposite attention patterns (MHA ignores the `True` index,\
    \ while SDPA attends to it).\n\nThanks for considering this clarification\\!\n\n### Suggest a potential\
    \ alternative/fix\n\nTo improve Developer Experience (DX) and prevent confusion for users moving in\
    \ either direction (MHA -\\> SDPA or SDPA -\\> MHA), I suggest adding a **Note** or **Warning** block\
    \ in the documentation for `F.scaled_dot_product_attention`.\n\n**Example phrasing:**\n\n> **Note:**\
    \ The boolean mask semantics for `attn_mask` here are the **inverse** of `nn.MultiHeadAttention.forward`'s\
    \ `key_padding_mask`.\n>\n>   * In `F.scaled_dot_product_attention`, `True` indicates values to **participate**\
    \ in attention.\n>   * In `nn.MultiHeadAttention`, `True` indicates values to be **masked out** (padding).\n\
    >\n> If migrating from MHA, ensure you invert your boolean mask (e.g., using `~mask` or `mask.logical_not()`).\n\
    \ncc @svekars @sekyondaMeta @AlannaBurke @albanD @mruberry @jbschlosser @walterddr @mikaylagawarecki"
