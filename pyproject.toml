[project]
name = "whether"
version = "0.1.0"
description = "Evidence-first OSS contribution assessment CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]
web = [
    "flask>=3",
    "markdown>=3",
]

[project.urls]
Homepage = "https://github.com/sulimovp/casefile"
Repository = "https://github.com/sulimovp/casefile"

[project.scripts]
whether = "casefile.cli:app"
whether-web = "casefile.web.app:main"
casefile = "casefile.cli:app"
casefile-web = "casefile.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casefile"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real GitHub/LLM APIs (enable with CASEFILE_RUN_LIVE=1)",
]
